<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14102b">
<title>Quiz-Abend</title>
<style>
  :root { --bg: #14102b; --ink: #fff; --muted: #b9b2e6; --a: #e5484d; --b: #3e8ef7; --c: #f5b014; --d: #2fb36d; --pc: #6a5acd; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif, "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji"; background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: rgba(255,255,255,.06); font-weight: 800; }
  header .av { width: 36px; height: 36px; border-radius: 50%; background: var(--pc); display: grid; place-items: center; font-size: 20px; }
  header .score { margin-left: auto; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.1); padding: 4px 12px; border-radius: 99px; }
  main { flex: 1; display: flex; flex-direction: column; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
  h1 { font-size: 34px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; }
  h1 span { color: var(--c); }
  p { color: var(--muted); font-size: 17px; line-height: 1.4; }
  input { width: 100%; font: inherit; font-size: 22px; font-weight: 700; padding: 16px 18px; border-radius: 14px; border: 3px solid transparent; background: #fff; color: #1b1440; text-align: center; outline: none; }
  input:focus { border-color: var(--c); }
  .btn { width: 100%;   /* volle Breite auf allen Handys */ font: inherit; font-size: 21px; font-weight: 900; padding: 17px; border-radius: 14px; border: none; background: var(--c); color: #1b1440; box-shadow: 0 5px 0 rgba(0,0,0,.3); cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .btn:disabled { opacity: .4; }
  .btn.ghost { background: rgba(255,255,255,.12); color: #fff; }
  .err { color: #ff8787; font-weight: 700; min-height: 1.4em; }
  .big { font-size: 72px; line-height: 1; }
  .sdnum { font-weight: 800; font-variant-numeric: tabular-nums; }
  .grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
  .ans { border: 3px solid var(--k); background: var(--kd); border-radius: 18px; color: #fff; font: inherit; font-weight: 800; font-size: 21px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px; box-shadow: 0 6px 0 rgba(0,0,0,.3); cursor: pointer; }
  .ans .shape { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; background: var(--k); color: var(--kt); font-size: 28px; font-weight: 900; line-height: 1; }
  .ans:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  /* Antwortfarben (A–D): dunkle Kachel, farbiger Rand, Buchstabe – bewusst kein Kahoot-Look; --k Akzent, --kd Kachel, --kt Schrift auf Akzent */
  .c0 { --k: #ec6a4c; --kd: #2c1a1a; --kt: #3a120a; } .c1 { --k: #4aa3f0; --kd: #14223a; --kt: #062a4d; }
  .c2 { --k: #e6b23a; --kd: #2a2414; --kt: #3a2a05; } .c3 { --k: #79b84a; --kd: #1a2617; --kt: #1b3309; }
  .ptsbadge { display: inline-block; color: var(--c); border: 2px solid var(--c); border-radius: 99px; padding: 0 8px; margin-right: 8px; font-weight: 900; }
  .qhead { border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: 14px; margin-bottom: 16px; }
  .ql1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  /* Frageart und Pills: gleiche Schrift, gleiche Höhe (Frageart = Pill ohne Rand, wie am Fernseher), Icon nicht höher als die Schrift */
  .qcat, .qpts { font-size: 16px; font-weight: 900; line-height: 1.15; border: 2px solid transparent; border-radius: 99px; padding: 3px 0; white-space: nowrap; display: inline-flex; align-items: center; }
  .qcat { gap: 6px; }
  .qico { font-size: .9em; line-height: 1; }
  .qpts { color: var(--c); border-color: var(--c); padding: 3px 11px; }
  .qpts.sp { background: var(--c); color: #1b1440; }
  .qpts.rk { background: #c4001d; border-color: #ff3347; color: #fff; }
  .center.risk h1 { color: #ff4757; font-size: 40px; letter-spacing: .03em; }
  .center.risk .big .fa { --fc: #ff3347 !important; }
  .rkhint { color: #ff8a96; font-weight: 800; }
  .rkskip { margin-top: 12px; border: 2px solid #8a80c9; color: #ddd6ff; font-size: 18px; padding: 13px; }
  .qptsg { display: flex; gap: 6px; }
  .ql1.three .qcat, .ql1.three .qpts { font-size: 14px; }   /* drei Teile (Spezialfrage): etwas kleiner, damit alles in eine Zeile passt */
  .ql1.three .qpts { padding: 3px 9px; }
  .ql2 { display: flex; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-weight: 800; font-size: 13px; white-space: nowrap; min-height: 16px; }
  .ql2 .qwho { white-space: normal; }
  .qsegs { flex: 1; display: flex; gap: 5px; }
  .qsegs i { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); }
  .qsegs i.done { background: rgba(255,255,255,.4); }
  .qsegs i.cur { background: var(--c); }
  .qbar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .qbar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
  /* Aufforderung unter dem Kopf: groß und weiß, Hinweis in Lesegröße */
  .qask { text-align: center; margin-bottom: 16px; }
  .qask h2 { font-size: 24px; font-weight: 900; color: #fff; margin: 0; letter-spacing: -0.01em; line-height: 1.15; }
  .qask p { color: var(--muted); font-size: 15px; font-weight: 600; margin: 6px 0 0; line-height: 1.35; }
  .chosen { width: 130px; height: 130px; border-radius: 26px; display: grid; place-items: center; font-size: 76px; font-weight: 900; color: var(--k); background: var(--kd); border: 4px solid var(--k); box-shadow: 0 6px 0 rgba(0,0,0,.3); }
  .res { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; animation: pop .4s cubic-bezier(.2,1.5,.4,1) both; }
  .res.ok { background: #2fb36d; } .res.bad { background: #e5484d; } .res.none { background: #3b3363; }
  .res h1 { font-size: 40px; } .res p { color: rgba(255,255,255,.9); font-size: 20px; font-weight: 700; }
  .hueip { width: 100%; box-sizing: border-box; margin: 8px 0; padding: 12px; border-radius: 12px; border: 0; font-size: 16px; }
  .huelist { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .huelist .btn { width: auto; margin: 0; }
  .reload { width: 1em; height: 1em; display: block; }
  .spin { display: inline-block; vertical-align: -0.12em; animation: spin 1.2s linear infinite; }
  .sysb .reload { display: inline-block; vertical-align: -0.12em; }
  .sysb .spin, .sysb > span { margin-right: .35em; }
  .center .big .reload { margin: 0 auto; color: var(--c); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pq { background: rgba(255,255,255,.07); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border: 2px solid transparent; }
  .pq.sp { border-color: var(--c); }
  .pqhead { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); font-weight: 700; }
  .pqnum { width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #1b1440; display: grid; place-items: center; font-weight: 900; }
  .pqlvl { margin-left: auto; color: var(--c); letter-spacing: 2px; }
  .pqstar { color: var(--c); font-weight: 900; font-size: 14px; }
  .pqtext { font-size: 17px; font-weight: 800; line-height: 1.3; }
  .pqpack { font-size: 13px; color: var(--muted); }
  .pqbtns { display: flex; gap: 6px; }
  .pqbtns button { flex: 1; height: 44px; border: none; border-radius: 10px; background: rgba(255,255,255,.12); color: #fff; font: inherit; font-size: 20px; font-weight: 900; cursor: pointer; }
  .pqbtns button:disabled { opacity: .3; }
  .pqbtns button.on { background: var(--c); color: #1b1440; }
  .pick .pqhead { width: 100%; font-size: 13px; }
  .pick { display: flex; flex-direction: column; gap: 4px; text-align: left; width: 100%; border: 2px solid transparent; border-radius: 12px; background: rgba(255,255,255,.07); color: #fff; font: inherit; font-size: 15px; font-weight: 700; padding: 10px 12px; cursor: pointer; }
  .pick.cur { border-color: var(--c); } .pick:disabled { opacity: .35; }
  .mod { display: flex; flex-direction: column; gap: 12px; padding-bottom: 90px; }
  .mstatus { font-size: 15px; font-weight: 800; color: var(--c); }
  .mq { background: rgba(255,255,255,.07); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .mcat { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 800; }
  .mtext { font-size: 19px; font-weight: 900; line-height: 1.3; }
  .msol { display: flex; flex-direction: column; gap: 6px; }
  .msol div { background: rgba(255,255,255,.08); border-radius: 10px; padding: 8px 10px; font-weight: 700; }
  .msol div.ok { background: rgba(47,179,109,.45); }
  .msol div.no { background: rgba(229,72,77,.4); }
  /* Richtig oder falsch */
  .tfq { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; width: 100%; text-align: left; }
  .tfitem { background: rgba(255,255,255,.08); border-radius: 14px; padding: 12px; }
  .tfst { font-size: 18px; font-weight: 800; line-height: 1.3; display: flex; gap: 10px; align-items: flex-start; }
  .tfn { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--c); color: #1b1440; display: grid; place-items: center; font-weight: 900; font-size: 15px; }
  .tfbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .tfb { font: inherit; font-size: 17px; font-weight: 900; border: 3px solid transparent; border-radius: 12px; padding: 12px 6px; background: rgba(255,255,255,.1); color: #fff; }
  .tfb.yes.on { background: #2fb36d; border-color: #fff; }
  .tfb.no.on { background: #e5484d; border-color: #fff; }
  .tfitem.tfr.ok { background: rgba(47,179,109,.35); } .tfitem.tfr.bad { background: rgba(229,72,77,.35); }
  .tfmine { margin-top: 6px; font-size: 15px; opacity: .9; }
  .msol span { opacity: .7; margin-right: 4px; }
  .mans { background: rgba(255,255,255,.07); border-radius: 14px; padding: 12px; font-size: 15px; }
  .mavs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .mavs span { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: rgba(255,255,255,.08); opacity: .35; }
  .mavs span.on { opacity: 1; background: var(--pc); }
  .mbtn { position: fixed; left: 16px; right: 16px; bottom: 16px; width: auto; z-index: 5; }
  .mbtn.ghost { background: #2c2552; }
  .wlog summary { cursor: pointer; color: var(--muted); font-weight: 700; padding: 6px 0; }
  .wlog pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; line-height: 1.45; background: rgba(0,0,0,.3); border-radius: 10px; padding: 10px; user-select: text; -webkit-user-select: text; }
  .wlog .btn { margin: 6px 0; }
  .sysout code { display: block; margin-top: 6px; font-size: 12px; word-break: break-all; }
  .later { font-size: 15px; opacity: .8; margin-top: 18px; }
  .res .gain { font-size: 30px; font-weight: 900; background: rgba(0,0,0,.18); padding: 8px 22px; border-radius: 99px; }
  .rank { font-size: 64px; font-weight: 900; color: var(--c); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .offline { position: fixed; top: 0; left: 0; right: 0; background: #e5484d; color: #fff; text-align: center; padding: 8px; font-weight: 700; font-size: 14px; display: none; z-index: 9; }
  .leave { background: none; border: none; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; margin-top: 8px; }
  .small { font-size: 14px; color: var(--muted); }
  .btn.sm { width: auto; font-size: 16px; padding: 10px 18px; }
  .btn + .btn { margin-top: 2px; }
  .badge { display: inline-block; background: var(--c); color: #1b1440; border-radius: 99px; padding: 2px 10px; margin-right: 8px; font-weight: 900; }
  .hint { text-align: center; font-size: 14px; margin-bottom: 10px; }
  .center.top { justify-content: flex-start; padding-top: 10px; }
  /* Schätzen */
  /* Host-PIN */
  .pinbanner { display: flex; align-items: center; gap: 10px; background: rgba(245,176,20,.14); border: 1.5px solid rgba(245,176,20,.5); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .pinbanner span { font-size: 22px; } .pinbanner p { flex: 1; font-size: 14px; font-weight: 700; margin: 0; }
  .pintext { text-align: center; color: var(--muted); font-size: 16px; margin: 4px 6px 6px; }
  .pboxes { display: flex; justify-content: center; gap: 12px; margin: 8px 0; }
  .pbox { width: 54px; height: 62px; border-radius: 12px; background: rgba(255,255,255,.08); border: 2px solid transparent; display: grid; place-items: center; font-size: 30px; font-weight: 900; }
  .pbox.on { border-color: var(--c); background: rgba(245,176,20,.15); }
  .pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pinpad button { height: 62px; border-radius: 14px; border: none; background: rgba(255,255,255,.1); color: #fff; font: inherit; font-size: 26px; font-weight: 800; }
  .center2 { text-align: center; } .center2 a { color: #fff; font-weight: 800; }
  .tile.locked { opacity: .6; } .tile.locked .go { top: 10px; }
  .devrow { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.07); border-radius: 12px; padding: 10px 12px; }
  .devrow .pn { flex: 1; display: flex; flex-direction: column; font-weight: 800; } .devrow small { color: var(--muted); font-weight: 700; }
  .note { background: rgba(255,255,255,.05); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); font-weight: 600; line-height: 1.4; }
  /* Geografie */
  .kcard { background: #fff; color: #1b1440; border-radius: 14px; padding: 10px 14px; text-align: center; font-weight: 900; font-size: 19px; margin: 6px 0 10px; }
  .kmap { position: relative; flex: 1; min-height: 260px; border-radius: 14px; overflow: hidden; background: #1d2c55; border: 2px solid rgba(255,255,255,.12); }
  .kmap svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  .kload { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .kmeer { fill: #1d2c55; } .kbg { fill: #2b2855; stroke: #4a4580; stroke-width: .5; vector-effect: non-scaling-stroke; }
  .krg { fill: #3a3570; stroke: #8b85c8; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .ksmall { fill: rgba(245,176,20,.12); stroke: rgba(245,176,20,.7); stroke-width: 1.2; stroke-dasharray: 3 2; vector-effect: non-scaling-stroke; }
  .krg.sel { fill: var(--pc); stroke: #fff; stroke-width: 2.5; } .krg.selsh { fill: rgba(0,0,0,.55); stroke: none; }
  .ksel { fill: var(--pc); stroke: #fff; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .kout { fill: #0b0920; fill-opacity: .55; pointer-events: none; } .kframe { fill: none; stroke: #f5b014; stroke-width: 2; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; pointer-events: none; }
  .ktoast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #fff; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 10px; white-space: nowrap; pointer-events: none; }
  .kzoom { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .kzoom button { width: 42px; height: 42px; border-radius: 12px; border: none; background: rgba(0,0,0,.5); color: #fff; font: inherit; font-size: 22px; font-weight: 900; }
  .khelp { font-size: 13px; color: var(--muted); text-align: center; margin: 8px 4px; }
  .est { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .display { background: #fff; color: #1b1440; border-radius: 16px; padding: 16px; text-align: center; font-size: 40px; font-weight: 900; min-height: 82px; display: flex; align-items: baseline; justify-content: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .display small { font-size: 20px; color: #6a5acd; }
  .display .ph { font-size: 20px; color: #9a94bf; font-weight: 700; }
  .pad { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button { font: inherit; font-size: 28px; font-weight: 800; border: none; border-radius: 14px; background: rgba(255,255,255,.12); color: #fff; min-height: 56px; }
  .pad button:active { background: rgba(255,255,255,.3); }
  .bigval { font-size: 48px; font-weight: 900; background: #fff; color: #1b1440; border-radius: 20px; padding: 14px 26px; }
  /* Zuordnen */
  .mslots { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .mslot { display: flex; align-items: center; gap: 12px; width: 100%; border: 3px solid transparent; border-radius: 14px; background: rgba(255,255,255,.1); color: #fff; font: inherit; font-size: 19px; font-weight: 800; padding: 10px 12px; text-align: left; }
  .mslot.active { border-color: var(--c); background: rgba(245,176,20,.15); }
  .mslot.filled { background: rgba(255,255,255,.2); }
  .mslot .mnum { width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--c); color: #1b1440; display: grid; place-items: center; font-weight: 900; }
  .mslot .mval { flex: 1; }
  .mslot .mx { opacity: .7; font-size: 18px; }
  .mslot.ok { background: rgba(47,179,109,.5); } .mslot.bad { background: rgba(229,72,77,.45); }
  .fix { font-size: 14px; color: #ffd0d0; margin: -6px 0 0 60px; text-align: left; width: 100%; }
  .pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0; min-height: 50px; }
  .pchip { position: relative; font: inherit; font-size: 18px; font-weight: 800; border: none; border-radius: 10px; background: #f5b014; color: #1b1440; padding: 12px 18px 12px 26px; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .pchip::before { content: ''; position: absolute; left: -9px; top: 50%; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); transform: translateY(-50%); }   /* Puzzle-Aussparung wie am TV */
  .mslot .mnum { position: relative; }
  .mslot .mnum::after { content: ''; position: absolute; right: -8px; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: inherit; transform: translateY(-50%); }   /* Puzzle-Nase */
  .pchip:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .res.mid { background: #d9930d; }
  .gain.dark { font-size: 26px; font-weight: 900; background: rgba(255,255,255,.12); padding: 8px 22px; border-radius: 99px; }
  /* Paketauswahl */
  .settings { display: flex; flex-direction: column; gap: 12px; }
  .shead { display: flex; align-items: center; justify-content: space-between; }
  .shead h2 { font-size: 19px; flex: 1; min-width: 0; margin: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shead .back { width: 44px; flex: none; font-size: 26px; padding: 4px 0; }
  .tgrp { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; margin: 6px 2px -4px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: rgba(255,255,255,.07); border: none; color: #fff; font: inherit; text-align: left; border-radius: 16px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px; min-height: 104px; position: relative; cursor: pointer; }
  .tile .tt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .tile .ti { font-size: 26px; line-height: 1; }
  .tile b { font-size: 17px; }
  .tile .st { font-size: 12.5px; font-weight: 700; color: var(--muted); line-height: 1.3; }
  .st .ok { color: #8ff0b5; } .st .warn { color: #ffcf66; } .st .off { color: #8d86b8; }
  .tile.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 12px; }
  .tile.wide .ti { font-size: 30px; }
  .tile .go { position: absolute; right: 12px; top: 12px; color: var(--muted); font-weight: 900; }
  .tile.wide .go { top: 50%; transform: translateY(-50%); }
  .live { background: linear-gradient(135deg, rgba(229,72,77,.25), rgba(245,176,20,.18)); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }

let lastEstQ = 0, estRevealAt = 0;
const EST_WAIT_MS = 7350;   // TV: 1,35 s Übergang + 4,5 s Slotmaschine + 1,4 s Einsortieren
const SCORES_REVEAL_MS = 10400;  // so lange braucht der Fernseher, bis die Rangliste sortiert ist
const LATER = '<p class="later">Punkte und Platz gibt\'s am Ende des Blocks 🤫</p>';
// „💡 Übrigens …“ (Feld "info") unter dem Ergebnis
const infoBox = q => q && q.info ? `<div class="ubrig"><b>💡 Übrigens</b>${esc(q.info)}</div>` : '';
function header() {
  const h = document.getElementById('hdr');
  if (!S.me) { h.style.display = 'none'; return; }
  h.style.display = '';
  document.documentElement.style.setProperty('--pc', S.me.color);
  document.getElementById('hAv').textContent = S.me.avatar;
  document.getElementById('hName').textContent = S.me.name + (S.me.isVip ? ' 👑' : '');
  const sorting = S.phase === 'scores' && Date.now() < scoresSince + SCORES_REVEAL_MS;
  if (!HIDE_PTS.includes(S.phase) && !sorting) shownScore = S.me.score;     // während eines Blocks bleibt der Stand vom letzten Blockende stehen
  document.getElementById('hScore').textContent = S.me.isHost ? '🎤 Gamemaster' : fmtPts(shownScore) + ' P';
  document.getElementById('hostBtn').style.display = (S.me.canLead || S.me.canTech) && S.phase !== 'lobby' ? '' : 'none';
}

// Punkte nach Schwierigkeit: was die Frage bringt
function ptsText(q) {
  if (!q || !q.points || q.tiebreak) return '';
  return q.perPair ? '1 Punkt je Paar' : q.perItem ? '1 Punkt je Aussage' : q.points === 1 ? '1 Punkt' : q.points + ' Punkte';
}
// Kopf über der Frage: oben Frageart (links) und Punkte (rechts), darunter Block/Frage mit Fortschrittsbalken
// Kopf bei den Fragen – gleich aufgebaut wie am Fernseher: Frageart groß + Punkte-Pill,
// darunter Block-Nummer und Fortschritt im Block als Striche
// Fortschritt im Block über die ganze Breite: „Block 1“ · ein Strich pro Frage (aktuelle gelb) · „Frage 4/8“
function qProgress() {
  const b = S.block;
  if (!b || !b.len) return `<span class="qbar"><i style="width:${S.qTotal ? Math.round(S.qNum / S.qTotal * 100) : 0}%"></i></span><span>Frage ${S.qNum}/${S.qTotal}</span>`;
  const label = b.total > 1 ? `<span>Block ${b.num}</span>` : '';
  const prog = b.len > 15   // zu viele Striche: durchgehender Balken
    ? `<span class="qbar"><i style="width:${Math.round(b.q / b.len * 100)}%"></i></span>`
    : `<span class="qsegs">${Array.from({ length: b.len }, (_, i) => `<i class="${i + 1 < b.q ? 'done' : i + 1 === b.q ? 'cur' : ''}"></i>`).join('')}</span>`;
  return label + prog + `<span>Frage ${b.q}/${b.len}</span>`;
}
function ptsPill(q) {
  if (!q || q.tiebreak) return '';
  const pt = ptsText(q);
  if (S.special) return `<span class="qptsg"><span class="qpts sp">⭐ Spezialfrage</span><span class="qpts">${pt || 'Punkte'} ×${S.special.mult}</span></span>`;
  if (S.risk) return `<span class="qpts rk">⚠️ Risikofrage</span>`;
  return pt ? `<span class="qpts">${pt}</span>` : '';
}
// Kopf bei den Fragen (wie am Fernseher angeglichen): Frageart links, Punkte rechts, darunter der Fortschritt.
// Eine Linie trennt den Kopf ab; darunter groß die Aufforderung (ask) und ein Hinweis in Lesegröße (sub).
function qline(ask, sub) {
  const q = S.question || {};
  let prog;
  if (q.tiebreak && S.tiebreak) {
    const names = S.tiebreak.ids.map(id => (S.players.find(p => p.id === id) || {}).name).filter(Boolean);
    const who = names.length > 1 ? names.slice(0, -1).join(', ') + ' und ' + names[names.length - 1] : names[0] || '';
    prog = `<span class="qwho">Nur ${esc(who)} ${names.length > 1 ? 'antworten' : 'antwortet'}${S.tiebreak.round > 1 ? ` · Runde ${S.tiebreak.round}` : ''}</span>`;
  } else prog = qProgress();
  const icon = q.tiebreak ? '⚔️' : q.brand === 'spotify' ? ic('spotify', '#1DB954') : q.label ? q.icon || '' : '❓';
  const type = q.tiebreak ? 'Stechen um Platz 1' : q.label ? (q.brand === 'spotify' ? `<span class="spot">${esc(q.label)}</span>` : esc(q.label)) : 'Quizfrage';
  return `<div class="qhead">
    <div class="ql1 ${S.special && !q.tiebreak ? 'three' : ''}"><span class="qcat"><span class="qico">${icon}</span>${type}</span>${ptsPill(q)}</div>
    <div class="ql2">${prog}</div></div>
    ${ask || sub ? `<div class="qask">${ask ? `<h2>${ask}</h2>` : ''}${sub ? `<p>${sub}</p>` : ''}</div>` : ''}`;
}

function render() {
  if (shutdown) return renderShutdown();
  if (S.phase === 'scores' && lastPh !== 'scores') scoresSince = Date.now();
  header();
  const me = S.me;
  const lobbyKey = S.phase === 'lobby' ? [S.players.map(p => (p.connected ? 'c' : '') + (p.ready ? 'r' : '') + p.avatar).join(''), JSON.stringify(S.packs), ui.settings].join(',') : '';
  const joinKey = me ? '' : (S.taken || S.players.map(p => p.avatar)).join('');
  const hostKey = ui.host ? [S.players.map(p => p.id + p.name + p.connected).join(','), ui.renaming].join('|') : '';
  const anl = S.phase === 'lobby' && S.anleitung, myTry = anl && me && (anl.tries || []).find(t => t.id === me.id);
  // Anleitung: neu zeichnen bei neuer Folie und eigener Antwort (nicht bei der Karte – Zoom bleibt erhalten)
  const anlKey = anl ? [anl.idx, anl.total, anl.slide.id, anl.slide.uebung && !['pin', 'land'].includes(anl.slide.uebung.art) && myTry ? JSON.stringify(myTry) : ''].join(':') : '';
  const key = [anlKey, joinKey, hostKey, ui.host, S.frozen, JSON.stringify(S.system), S.kicked, S.phase, S.qNum, me ? me.id : '-', me && me.skipped, me && JSON.stringify(me.answer && (me.answer.choice ?? me.answer.value ?? me.answer.order ?? me.answer.pos ?? me.answer.region)),
    me && me.isVip, me && me.canLead, me && me.canTech, me && me.authed, JSON.stringify(S.pin), lobbyKey, S.question && S.question.step,
    me && me.isHost ? S.players.map(p => (p.answered ? 1 : 0) + (p.connected ? 'c' : '')).join('') + JSON.stringify(me.hostQ) : ''].join('|');
  if (key === lastKey) return; // nichts Relevantes geändert (Eingaben nicht zerstören)
  const newQuestion = lastQ !== S.qNum || lastPh !== 'question';
  lastKey = key; lastQ = S.qNum; lastPh = S.phase;

  if (S.system) return renderInfo(sysIcon(S.system.icon), S.system.text, esc(S.system.sub || 'Das Quiz ist gleich wieder da.'));
  if (!me) return renderJoin();
  if (!me.isVip && !me.canLead && !me.canTech) ui.settings = false;
  hostToken();
  if (ui.pinOpen) return renderPin();
  if (ui.settings) return renderSettings();
  if (S.frozen) return renderFrozen();
  if (S.phase === 'lobby') return S.anleitung ? renderAnleitung() : renderLobby();
  if (S.phase === 'pause') return renderPause();
  if (me.isHost) return renderModerator();
  if (S.phase === 'locked') return renderInfo('🔒', me.answer ? 'Eingeloggt!' : 'Zeit ist um!', 'Der Gamemaster löst gleich auf – schau auf den Fernseher.');
  if (S.phase === 'ident') return renderInfo('🎬', 'QuizAbend', 'Schau auf den Fernseher 👀');
  if (S.phase === 'opening') {
    renderInfo('🎬', 'Gleich geht\'s los!', 'Schau auf den Fernseher – dort siehst du, was euch heute erwartet.');
    if (me.canLead) main.querySelector('.center').insertAdjacentHTML('beforeend', '<button class="btn ghost" style="margin-top:3vh" onclick="advance()">⏭ Intro überspringen</button>');
    return;
  }
  if (S.phase === 'block') return renderInfo('📦', S.block.total > 1 ? `Block ${S.block.num} von ${S.block.total}` : 'Los geht\'s!', `${esc(S.block.names.join(', '))}<br>Schau auf den Fernseher!`);
  if (S.phase === 'tiebreak') {
    const names = S.players.filter(p => S.tiebreak.ids.includes(p.id)).map(p => `${p.avatar} ${esc(p.name)}`).join(' · ');
    return S.tiebreak.ids.includes(me.id)
      ? renderInfo('⚔️', 'Stechen!', `Gleichstand auf Platz 1: ${names}<br>Eine Schätzfrage entscheidet – wer am nächsten dran ist, gewinnt. Gleich nah? Dann zählt, wer schneller war.`, 'special')
      : renderInfo('⚔️', 'Stechen um Platz 1', `${names} sind punktgleich.<br>Eine Schätzfrage entscheidet – nur sie dürfen antworten. Schau auf den Fernseher 👀`);
  }
  // Stechen: Wer nicht punktgleich ist, schaut nur zu
  if (S.question && S.question.tiebreak && S.tiebreak && !S.tiebreak.ids.includes(me.id) && ['question', 'votes', 'reveal'].includes(S.phase))
    return renderInfo('⚔️', 'Stechen läuft …', `${S.players.filter(p => S.tiebreak.ids.includes(p.id)).map(p => `${p.avatar} ${esc(p.name)}`).join(' · ')} schätzen um Platz 1.<br>Schau auf den Fernseher 👀`);
  if (S.phase === 'risk') return renderInfo(ic('triangle-exclamation'), 'Risikofrage!', `Richtig: <b>+ Punkte</b><br>Falsch: <b>dieselben Punkte weg</b><br>Nicht antworten: nichts passiert<br>Schau auf den Fernseher 👀`, 'risk');
  if (S.phase === 'special') return renderInfo('⭐', 'Spezialfrage!', `Diese Frage zählt <b>×${S.special.mult}</b> Punkte!<br>Schau auf den Fernseher 👀`, 'special');
  const qIcon = q => q.brand === 'spotify' ? ic('spotify', '#1DB954') : q.icon;
  if (S.phase === 'intro') return renderInfo(qIcon(S.question), S.question.label, `Kategorie: ${esc(S.question.category)}<br>Gleich geht's los – schau auf den Fernseher!`, S.question.brand === 'spotify' ? 'spot' : '');
  if (S.phase === 'media' && S.question.flash) return renderInfo('📸', 'Merk dir das Bild!', 'Es ist nur kurz auf dem Fernseher zu sehen – danach kommt die Frage, ohne Bild.');
  if (S.phase === 'media' && S.question.spotify) return renderInfo(qIcon(S.question), 'Hör genau hin!', (S.question.audioOpts && S.question.audioOpts.repeat > 1 ? `🔁 Du hörst ihn ${S.question.audioOpts.repeat}-mal.<br>` : '') + 'Der Song läuft über Spotify (Receiver) – danach kommt die Frage dazu.', 'spot');
  if (S.phase === 'media') return S.question.audio
    ? renderInfo('🎧', 'Hör genau hin!', (S.question.audioOpts && S.question.audioOpts.reverse ? '⏪ Der Ausschnitt läuft rückwärts!<br>' : '') + (S.question.audioOpts && S.question.audioOpts.repeat > 1 ? `🔁 Du hörst ihn ${S.question.audioOpts.repeat}-mal.<br>` : '') + 'Der Ton kommt vom Fernseher – danach kommt die Frage dazu.')
    : renderInfo('👀', 'Schau genau hin!', 'Das Video läuft auf dem Fernseher – danach kommt die Frage dazu.');
  if (S.phase === 'preview') return renderInfo('👀', 'Merk dir die Begriffe!', 'Gleich musst du ihnen auf dem Handy die richtigen Partner zuordnen.');
  if (S.phase === 'question') {
    if (me.answer) return renderWaiting(waitingFor(me.answer));
    if (me.skipped) return renderInfo('🙈', 'Ausgesetzt', 'Kein Risiko für dich.<br>Schau auf den Fernseher, ob du richtig gelegen hättest.');
    if (newQuestion) { est = ''; geo = null; match = { sel: (S.question.left || []).map(() => null), active: 0 }; tfMarks = (S.question.statements || []).map(() => null); if (navigator.vibrate) navigator.vibrate([60, 40, 60]); }
    const k = S.question.kind;
    return k === 'estimate' ? renderEstimate() : k === 'match' ? renderMatch() : k === 'tf' ? renderTF() : k === 'pin' || k === 'land' ? renderGeoQ() : renderChoice();
  }
  if (S.phase === 'votes') return renderVotes();
  if (S.phase === 'reveal') {
    if (S.question.kind === 'estimate') {   // erst wenn am TV die Zahl gelandet und die Liste sortiert ist
      if (lastEstQ !== S.qNum) { lastEstQ = S.qNum; estRevealAt = Date.now() + EST_WAIT_MS; }
      const wait = estRevealAt - Date.now();
      if (wait > 0) {
        clearTimeout(render.estT); render.estT = setTimeout(() => { lastKey = ''; render(); }, wait + 30);
        return renderInfo('🎰', 'Gleich wissen wir es …', 'Schau auf den Fernseher 👀');
      }
    }
    return S.question.kind === 'match' ? renderMatchResult() : S.question.kind === 'tf' ? renderTFResult() : renderResult();
  }
  if (S.phase === 'scores') return renderRank(false);
  if (S.phase === 'end') return renderRank(true);
}

function waitingFor(a) {
  if (a.pos) return '<div class="big">📍</div>';
  if (a.region) return '<div class="big">🗺️</div>';
  if (a.choice !== undefined) return chosenHtml(a.choice);
  if (a.value !== undefined) return `<div class="bigval">${fmt(a.value)}${S.question.unit ? ' ' + esc(S.question.unit) : ''}</div>`;
  if (a.marks) return '<div class="big">⚖️</div>';
  return '<div class="big">🔗</div>';
}

function renderJoin() {
  myId = null; localStorage.removeItem('quizId');
  const full = S.players.length >= S.maxPlayers;
  const taken = new Set(S.taken || S.players.map(p => p.avatar));   // inkl. Gamemaster (steht im Pub-Quiz nicht in der Spielerliste)
  const prev = document.getElementById('name');
  const name = prev ? prev.value : (localStorage.getItem('quizName') || '');
  const fav = localStorage.getItem('quizAvatar');
  if (!ui.avatar || taken.has(ui.avatar)) ui.avatar = fav && !taken.has(fav) ? fav : S.avatars.find(a => !taken.has(a));
  main.innerHTML = `<form class="center" onsubmit="join(event)">
    <h1>Quiz<span>Abend</span></h1>
    ${S.kicked ? '<p class="err">Du wurdest vom Host aus dem Spiel genommen.</p>' : ''}
    <p>${S.phase === 'lobby' ? 'Wie heißt du?' : 'Das Spiel läuft schon – du steigst bei der nächsten Frage ein.'}</p>
    <input id="name" maxlength="14" autocomplete="off" autocapitalize="words" placeholder="Dein Name" value="${esc(name)}">
    <p class="small">Wähle dein Emoji:</p>
    <div class="emojis">${S.avatars.map(a => `<button type="button" class="emo ${a === ui.avatar ? 'on' : ''}" ${taken.has(a) ? 'disabled' : ''} onclick="pickAvatar('${a}')">${a}</button>`).join('')}</div>
    <button class="btn" ${full ? 'disabled' : ''}>${full ? 'Spiel ist voll' : `Mitspielen als ${ui.avatar || ''}`}</button>
    <div class="err" id="err"></div></form>`;
}
function pickAvatar(a) { ui.avatar = a; if (navigator.vibrate) navigator.vibrate(10); renderJoin(); }

function renderLobby() {
  const n = S.players.filter(p => p.connected).length;
  const k = S.packs || {};
  const canStart = n >= S.minPlayers && k.questions > 0;
  const blocks = (k.blocks || []).filter(b => b.plays > 0).length;
  const gm = S.me.isHost;
  const pin = S.pin || {};
  const banner = S.me.isVip && !pin.set ? `<div class="pinbanner"><span>🔑</span><p>Noch keine Host-PIN – jeder, der zuerst kommt, ist Host.</p><button class="btn sm" onclick="openPin('set')">Festlegen</button></div>` : '';
  const becomeHost = pin.set && !S.me.authed ? `<button class="btn ghost" onclick="openPin('login')">👑 Host werden</button>` : '';
  // Bereit: jeder Spieler tippt einmal; gestartet wird erst, wenn alle Verbundenen bereit sind
  const mine = S.players.find(p => p.id === S.me.id), ready = !!(mine && mine.ready);
  const waiting = S.players.filter(p => p.connected && !p.ready);
  const rlist = `<div class="rlist">${S.players.filter(p => p.connected).map(p => `<span class="${p.ready ? '' : 'w'}" style="--pc:${p.color}" title="${esc(p.name)}">${p.avatar}${p.ready ? '<i>✓</i>' : ''}</span>`).join('')}</div>`
    + (waiting.length ? `<p class="small">Warte auf ${waiting.map(p => `${p.avatar} ${esc(p.name)}`).join(', ')} …</p>` : '<p class="small">Alle bereit!</p>');
  const readyBox = gm ? rlist : ready
    ? `<div class="rdone">✓ Du bist bereit</div>${rlist}<button class="btn ghost sm2" onclick="setReady(false)">Doch noch nicht</button>`
    : `<button class="btn rbtn" onclick="setReady(true)">✋ Ich bin bereit!</button>`;
  const startText = !k.questions ? 'Erst Fragenpakete wählen' : n < S.minPlayers ? `Warte auf Mitspieler (min. ${S.minPlayers})`
    : waiting.length ? 'Noch nicht alle bereit' : 'Alle bereit – Spiel starten!';
  main.innerHTML = `${banner}<div class="center">
    <div class="big">${gm ? '🎤' : S.me.avatar}</div>
    <h1>${gm ? 'Du bist Gamemaster' : 'Du bist dabei!'}</h1>
    <p>${gm ? 'Pub-Quiz: Du spielst nicht mit, sondern moderierst.<br>' : ready ? 'Gleich geht\'s los – schau auf den Fernseher.<br>' : 'Bist du startklar?<br>'}${n} von max. ${S.maxPlayers} Spielern da.</p>
    ${readyBox}
    ${S.me.canLead ? `
      <button class="btn" onclick="advance()" ${canStart && !waiting.length ? '' : 'disabled'}>${startText}</button>
      ${canStart && waiting.length ? '<p class="small">Jemand reagiert nicht? Unter ⚙️ › 👥 Spieler mit ✖ aus dem Spiel nehmen.</p>' : ''}
      <button class="btn ghost" onclick="anlCall('start')">📖 Anleitung zeigen</button>
      ${gm ? '<button class="btn ghost" onclick="openPlan()">📋 Fragen planen</button>' : ''}
      <button class="btn ghost" onclick="openSettings()">⚙️ Einstellungen${k.errors ? ' · ⚠️' : ''}</button>
      <p class="small">${blocks > 1 ? `${blocks} Blöcke · ` : ''}${k.questions} Fragen${k.special && k.special.on ? ` · ⭐ Spezialfrage ×${k.special.mult}` : ''}${k.risk && k.risk.on ? ' · ⚠️ Risikofrage' : ''}</p>`
      : `${S.me.isVip ? '<p>Zum Starten brauchst du die Host-PIN.</p>' : ready && !waiting.length ? '<p>Warte, bis 👑 das Spiel startet …</p>' : ''}${becomeHost}${S.me.canTech ? '<button class="btn ghost" onclick="openSettings()">⚙️ Raum & Technik</button>' : ''}`}
    <button class="leave" onclick="leave()">Spiel verlassen</button></div>`;
}

async function setReady(on) { if (on && navigator.vibrate) navigator.vibrate(15); await post('/api/bereit', { id: myId, ready: on }); }

// ---------- Anleitung „So geht QuizAbend“ (anleitung.json): 👑 blättert, alle können ausprobieren ----------
let anlEst = '', anlMsg = '';
async function anlCall(action, extra) {
  const { ok, data } = await post('/api/anleitung', { id: myId, action, ...(extra || {}) });
  if (!ok && data && data.text) alert(data.text);
  return ok;
}
async function anlTry(body) {
  if (await anlCall('try', body)) { anlMsg = '✓ Gesendet – schau auf den Fernseher!'; if (navigator.vibrate) navigator.vibrate(15); }
  const el = document.getElementById('anlok'); if (el) el.textContent = anlMsg;
}
const ANL_FARBEN = ['Koralle', 'Blau', 'Senf', 'Grün'];
const anlText = s => esc(s || '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function renderAnleitung() {
  const a = S.anleitung, s = a.slide, u = s.uebung, me = S.me, lead = me.canLead;
  const mine = (a.tries || []).find(t => t.id === me.id);
  if (renderAnleitung.slide !== a.idx + s.id) { renderAnleitung.slide = a.idx + s.id; anlMsg = mine ? '✓ Gesendet – du kannst nochmal tippen.' : ''; anlEst = ''; geoMap = null; }
  let body;
  if (!u) body = `<div class="anlwatch"><div class="big">📺</div><p>Schau auf den Fernseher!</p></div>`;
  else if (u.art === 'choice') body = `<div class="anlask">${esc(u.frage)}</div>
    <div class="grid">${ANL_FARBEN.map((n, i) => `<button class="ans c${i} ${mine ? (mine.choice === i ? 'mine' : 'dim') : ''}" onclick="anlTry({ choice: ${i} })"><span class="shape">${shapeSvg(i)}</span>${n}</button>`).join('')}</div>`;
  else if (u.art === 'estimate') body = `<div class="anlask">${esc(u.frage)}</div>
    <form class="anlinp" onsubmit="event.preventDefault(); const v = this.z.value.replace(',', '.'); if (v.trim() !== '') anlTry({ value: Number(v) })">
      <input name="z" type="text" inputmode="decimal" placeholder="${mine ? fmt(mine.value) : 'Zahl'}" autocomplete="off"><button class="btn">Senden</button></form>`;
  else body = `<div class="anlask">${esc(u.frage)}</div><div class="kmap" id="anlmap"><div class="kload">Karte lädt …</div></div>
    <p class="khelp">${u.art === 'pin' ? 'Tippen setzt den Pin' : 'Tippe auf das Bundesland'} – zum Üben zählt jeder Tipp sofort. Zoomen mit zwei Fingern.</p>`;
  const nav = lead ? `<div class="anlnav"><button class="btn ghost" onclick="anlCall('prev')" ${a.idx ? '' : 'disabled'}>‹ Zurück</button>
      <button class="btn" onclick="anlCall('next')">${a.idx + 1 < a.total ? 'Weiter ›' : 'Fertig ✓'}</button></div>
    <select onchange="anlCall('goto', { idx: +this.value })">${a.list.map((x, i) => `<option value="${i}" ${i === a.idx ? 'selected' : ''}>${i + 1}. ${esc(x.titel)}</option>`).join('')}</select>
    <button class="btn ghost" onclick="anlCall('stop')">✕ Anleitung beenden</button>` : '';
  main.innerHTML = `<div class="anlp">
    <div class="anlhead"><span>📖 Anleitung</span><span>${a.idx + 1} / ${a.total}</span></div>
    <h2>${s.icon ? (s.id === 'spotify' ? ic('spotify', '#1DB954') : s.icon) + ' ' : ''}${anlText(s.titel)}</h2>
    ${body}
    ${u ? `<div class="anlok" id="anlok">${anlMsg}</div>` : ''}
    ${nav}</div>`;
  if (u && (u.art === 'pin' || u.art === 'land')) {
    const host = document.getElementById('anlmap'), key = renderAnleitung.slide;
    loadKarte(u.karte || 'deutschland').then(m => {
      if (!document.contains(host) || renderAnleitung.slide !== key) return;
      geoMap = kMount(host, m, { mode: u.art, color: me.color, avatar: me.avatar, value: mine ? (u.art === 'pin' ? mine.pos : mine.region) : null,
        onPick: v => { if (v) anlTry(u.art === 'pin' ? { pos: v } : { region: v }); } });
    }).catch(() => { host.innerHTML = '<div class="kload">Karte fehlt – bitte „Update holen“.</div>'; });
  }
}

// ---------- Einstellungen für den Gamemaster ----------
async function openSettings() {

// Verlauf der gespielten Fragen löschen (Bestätigung im Knopf selbst)
async function resetHistory(btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = 'Wirklich löschen?'; btn.classList.add('danger'); return; }
  const { ok, data } = await post('/api/verlauf', { id: myId });
  if (ok) ui.packs = data;
  lastKey = ''; render();

async function saveCfg() {
  const { ok, data } = await post('/api/einstellungen', { id: myId, settings: cfg() });
  if (ok) ui.packs = data;
  lastKey = ''; render();
}
function setBlocks(n) {
  const b = cfg().blocks;
  while (b.length < n) b.push({ count: 10, disabled: [] });
  b.length = Math.max(1, Math.min(6, n));
  saveCfg();
}
function setCount(bi, d) { const b = cfg().blocks[bi]; b.count = Math.max(1, Math.min(50, b.count + d)); saveCfg(); }
function packOn(bi, id, on) {
  const dis = new Set(cfg().blocks[bi].disabled);
  on ? dis.delete(id) : dis.add(id);
  cfg().blocks[bi].disabled = [...dis];
}
function togglePack(gi, pi, on) { packOn(ui.edit, ui.packs.groups[gi].packs[pi].id, on); saveCfg(); }
function toggleGroup(gi, on) { ui.packs.groups[gi].packs.forEach(p => packOn(ui.edit, p.id, on)); saveCfg(); }
function editBlock(i) { ui.edit = i; lastKey = ''; render(); window.scrollTo(0, 0); }
const PAUSE_STEPS = [0, 1, 2, 3, 5, 10, 15, 20, 30, 45, 60];
function setPause(d) {
  const p = cfg().pause, i = PAUSE_STEPS.findIndex(x => x >= p.minutes);
  p.minutes = PAUSE_STEPS[Math.max(0, Math.min(PAUSE_STEPS.length - 1, (i < 0 ? PAUSE_STEPS.length - 1 : i) + d))]; saveCfg();
}

// Eigenes WLAN: Stand, letzter Start, Test und Protokoll – damit man ohne SSH sieht, was los ist

  const w = sys.wifi;
  if (!w) return '';
  const RES = { heim: ['✓', 'Heim-WLAN'], hotspot: ['📶', 'Eigenes WLAN'], test: ['✅', 'Test'], fehler: ['❌', 'Fehler'] };
  const st = w.status, r = st && (RES[st.result] || ['•', st.result]);
  const when = st ? new Date(st.time).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  const ready = w.service === 'enabled';
  return `<h3>📶 Eigenes WLAN</h3>
    ${ready ? `<p class="small">Eingerichtet ✓ · WLAN-Name <b>${esc(w.ssid || 'QuizAbend')}</b>${w.password ? ` · Passwort <b>${esc(w.password)}</b>` : ''}${w.active ? ' · <b>läuft gerade</b>' : ''}${w.connection === false ? '<br>Die Hotspot-Verbindung fehlt noch – sie wird beim nächsten Start automatisch angelegt.' : ''}</p>`
      : `<div class="sysout bad">Nicht eingerichtet: Der Startdienst für das eigene WLAN fehlt (${esc(w.service || 'unbekannt')}). Einmalig nötig – per SSH, z. B. mit einer SSH-App am Handy im selben WLAN:<br><code>cd ~/QuizAbend && ./raspberry-pi/setup.sh --ohne-desktop --720p</code></div>`}
    ${st ? `<div class="sysout ${st.result === 'fehler' ? 'bad' : ''}">${r[0]} Letzter Start (${when}): ${esc(st.detail)}</div>` : ready ? '<p class="small">Noch kein Protokoll – es entsteht beim nächsten Start des Pi.</p>' : ''}
    ${ready && sys.canPower ? btn('hotspottest', '🧪 Eigenes WLAN testen') + `<p class="small">Der Pi startet neu und öffnet 3 Minuten lang das WLAN „${esc(w.ssid || 'QuizAbend')}“, auch wenn dein WLAN da ist. Verbinde dein Handy damit und öffne <b>http://quizabend.local</b> oder <b>http://10.42.0.1</b>. Danach verbindet sich der Pi wieder mit deinem WLAN – hier steht dann das Ergebnis.</p>` : ''}
    ${w.log && w.log.length ? `<details class="wlog" ${ui.logOpen ? 'open' : ''} ontoggle="ui.logOpen = this.open"><summary>Protokoll anzeigen</summary>
      <button class="btn ghost sm" onclick="copyLog()">📋 ${ui.logCopied ? 'Kopiert ✓' : 'Protokoll kopieren'}</button><pre id="wlogtext">${esc(w.log.join('\n'))}</pre></details>` : ''}`;
}
// Kopieren ohne https: unsichtbares Textfeld + execCommand (navigator.clipboard gibt es nur mit https)
function copyLog() {
  const t = document.getElementById('wlogtext'); if (!t) return;
  const ta = document.createElement('textarea'); ta.value = t.textContent; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, ta.value.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
  ta.remove();
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(t.textContent).then(() => {}, () => {});
  ui.logCopied = true; lastKey = ''; render(); setTimeout(() => { ui.logCopied = false; lastKey = ''; render(); }, 2000);
}
async function sysAction(a) {
  if (a !== 'update' && ui.confirm !== a) { ui.confirm = a; lastKey = ''; render(); return; } // Sicherheitsabfrage
  ui.confirm = null; ui.sys = { ok: true, text: a === 'update' ? 'Suche nach Updates …' : 'Wird ausgeführt …' };
  if (a === 'update') ui.updating = true;
  lastKey = ''; render();
  const { data } = await post('/api/system', { id: myId, action: a });
  ui.updating = !!(a === 'update' && data.ok && data.restart);   // dreht weiter, bis QuizAbend neu gestartet ist
  ui.sys = a === 'update'
    ? { ok: data.ok, text: data.ok ? (data.changed ? (data.restart ? 'Update installiert – QuizAbend startet neu.' : 'Update geladen – bitte Server neu starten.') : 'Schon auf dem neuesten Stand ✓') : 'Update fehlgeschlagen: ' + (data.text || '') }
    : { ok: data.ok, text: data.ok ? 'OK' : (data.text || 'Hat nicht geklappt (fehlen sudo-Rechte?)') };
  lastKey = ''; render();
}

// ---------- Ausschalten: Bescheid geben, wann der Stecker raus kann ----------
// Der Server verschwindet früh beim Herunterfahren; danach schreibt der Pi noch auf die SD-Karte.
// Darum: erst warten, bis er nicht mehr antwortet, dann noch SHUTDOWN_REST_S Sekunden Sicherheitszeit.
const SHUTDOWN_REST_S = 20;
function startShutdown() {
  if (shutdown) return;
  shutdown = { since: Date.now(), goneAt: 0, misses: 0 };
  lastKey = '';
  const ping = async () => {
    if (!shutdown) return;
    if (!shutdown.goneAt) {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 2500);
      let alive = false;
      try { await fetch('/?ping=' + Date.now(), { cache: 'no-store', signal: ctl.signal }); alive = true; } catch (_) {}
      clearTimeout(t);
      if (!shutdown) return;
      shutdown.misses = alive ? 0 : shutdown.misses + 1;
      if (shutdown.misses >= 2) { shutdown.goneAt = Date.now(); if (es) es.close(); }   // zweimal keine Antwort: Server ist weg
    }
    renderShutdown();
    if (!shutdown.goneAt || Date.now() - shutdown.goneAt < SHUTDOWN_REST_S * 1000) shutdown.timer = setTimeout(ping, 1000);
    else if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
  };
  ping();
}
function renderShutdown() {
  const sd = shutdown;
  document.getElementById('offline').style.display = 'none';
  if (!sd.goneAt) {
    const slow = Date.now() - sd.since > 90000;
    return renderInfo('🔌', 'Pi fährt herunter …', slow
      ? 'Der Pi antwortet immer noch. Warte noch etwas – wenn sich nach ein paar Minuten nichts tut, über ⚙️ erneut ausschalten.'
      : 'Stecker noch drin lassen. Ich sage Bescheid, wann er raus kann.');
  }
  const left = Math.max(0, SHUTDOWN_REST_S - Math.floor((Date.now() - sd.goneAt) / 1000));
  if (left > 0) return renderInfo(`<span class="sdnum">${left}</span>`, 'Gleich geschafft …', 'Der Pi speichert noch die letzten Daten. Stecker noch drin lassen.');
  renderInfo('✅', 'Jetzt Stecker ziehen', 'Der Pi ist aus. Das grüne Lämpchen am Pi bleibt jetzt dunkel.<br><br>Zum Einschalten einfach den Stecker wieder rein – das Quiz startet von selbst.');
}

      + line(st.ip ? st.ip === st.lanIp : null, st.ip ? `Zeigt auf ${esc(st.ip)}${st.ip !== st.lanIp && st.lanIp ? ` (Pi hat jetzt ${esc(st.lanIp)} – wird gleich nachgetragen)` : ''}` : 'Adresse wird bei DuckDNS eingetragen')
      + line(st.validTo ? true : st.error ? false : null, st.validTo ? `Zertifikat gültig bis ${fmtDate(st.validTo)} (wird automatisch erneuert)` : 'Zertifikat wird angefordert (1–3 Minuten)')
      + (st.validTo ? line(st.dns ? st.dns.ok : null, st.dns && st.dns.ok ? 'Im Heimnetz erreichbar'

  const logBox = st.log && st.log.length ? `<details class="wlog"><summary>Protokoll anzeigen</summary><pre>${esc(st.log.join('\n'))}</pre></details>` : '';

let httpsPoll = null;
async function httpsDo(action) {
  const h = ui.https;
  h.msg = null;
  const { data } = await post('/api/https', { id: myId, action, name: h.name ?? h.st.name, token: h.token || '' });
  if (data.status) h.st = data.status;
  if (!data.ok) h.msg = { ok: false, text: data.text || 'Hat nicht geklappt.' };
  else if (action === 'set') { h.token = ''; h.msg = { ok: true, text: 'Gespeichert – der Pi richtet die Adresse jetzt ein. Das dauert 1–3 Minuten.' }; }
  lastKey = ''; render();
  // während der Pi arbeitet, den Stand alle 3 Sekunden nachladen
  clearTimeout(httpsPoll);
  const poll = async () => {
    if (!ui.settings || ui.section !== 'netz') return;
    const r = await post('/api/https', { id: myId, action: 'status' });

async function repoDo(action) {

function repoRemove(btn) {

function copyKey() {

// ---------- Pub-Quiz: Moderator-Ansicht (Host spielt nicht mit) ----------
function modAction() {
  const ph = S.phase, h = S.me.hostQ || {}, q = S.question || {};
  if (ph === 'ident') return ['⏭ Opener überspringen', 'ghost'];
  if (ph === 'opening') return ['⏭ Intro überspringen', 'ghost'];
  if (ph === 'tiebreak') return ['⏭ Weiter zur Stechen-Frage', 'ghost'];
  if (ph === 'block') return ['⏭ Weiter zur Frage', 'ghost'];
  if (ph === 'risk') return ['⏭ Alarm überspringen', 'ghost'];
  if (ph === 'intro' || ph === 'media' || ph === 'preview') return ['⏭ Überspringen', 'ghost'];
  if (ph === 'question') return ['⏹ Antworten jetzt schließen', 'ghost'];
  if (ph === 'locked') return ['🔍 Frage auflösen', ''];
  if (ph === 'special' || ph === 'votes') return ['⏭ Überspringen', 'ghost'];
  if (ph === 'reveal') {
    if (q.kind === 'match' && q.step < (q.left || []).length) return ['⏩ Alle Paare aufdecken', 'ghost'];
    if (q.kind === 'tf' && q.step < (q.statements || []).length) return ['⏩ Alle Aussagen aufdecken', 'ghost'];
    return h.isLast ? ['🏆 Zur Siegerehrung', ''] : h.blockEnd ? ['📊 Zur Rangliste', ''] : ['➡ Nächste Frage', ''];
  }
  if (ph === 'scores') return ['⏭ Weiter', 'ghost'];
  if (ph === 'end') return ['🔄 Neue Runde', ''];
  return null;
}
const MOD_STATUS = {
  ident: 'Opener läuft auf dem Fernseher', opening: 'Intro läuft auf dem Fernseher', tiebreak: 'Gleichstand auf Platz 1 – gleich kommt das Stechen (Schätzfrage)', block: 'Block-Ansage', risk: 'Alarm: Risikofrage!', intro: 'Ansage der Frageart', media: 'Video/Audio/Merkbild läuft', preview: 'Vorschau der Begriffe',

  if (navigator.vibrate) navigator.vibrate(10);
  P.msg = null; lastKey = ''; render();
  if (P.digits.length < 4) return;
  const d = P.digits; P.digits = '';
  const done = r => {
    if (!r.ok) { P.msg = { ok: false, text: r.text || 'Hat nicht geklappt.' }; lastKey = ''; return render(); }
    if (r.token) localStorage.setItem('quizHostToken', r.token);
    tokenSent = true; closePin(); if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
  };
  if (P.mode === 'login') return done(await pinCall('login', { pin: d }));
  if (P.mode === 'reset' && P.step === 'code') { P.code = d; P.step = 'pin'; lastKey = ''; return render(); }
  if (P.first === null) { P.first = d; lastKey = ''; return render(); }
  if (P.first !== d) { P.first = null; P.msg = { ok: false, text: 'Die beiden PINs waren unterschiedlich – bitte neu.' }; lastKey = ''; return render(); }
  if (P.mode === 'reset') { const r = await pinCall('resetcode', { code: P.code, pin: d }); if (!r.ok) { P.step = 'code'; P.first = null; P.requested = true; } return done(r); }
  done(await pinCall('set', { pin: d }));
}
async function giveCrown(id) {
  if (ui.confirm !== 'crown' + id) { ui.confirm = 'crown' + id; lastKey = ''; return render(); }
  ui.confirm = null;
  const r = await pinCall('crown', { target: id });
  ui.crownMsg = r.ok ? null : r.text; lastKey = ''; render();
}
// Bereich „Host-PIN“ in den Einstellungen
function pinSection() {
  const pin = S.pin || {}, info = ui.pinInfo || {};
  if (!pin.set) return `<p class="small">Ohne PIN ist Host (👑), wer zuerst beitritt – und darf alles, auch Updates, Neustart und WLAN.</p>
    ${S.me.isVip ? `<button class="btn" onclick="openPin('set')">🔑 Host-PIN festlegen</button>` : '<p class="small">Festlegen kann sie der 👑.</p>'}`;
  if (!S.me.authed) return `<div class="stline">✓ PIN festgelegt</div><p class="small">Du bist nicht angemeldet.</p>
    <button class="btn" onclick="openPin('login')">👑 Host werden</button>`;
  const devs = info.devices || [];
  const day = t => new Date(t).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  return `<div class="stline">✓ PIN festgelegt</div>
    <button class="btn ghost sysb" onclick="openPin('set')">PIN ändern</button>
    <h3>📱 Gemerkte Handys</h3>
    ${devs.length ? devs.map(d => `<div class="devrow"><span>📱</span><span class="pn">${esc(d.name)}<small>${d.mine ? 'dieses Handy · ' : ''}seit ${day(d.added)}</small></span>
      ${d.mine ? '' : `<button class="btn ghost sm" onclick="pinForget('${d.id}')">Entfernen</button>`}</div>`).join('') : '<p class="small">Keine.</p>'}
    <p class="small">Gemerkte Handys sind beim Beitreten automatisch Host.</p>
    <h3>🛡️ Was die PIN schützt</h3>
    <label class="switch"><input type="checkbox" ${pin.protectTech ? 'checked' : ''} onchange="pinOptions({ protectTech: this.checked })"><span>Raum & Technik (Netzwerk, System, Spotify, Hue)</span></label>
    <label class="switch"><input type="checkbox" ${pin.protectGame ? 'checked' : ''} onchange="pinOptions({ protectGame: this.checked })"><span>Auch das Spiel leiten (Starten, Einstellungen)</span></label>
    <p class="note">Ist „Spiel leiten“ aus, darf auch ein Mitspieler mit übergebener Krone das Spiel starten und steuern – an Technik und Updates kommt er ohne PIN nicht.</p>
    <button class="btn danger sysb" onclick="pinRemove(this)">PIN entfernen</button>`;
}
async function pinOptions(o) { const r = await pinCall('options', o); if (r.pin) ui.pinInfo = r.pin; lastKey = ''; render(); }
async function pinForget(dev) { const r = await pinCall('forget', { device: dev }); if (r.pin) ui.pinInfo = r.pin; lastKey = ''; render(); }
async function pinRemove(btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = '1'; btn.textContent = 'Wirklich entfernen?'; return; }
  await pinCall('remove'); localStorage.removeItem('quizHostToken'); ui.pinInfo = null; lastKey = ''; render();
}

function playersSection() {
  return S.players.map(p => ui.renaming === p.id
    ? `<form class="prow2" onsubmit="saveRename(event, '${p.id}')"><span class="pav" style="--pc:${p.color}">${p.avatar}</span>
        <input id="rn" maxlength="14" value="${esc(p.name)}"><button class="btn sm">OK</button></form><div class="err" id="rnerr"></div>`
    : `<div class="prow2 ${p.connected ? '' : 'off'}"><span class="pav" style="--pc:${p.color}">${p.avatar}</span>
        <span class="pn">${esc(p.name)}${p.id === S.vip ? ' 👑' : ''}<small>${p.id === myId ? 'du · ' : ''}${S.phase === 'lobby' ? (p.ready ? '✓ bereit' : 'noch nicht bereit') : HIDE_PTS.includes(S.phase) ? '' : p.score + ' P'}${p.connected ? '' : ' · offline'}</small></span>
        ${p.id !== S.vip && p.connected && (S.me.canLead || S.me.authed) ? `<button class="ib ${ui.confirm === 'crown' + p.id ? 'warn' : ''}" onclick="giveCrown('${p.id}')" title="${p.id === myId ? 'Krone zurückholen' : 'Krone übergeben'}">${ui.confirm === 'crown' + p.id ? (p.id === myId ? 'Holen?' : 'Übergeben?') : '👑'}</button>` : ''}
        ${S.me.canLead ? `<button class="ib" onclick="startRename('${p.id}')" title="Umbenennen">✏️</button>` : ''}
        ${p.id === myId || !S.me.canLead ? '' : `<button class="ib ${ui.confirm === 'kick' + p.id ? 'warn' : ''}" onclick="kick('${p.id}')" title="Entfernen">${ui.confirm === 'kick' + p.id ? 'Sicher?' : '✖'}</button>`}</div>`).join('')
    + `<p class="small">👑 übergibt die Krone: Der andere leitet das Spiel${S.pin && S.pin.set && S.pin.protectTech ? ', darf aber nichts unter „Raum & Technik“ ändern (dafür braucht es die PIN)' : ''}. ✏️ umbenennen · ✖ aus dem Spiel nehmen.${S.pin && S.pin.set ? '' : ' Ohne Host-PIN ist 👑, wer zuerst beigetreten ist.'}</p>`
    + (ui.crownMsg ? `<div class="sysout bad">${esc(ui.crownMsg)}</div>` : '');
}

let pauseTimer = null;
function renderPause() {
  const nb = S.nextBlock, end = Date.now() + S.remainingMs;
  main.innerHTML = `<div class="center">
    <div class="big">🍺</div><h1>Pause!</h1>
    <div class="pcount" id="pc">${S.phaseMs ? '' : '⏸'}</div>
    <p>${S.phaseMs ? 'bis es weitergeht' : 'Es geht weiter, wenn der Host startet.'}${nb ? `<br>Gleich: <b>Block ${nb.num} von ${nb.total}</b>` : ''}</p>
    ${S.me.canLead ? '<button class="btn" onclick="advance()">⏭ Pause beenden</button><button class="btn ghost" onclick="hostAct(\'extend\')">➕ 5 Minuten länger</button>' : ''}
  </div>`;
  clearInterval(pauseTimer);
  if (S.phaseMs && !S.frozen) pauseTimer = setInterval(() => {
    const el = document.getElementById('pc'); if (!el) return clearInterval(pauseTimer);
    const s = Math.max(0, Math.ceil((end - Date.now() - 1500) / 1000));   // 1,5 s Nachlauf mit 0:00 (wie am TV)
    el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }, 250);
}

function renderFrozen() {
  main.innerHTML = `<div class="center"><div class="big">⏸</div><h1>Spiel angehalten</h1><p>Gleich geht es weiter …</p>
    ${S.me.canLead ? '<button class="btn" onclick="hostAct(\'resume\')">▶️ Spiel fortsetzen</button>' : ''}</div>`;
}

// ---------- Fragen ----------
function renderInfo(icon, title, text, cls) {
  main.innerHTML = `<div class="center ${cls || ''}"><div class="big">${icon}</div><h1>${esc(title)}</h1><p>${text}</p></div>`;
  if (cls === 'special' && navigator.vibrate) navigator.vibrate([80, 50, 80, 50, 200]);
  if (cls === 'risk' && navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300]);
}

function renderChoice() {
  main.innerHTML = qline(S.risk ? 'Nur wenn du sicher bist!' : S.question.points ? '' : 'Antworte schnell!', S.risk ? '<span class="rkhint">Falsch kostet Punkte – du kannst auch aussetzen.</span>' : '') + `
    <div class="grid">${S.question.answers.map((a, i) => `<button class="ans c${i} ${a.length > 40 ? 'xlong' : a.length > 24 ? 'long' : ''}" onclick="sendAnswer({choice:${i}}, chosenHtml(${i}))"><span class="shape">${shapeSvg(i)}</span>${esc(a)}</button>`).join('')}</div>${skipBtn()}`;
}

function renderEstimate() {
  const q = S.question;
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', q.year ? '' : ',', '0', '⌫'];
  const tol = q.tolerance !== null && q.tolerance !== undefined
    ? `Punkte nur bei höchstens ±${fmt(q.tolerance)} ${q.year ? (q.tolerance === 1 ? 'Jahr' : 'Jahren') : esc(q.unit || '')} Abweichung` : '';
  main.innerHTML = qline(q.year ? 'Jahreszahl!' : 'Schätze!', tol) + `
    <div class="est">
      <div class="display"><span id="disp">${est ? esc(est) : `<span class="ph">${q.year ? 'Jahreszahl' : 'Zahl'} eingeben</span>`}</span>${q.unit ? `<small>${esc(q.unit)}</small>` : ''}</div>
      <div class="pad">${keys.map(k => k ? `<button onclick="estKey('${k}')">${k}</button>` : '<span></span>').join('')}</div>
      <button class="btn" onclick="sendEstimate()" ${est && est !== '-' ? '' : 'disabled'}>Abschicken</button>
    </div>`;
}
function estKey(k) {
  if (k === '⌫') est = est.slice(0, -1);
  else if (k === ',') { if (est && !est.includes(',')) est += ','; }
  else if (est.replace(',', '').length < 10) est = (est === '0' ? '' : est) + k;
  if (navigator.vibrate) navigator.vibrate(10);
  renderEstimate();
}
function sendEstimate() {
  const value = Number(est.replace(',', '.'));
  if (!est || !isFinite(value)) return;
  sendAnswer({ value }, waitingFor({ value }));
}

// ---------- Geografie: Karte zum Zoomen, Tippen setzt den Pin bzw. wählt das Land ----------
function renderGeoQ() {
  const q = S.question, me = S.me, pin = q.kind === 'pin';
  main.innerHTML = qline(S.risk ? 'Nur wenn du sicher bist!' : '', S.risk ? '<span class="rkhint">Falsch kostet Punkte – du kannst auch aussetzen.</span>' : '') + `<div class="kcard">${esc(q.text)}</div>
    <div class="kmap" id="kmap"><div class="kload">Karte lädt …</div></div>
    <p class="khelp">${pin ? `Tippen setzt den Pin – nochmal tippen versetzt ihn.${q.radius ? ` <b>Richtig bis ${kKm(q.radius)} daneben.</b>` : ''}` : 'Tippe auf das ' + (q.map === 'deutschland' ? 'Bundesland' : 'Land') + '. Kleine Länder haben einen Kreis.'} Zoomen mit zwei Fingern oder ＋/－.</p>
    <button class="btn" id="kgo" onclick="sendGeo()" ${geo ? '' : 'disabled'}>${pin ? '📍 Hier ist es' : '✓ Dieses ' + (q.map === 'deutschland' ? 'Bundesland' : 'Land')}</button>${skipBtn()}`;
  const host = document.getElementById('kmap'), qn = S.qNum;
  loadKarte(q.map).then(m => {
    if (!document.contains(host) || S.qNum !== qn) return;
    geoMap = kMount(host, m, { mode: pin ? 'pin' : 'land', color: me.color, avatar: me.avatar, value: geo,
      onPick: v => { geo = v; const b = document.getElementById('kgo'); if (b) b.disabled = !v; } });
  }).catch(() => { host.innerHTML = '<div class="kload">Karte fehlt – bitte „Update holen“.</div>'; });
}
function sendGeo() {
  if (!geo) return;
  const q = S.question;
  sendAnswer(q.kind === 'pin' ? { pos: geo } : { region: geo }, waitingFor(q.kind === 'pin' ? { pos: geo } : { region: geo }));
}

function renderMatch() {
  const q = S.question, used = new Set(match.sel.filter(x => x !== null));
  const complete = match.sel.every(x => x !== null);
  main.innerHTML = qline('Ordne zu!', 'Tippe einen Begriff, er landet bei der markierten Zahl – Zahlen wie auf dem Fernseher.') + `
    <div class="mslots ${q.left.length > 4 ? 'tight' : ''}">${q.left.map((_, i) => `<button class="mslot ${match.active === i ? 'active' : ''} ${match.sel[i] !== null ? 'filled' : ''}" onclick="slotTap(${i})">
      <span class="mnum">${i + 1}</span><span class="mval">${match.sel[i] !== null ? esc(q.right[match.sel[i]]) : '…'}</span>${match.sel[i] !== null ? '<span class="mx">✕</span>' : ''}</button>`).join('')}</div>
    <div class="pool">${q.right.map((t, j) => used.has(j) ? '' : `<button class="pchip" onclick="poolTap(${j})">${esc(t)}</button>`).join('')}</div>
    <button class="btn" onclick="sendMatch()" ${complete ? '' : 'disabled'}>Abschicken</button>`;
}
function slotTap(i) {
  if (match.sel[i] !== null) match.sel[i] = null; // zurück in die Auswahl
  match.active = i;
  renderMatch();
}
function poolTap(j) {
  let slot = match.sel[match.active] === null ? match.active : match.sel.indexOf(null);
  if (slot < 0) return;
  match.sel[slot] = j;
  const next = match.sel.findIndex((x, i) => x === null && i > slot);
  match.active = next >= 0 ? next : Math.max(0, match.sel.indexOf(null));
  if (navigator.vibrate) navigator.vibrate(15);
  renderMatch();
}
function sendMatch() {
  if (match.sel.some(x => x === null)) return;
  sendAnswer({ order: match.sel.slice() }, '<div class="big">🔗</div>');
}

// ---------- Richtig oder falsch ----------
function renderTF() {
  const q = S.question, complete = tfMarks.every(m => m !== null);
  main.innerHTML = qline() + `
    <div class="tfq">${q.statements.map((t, i) => `<div class="tfitem">
      <div class="tfst"><span class="tfn">${i + 1}</span>${esc(t)}</div>
      <div class="tfbtns"><button class="tfb yes ${tfMarks[i] === true ? 'on' : ''}" onclick="tfSet(${i},true)">✓ Richtig</button><button class="tfb no ${tfMarks[i] === false ? 'on' : ''}" onclick="tfSet(${i},false)">✗ Falsch</button></div></div>`).join('')}</div>
    <button class="btn" onclick="sendTF()" ${complete ? '' : 'disabled'}>Abschicken</button>`;
}
function tfSet(i, v) { tfMarks[i] = v; if (navigator.vibrate) navigator.vibrate(12); renderTF(); }
function sendTF() {
  if (tfMarks.some(m => m === null)) return;
  sendAnswer({ marks: tfMarks.slice() }, '<div class="big">⚖️</div>');
}
function renderTFResult() {
  const q = S.question, r = S.me.result || { answered: false, pairs: [] }, a = S.me.answer, n = q.statements.length;
  const done = q.step >= n;
  main.innerHTML = `<div class="center top">
    <h1>${done ? (r.correct ? 'Alles richtig! 🎉' : r.answered ? `${r.right} von ${n} richtig` : 'Keine Antwort') : 'Auflösung …'}</h1>
    <div class="tfq">${q.statements.map((t, i) => {
      const shown = i < q.step, ok = r.pairs && r.pairs[i];
      const mine = a ? (a.marks[i] ? 'Richtig' : 'Falsch') : '–';
      return `<div class="tfitem tfr ${shown ? (ok ? 'ok' : 'bad') : ''}"><div class="tfst"><span class="tfn">${i + 1}</span>${esc(t)}</div>
        <div class="tfmine">Du: <b>${mine}</b>${shown ? ` · ${q.truths[i] ? 'stimmt' : 'stimmt nicht'} ${ok ? '✓' : '✗'}` : ' …'}</div></div>`;
    }).join('')}</div>
    ${done ? infoBox(q) + LATER : '<p>Schau auf den Fernseher 👀</p>'}</div>`;
}

function renderWaiting(html) {
  main.innerHTML = `<div class="center">${html}<h1>Eingeloggt!</h1><p>Warte auf die anderen …</p></div>`;
}

function renderVotes() {
  const a = S.me.answer;
  main.innerHTML = `<div class="center">
    ${a ? waitingFor(a) : '<div class="big">⏰</div>'}
    <h1>${a ? 'Zeit ist um!' : 'Keine Antwort'}</h1>
    <p>Schau auf den Fernseher 👀<br>Gleich kommt die Auflösung …</p></div>`;
}

function renderResult() {
  const r = S.me.result || { answered: false };
  const q = S.question;
  let cls, title, detail;
  if (q.kind === 'pin') {
    cls = !r.answered ? 'none' : r.correct ? 'ok' : r.gain ? 'mid' : 'bad';
    title = !r.answered ? 'Kein Pin' : r.correct ? (r.km < q.radius / 5 ? 'Volltreffer! 🎯' : 'Richtig! 🎉') : r.gain ? 'Knapp daneben' : 'Daneben';
    detail = `<p>${q.name ? `<b>${esc(q.name)}</b><br>` : ''}${r.answered ? `Du lagst <b>${kKm(r.km)}</b> daneben` : ''}<br><small>richtig bis ${kKm(q.radius)}${r.outOfRange ? ` · ab ${kKm(q.range)} keine Punkte` : ''}</small></p>`;
  } else if (q.kind === 'land') {
    cls = !r.answered ? 'none' : r.correct ? 'ok' : 'bad';
    title = !r.answered ? (r.risk ? 'Ausgesetzt – kein Risiko' : 'Zu langsam!') : r.correct ? 'Richtig! 🎉' : r.risk ? 'Falsch – das kostet Punkte 💥' : 'Leider falsch';
    const mine = r.answered && q.picks ? (q.picks.find(x => x.id === S.me.id) || {}).n : '';
    detail = `<p>Gesucht: <b>${esc(q.name)}</b>${mine && !r.correct ? `<br>Du: ${esc(mine)}` : ''}</p>`;
  } else if (q.kind === 'estimate') {
    const unit = q.unit ? ' ' + esc(q.unit) : '';
    cls = !r.answered ? 'none' : r.correct ? 'ok' : r.gain ? 'mid' : 'bad';
    title = !r.answered ? 'Keine Schätzung' : r.exact ? 'Exakt! 🎯' : r.correct ? 'Am nächsten dran! 🎉' : r.gain ? 'Nicht schlecht!' : 'Daneben';
    const far = r.outOfRange ? `<br><small>mehr als ±${fmt(q.tolerance)} ${q.year ? 'Jahre' : esc(q.unit || '')} daneben – keine Punkte</small>` : '';
    detail = `<p>Richtig: <b>${fmt(q.value)}${unit}</b>${r.answered ? `<br>Du: ${fmt(r.value)}${unit}` : ''}${far}</p>`;
  } else {
    cls = !r.answered ? 'none' : r.correct ? 'ok' : 'bad';
    title = !r.answered ? (r.risk ? 'Ausgesetzt – kein Risiko' : 'Zu langsam!') : r.correct ? 'Richtig! 🎉' : r.risk ? 'Falsch – das kostet Punkte 💥' : 'Leider falsch';
    detail = r.correct ? '' : `<p>Richtig war: ${SHAPES[q.correct]} · ${esc(q.answers[q.correct])}</p>`;
  }
  main.innerHTML = `<div class="res ${cls}"><h1>${title}</h1>${detail}
    ${infoBox(q)}${LATER}</div>`;
  if (navigator.vibrate) navigator.vibrate(r.correct ? 80 : [100, 60, 100]);
}

function renderMatchResult() {
  const q = S.question, r = S.me.result || { answered: false, pairs: [] }, a = S.me.answer;
  const done = q.step >= q.left.length;
  main.innerHTML = `<div class="center top">
    <h1>${done ? (r.correct ? 'Alles richtig! 🎉' : r.answered ? `${r.right} von ${q.left.length} richtig` : 'Keine Antwort') : 'Auflösung …'}</h1>
    <div class="mslots result">${q.left.map((_, i) => {
      const shown = i < q.step, mine = a ? q.right[a.order[i]] : '–';
      const ok = r.pairs && r.pairs[i];
      return `<div class="mslot ${shown ? (ok ? 'ok' : 'bad') : ''}"><span class="mnum">${i + 1}</span><span class="mval">${esc(mine)}</span>
        <span class="mx">${shown ? (ok ? '✓' : '✗') : '…'}</span></div>
        ${shown && !ok ? `<div class="fix">richtig: ${esc(q.right[q.solution[i]])}</div>` : ''}`;
    }).join('')}</div>
    ${done ? infoBox(q) + LATER : '<p>Schau auf den Fernseher 👀</p>'}</div>`;
}

function renderRank(end) {
  // Zwischenstand: erst wenn der Fernseher fertig sortiert hat, sonst ist die Spannung weg
  if (!end) {
    const wait = scoresSince + SCORES_REVEAL_MS - Date.now();
    if (wait > 0) {
      main.innerHTML = `<div class="center"><div class="big">📊</div><h1>Zwischenstand</h1><p>Schau auf den Fernseher 👀<br>Gleich siehst du deinen Platz …</p></div>`;
      clearTimeout(renderRank.t); renderRank.t = setTimeout(() => { if (S.phase === 'scores') { header(); renderRank(false); } }, wait + 50);
      return;
    }
  }
  // Gleichstand = gleicher Platz; „vor dir“ ist der Spieler mit den nächstmehr Punkten
  const me = S.me, ahead = S.players.filter(p => p.score > me.score).pop();
  const gap = ahead ? ahead.score - me.score : 0;
  const tied = S.players.filter(p => p.id !== me.id && p.score === me.score).map(p => esc(p.name));
  main.innerHTML = `<div class="center">
    <p>${end ? 'Endergebnis' : 'Zwischenstand'}</p>
    <div class="rank">${me.rank === 1 && end ? '🏆' : me.rank + '.'}</div>
    ${end && S.awards ? S.awards.filter(a => a.id === me.id).map(a => `<div class="myaward">${a.icon} <b>${esc(a.title)}</b><small>${esc(a.text)}</small></div>`).join('') : ''}
    <h1>${end ? (me.rank === 1 ? (tied.length ? 'Geteilter Sieg!' : 'Du hast gewonnen!') : `Platz ${me.rank}`) : pts(me.score)}</h1>
    <p>${me.rank === 1 ? (end ? `${pts(me.score)} – stark!` : tied.length ? `Gleichauf mit ${tied.join(', ')} 🤝` : 'Du führst! 🔥') : `${pts(gap)} hinter ${esc(ahead.name)}${tied.length ? ` · gleichauf mit ${tied.join(', ')}` : ''}`}</p>
    ${me.canLead ? `<button class="btn ${end ? '' : 'ghost'}" onclick="advance()">${end ? 'Neue Runde' : 'Weiter'}</button>` : ''}
  </div>`;
}
</script>
</body>
</html>
