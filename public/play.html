<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14102b">
<title>Quiz-Abend</title>
<style>
  :root { --bg: #14102b; --ink: #fff; --muted: #b9b2e6; --a: #e5484d; --b: #3e8ef7; --c: #f5b014; --d: #2fb36d; --pc: #6a5acd; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif, "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji"; background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); background: rgba(255,255,255,.06); font-weight: 800; }
  header .av { width: 36px; height: 36px; border-radius: 50%; background: var(--pc); display: grid; place-items: center; font-size: 20px; }
  header .score { margin-left: auto; font-variant-numeric: tabular-nums; background: rgba(255,255,255,.1); padding: 4px 12px; border-radius: 99px; }
  main { flex: 1; display: flex; flex-direction: column; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; }
  h1 { font-size: 34px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; }
  h1 span { color: var(--c); }
  p { color: var(--muted); font-size: 17px; line-height: 1.4; }
  input { width: 100%; max-width: 340px; font: inherit; font-size: 22px; font-weight: 700; padding: 16px 18px; border-radius: 14px; border: 3px solid transparent; background: #fff; color: #1b1440; text-align: center; outline: none; }
  input:focus { border-color: var(--c); }
  .btn { width: 100%; max-width: 340px; font: inherit; font-size: 21px; font-weight: 900; padding: 17px; border-radius: 14px; border: none; background: var(--c); color: #1b1440; box-shadow: 0 5px 0 rgba(0,0,0,.3); cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .btn:disabled { opacity: .4; }
  .btn.ghost { background: rgba(255,255,255,.12); color: #fff; }
  .err { color: #ff8787; font-weight: 700; min-height: 1.4em; }
  .big { font-size: 72px; line-height: 1; }
  .grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; }
  .ans { border: none; border-radius: 18px; color: #fff; font: inherit; font-weight: 800; font-size: 21px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; box-shadow: 0 6px 0 rgba(0,0,0,.3); cursor: pointer; text-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .ans .shape { font-size: 46px; line-height: 1; }
  .ans:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .c0 { background: var(--a); } .c1 { background: var(--b); } .c2 { background: var(--c); } .c3 { background: var(--d); }
  .qline { text-align: center; color: var(--muted); font-weight: 700; margin-bottom: 12px; font-size: 15px; }
  .chosen { width: 130px; height: 130px; border-radius: 26px; display: grid; place-items: center; font-size: 70px; color: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.3); }
  .res { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; animation: pop .4s cubic-bezier(.2,1.5,.4,1) both; }
  .res.ok { background: #2fb36d; } .res.bad { background: #e5484d; } .res.none { background: #3b3363; }
  .res h1 { font-size: 40px; } .res p { color: rgba(255,255,255,.9); font-size: 20px; font-weight: 700; }
  .hueip { width: 100%; box-sizing: border-box; margin: 8px 0; padding: 12px; border-radius: 12px; border: 0; font-size: 16px; }
  .huelist { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .huelist .btn { width: auto; margin: 0; }
  .later { font-size: 15px; opacity: .8; margin-top: 18px; }
  .res .gain { font-size: 30px; font-weight: 900; background: rgba(0,0,0,.18); padding: 8px 22px; border-radius: 99px; }
  .rank { font-size: 64px; font-weight: 900; color: var(--c); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }
  .offline { position: fixed; top: 0; left: 0; right: 0; background: #e5484d; color: #fff; text-align: center; padding: 8px; font-weight: 700; font-size: 14px; display: none; z-index: 9; }
  .leave { background: none; border: none; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; margin-top: 8px; }
  .small { font-size: 14px; color: var(--muted); }
  .btn.sm { width: auto; font-size: 16px; padding: 10px 18px; }
  .btn + .btn { margin-top: 2px; }
  .badge { display: inline-block; background: var(--c); color: #1b1440; border-radius: 99px; padding: 2px 10px; margin-right: 8px; font-weight: 900; }
  .hint { text-align: center; font-size: 14px; margin-bottom: 10px; }
  .center.top { justify-content: flex-start; padding-top: 10px; }
  /* Schätzen */
  .est { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .display { background: #fff; color: #1b1440; border-radius: 16px; padding: 16px; text-align: center; font-size: 40px; font-weight: 900; min-height: 82px; display: flex; align-items: baseline; justify-content: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .display small { font-size: 20px; color: #6a5acd; }
  .display .ph { font-size: 20px; color: #9a94bf; font-weight: 700; }
  .pad { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button { font: inherit; font-size: 28px; font-weight: 800; border: none; border-radius: 14px; background: rgba(255,255,255,.12); color: #fff; min-height: 56px; }
  .pad button:active { background: rgba(255,255,255,.3); }
  .bigval { font-size: 48px; font-weight: 900; background: #fff; color: #1b1440; border-radius: 20px; padding: 14px 26px; }
  /* Zuordnen */
  .mslots { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .mslot { display: flex; align-items: center; gap: 12px; width: 100%; border: 3px solid transparent; border-radius: 14px; background: rgba(255,255,255,.1); color: #fff; font: inherit; font-size: 19px; font-weight: 800; padding: 10px 12px; text-align: left; }
  .mslot.active { border-color: var(--c); background: rgba(245,176,20,.15); }
  .mslot.filled { background: rgba(255,255,255,.2); }
  .mslot .mnum { width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--c); color: #1b1440; display: grid; place-items: center; font-weight: 900; }
  .mslot .mval { flex: 1; }
  .mslot .mx { opacity: .7; font-size: 18px; }
  .mslot.ok { background: rgba(47,179,109,.5); } .mslot.bad { background: rgba(229,72,77,.45); }
  .fix { font-size: 14px; color: #ffd0d0; margin: -6px 0 0 60px; text-align: left; width: 100%; }
  .pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 16px 0; min-height: 50px; }
  .pchip { font: inherit; font-size: 18px; font-weight: 800; border: none; border-radius: 99px; background: #fff; color: #1b1440; padding: 12px 18px; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .pchip:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .res.mid { background: #d9930d; }
  .gain.dark { font-size: 26px; font-weight: 900; background: rgba(255,255,255,.12); padding: 8px 22px; border-radius: 99px; }
  /* Paketauswahl */
  .settings { display: flex; flex-direction: column; gap: 12px; }
  .shead { display: flex; align-items: center; justify-content: space-between; }
  .shead h2 { font-size: 24px; }
  .pergame { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px 14px; font-weight: 700; }
  .pergame span { flex: 1; }
  .pergame button { width: 42px; height: 42px; border-radius: 50%; border: none; font: inherit; font-size: 24px; font-weight: 900; background: rgba(255,255,255,.15); color: #fff; }
  .pergame b { font-size: 22px; min-width: 30px; text-align: center; }
  .group { background: rgba(255,255,255,.06); border-radius: 14px; overflow: hidden; }
  .group label { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .group input { width: 24px; height: 24px; accent-color: var(--c); flex: none; }
  .grow { background: rgba(255,255,255,.08); font-weight: 900; font-size: 18px; }
  .gname { flex: 1; } .gcount { color: var(--muted); font-size: 14px; }
  .prow { padding-left: 30px !important; border-top: 1px solid rgba(255,255,255,.06); font-weight: 700; }
  .pname { flex: 1; } .pmeta { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .errors { background: rgba(229,72,77,.2); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
  .errors code { color: #ffd0d0; }
  .legend { text-align: center; }
  .emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; width: 100%; max-width: 340px; }
  .emo { font-size: 28px; aspect-ratio: 1; border-radius: 12px; border: 3px solid transparent; background: rgba(255,255,255,.08); padding: 0; }
  .emo.on { border-color: var(--c); background: rgba(245,176,20,.2); }
  .emo:disabled { opacity: .18; }
  .settings h3 { font-size: 16px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 8px; }
  .blockcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: #fff; border: none; border-radius: 14px; background: rgba(255,255,255,.1); padding: 12px 14px; }
  .bnum { width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #1b1440; display: grid; place-items: center; font-weight: 900; flex: none; }
  .binfo { flex: 1; display: flex; flex-direction: column; gap: 2px; font-size: 16px; }
  .binfo small { color: var(--muted); font-size: 13px; }
  .bgo { font-size: 26px; color: var(--muted); }
  .warnc { color: #ffb4b4; }
  .switch { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.08); border-radius: 14px; padding: 12px 14px; font-weight: 700; }
  .switch input { width: 24px; height: 24px; accent-color: var(--c); flex: none; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg button { font: inherit; font-size: 22px; font-weight: 900; border: none; border-radius: 12px; padding: 12px; background: rgba(255,255,255,.1); color: #fff; }
  .seg button.on { background: var(--c); color: #1b1440; }
  .pname small { margin-left: 6px; font-size: 12px; }
  .lv { font-style: normal; margin-left: 6px; } .lv1 { color: #8ff0b5; } .lv2 { color: #ffd43b; } .lv3 { color: #ff8787; }
  .center.special h1 { color: var(--c); font-size: 40px; }
  .gain small { font-size: .6em; opacity: .85; }
  .ans.long { font-size: 17px; } .ans.xlong { font-size: 15px; }
  .pchip { max-width: 100%; }
  .mslots.tight { gap: 6px; } .mslots.tight .mslot { padding: 6px 10px; font-size: 17px; } .mslots.tight .mnum { width: 30px; height: 30px; }
  .mslots.tight ~ .pool { gap: 6px; margin: 10px 0; } .mslots.tight ~ .pool .pchip { padding: 9px 14px; font-size: 16px; }
  .hostbtn { border: none; background: rgba(255,255,255,.12); color: #fff; font-size: 20px; border-radius: 10px; width: 40px; height: 36px; margin-left: 6px; }
  .prow2 { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.08); border-radius: 12px; padding: 8px 10px; }
  .prow2.off { opacity: .55; }
  .prow2 input { flex: 1; font: inherit; font-size: 18px; padding: 8px 10px; border-radius: 10px; border: none; }
  .pav { width: 36px; height: 36px; border-radius: 50%; background: var(--pc); display: grid; place-items: center; font-size: 20px; flex: none; }
  .pn { flex: 1; font-weight: 800; display: flex; flex-direction: column; } .pn small { color: var(--muted); font-weight: 600; font-size: 12px; }
  .ib { border: none; background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; min-width: 40px; height: 36px; font: inherit; font-size: 15px; font-weight: 800; }
  .ib.warn { background: #e5484d; padding: 0 10px; }
  .btn.danger { background: #e5484d; color: #fff; }
  .sysb { max-width: none; }
  .sysout { background: rgba(47,179,109,.25); border-radius: 12px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; }
  .sysout.bad { background: rgba(229,72,77,.25); }
  .pcount { font-size: 64px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--c); }
</style>
</head>
<body>
<div class="offline" id="offline">Verbindung weg – verbinde neu …</div>
<header id="hdr" style="display:none"><span class="av" id="hAv"></span><span id="hName"></span><span class="score" id="hScore">0</span><button class="hostbtn" id="hostBtn" style="display:none" onclick="toggleHost()">🎛️</button></header>
<main id="main"></main>
<script>
const SHAPES = ['▲', '◆', '●', '■'];
const main = document.getElementById('main');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => Math.abs(n) >= 10000 ? n.toLocaleString('de-DE') : String(n).replace('.', ',');
let myId = localStorage.getItem('quizId');
let serverVersion = null, lastQ = null, lastPh = null;
let S = null, es = null, lastKey = '', joining = false, sending = false;
let ui = { settings: false, packs: null, edit: null, avatar: null, host: false, renaming: null, sys: null, confirm: null }; // Einstellungen (nur 👑), Emoji-Wahl
let est = '';                                  // Schätzfrage: Eingabe
let match = { sel: [], active: 0 };            // Zuordnen: sel[slot] = Index im rechten Begriff

function connect() {
  if (es) es.close();
  es = new EventSource('/events?role=player' + (myId ? '&id=' + encodeURIComponent(myId) : ''));
  es.onmessage = e => {
    document.getElementById('offline').style.display = 'none';
    S = JSON.parse(e.data);
    if (serverVersion && S.version && S.version !== serverVersion) return location.reload(); // neue Version
    serverVersion = S.version || serverVersion;
    render();
  };
  es.onerror = () => { document.getElementById('offline').style.display = 'block'; };
}
connect();

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', body: JSON.stringify(body) });
  return { ok: r.ok, data: await r.json().catch(() => ({})) };
}

async function join(ev) {
  ev.preventDefault();
  if (joining) return;
  const name = document.getElementById('name').value.trim();
  if (!name) return;
  joining = true;
  const { ok, data } = await post('/api/join', { name, avatar: ui.avatar });
  joining = false;
  if (!ok) { document.getElementById('err').textContent = data.error || 'Hat nicht geklappt.'; if (data.avatarTaken) { ui.avatar = null; lastKey = ''; render(); } return; }
  localStorage.setItem('quizAvatar', ui.avatar || '');
  localStorage.setItem('quizName', name);
  localStorage.setItem('quizId', data.id);
  myId = data.id;
  lastKey = '';
  connect();
}

function sendAnswer(payload, waitingHtml) {
  if (sending || (S.me && S.me.answer)) return;
  sending = true;
  if (navigator.vibrate) navigator.vibrate(30);
  renderWaiting(waitingHtml);
  post('/api/answer', { id: myId, ...payload }).finally(() => { sending = false; });
}
const chosenHtml = i => `<div class="chosen c${i}">${SHAPES[i]}</div>`;

function advance() { post('/api/advance', { id: myId }); }
function leave() {
  post('/api/leave', { id: myId });
  localStorage.removeItem('quizId'); myId = null; lastKey = ''; connect();
}

// Punkte gibt's erst am Blockende – während der Fragen bleiben sie verborgen
const HIDE_PTS = ['intro', 'media', 'preview', 'question', 'special', 'votes', 'reveal'];
let shownScore = 0, scoresSince = 0;
const SCORES_REVEAL_MS = 10400;  // so lange braucht der Fernseher, bis die Rangliste sortiert ist
const LATER = '<p class="later">Punkte und Platz gibt\'s am Ende des Blocks 🤫</p>';
function header() {
  const h = document.getElementById('hdr');
  if (!S.me) { h.style.display = 'none'; return; }
  h.style.display = '';
  document.documentElement.style.setProperty('--pc', S.me.color);
  document.getElementById('hAv').textContent = S.me.avatar;
  document.getElementById('hName').textContent = S.me.name + (S.me.isVip ? ' 👑' : '');
  const sorting = S.phase === 'scores' && Date.now() < scoresSince + SCORES_REVEAL_MS;
  if (!HIDE_PTS.includes(S.phase) && !sorting) shownScore = S.me.score;     // während eines Blocks bleibt der Stand vom letzten Blockende stehen
  document.getElementById('hScore').textContent = shownScore + ' P';
  document.getElementById('hostBtn').style.display = S.me.isVip && S.phase !== 'lobby' ? '' : 'none';
}

function qline(extra) {
  const q = S.question;
  return `<div class="qline">${q && q.label ? `<span class="badge">${q.icon} ${esc(q.label)}</span>` : ''}${S.block && S.block.total > 1 && S.block.len ? `Block ${S.block.num}/${S.block.total} · Frage ${S.block.q} / ${S.block.len}` : `Frage ${S.qNum} / ${S.qTotal}`}${extra ? ' · ' + extra : ''}</div>`;
}

function render() {
  if (S.phase === 'scores' && lastPh !== 'scores') scoresSince = Date.now();
  header();
  const me = S.me;
  const lobbyKey = S.phase === 'lobby' ? [S.players.filter(p => p.connected).length, JSON.stringify(S.packs), ui.settings].join(',') : '';
  const joinKey = me ? '' : S.players.map(p => p.avatar).join('');
  const hostKey = ui.host ? [S.players.map(p => p.id + p.name + p.connected).join(','), ui.renaming].join('|') : '';
  const key = [joinKey, hostKey, ui.host, S.frozen, JSON.stringify(S.system), S.kicked, S.phase, S.qNum, me ? me.id : '-', me && JSON.stringify(me.answer && (me.answer.choice ?? me.answer.value ?? me.answer.order)),
    me && me.isVip, lobbyKey, S.question && S.question.step].join('|');
  if (key === lastKey) return; // nichts Relevantes geändert (Eingaben nicht zerstören)
  const newQuestion = lastQ !== S.qNum || lastPh !== 'question';
  lastKey = key; lastQ = S.qNum; lastPh = S.phase;

  if (S.system) return renderInfo(S.system.icon, S.system.text, 'Das Quiz ist gleich wieder da.');
  if (!me) return renderJoin();
  if (ui.host && me.isVip && S.phase !== 'lobby') return renderHost();
  ui.host = false;
  if (S.frozen) return renderFrozen();
  if (S.phase !== 'lobby') ui.settings = false;
  if (S.phase === 'lobby') return ui.settings && me.isVip ? renderSettings() : renderLobby();
  if (S.phase === 'pause') return renderPause();
  if (S.phase === 'opening') {
    renderInfo('🎬', 'Gleich geht\'s los!', 'Schau auf den Fernseher – dort siehst du, was euch heute erwartet.');
    if (me.isVip) main.querySelector('.center').insertAdjacentHTML('beforeend', '<button class="btn ghost" style="margin-top:3vh" onclick="advance()">⏭ Intro überspringen</button>');
    return;
  }
  if (S.phase === 'block') return renderInfo('📦', `Block ${S.block.num} von ${S.block.total}`, `${esc(S.block.names.join(', '))}<br>Schau auf den Fernseher!`);
  if (S.phase === 'special') return renderInfo('⭐', 'Spezialfrage!', `Diese Frage zählt <b>×${S.special.mult}</b> Punkte!<br>Schau auf den Fernseher 👀`, 'special');
  if (S.phase === 'intro') return renderInfo(S.question.icon, S.question.label, `Kategorie: ${esc(S.question.category)}<br>Gleich geht's los – schau auf den Fernseher!`);
  if (S.phase === 'media') return S.question.audio
    ? renderInfo('🎧', 'Hör genau hin!', (S.question.audioOpts && S.question.audioOpts.reverse ? '⏪ Der Ausschnitt läuft rückwärts!<br>' : '') + 'Der Ton kommt vom Fernseher – danach kommt die Frage dazu.')
    : renderInfo('👀', 'Schau genau hin!', 'Das Video läuft auf dem Fernseher – danach kommt die Frage dazu.');
  if (S.phase === 'preview') return renderInfo('👀', 'Merk dir die Begriffe!', 'Gleich musst du ihnen auf dem Handy die richtigen Partner zuordnen.');
  if (S.phase === 'question') {
    if (me.answer) return renderWaiting(waitingFor(me.answer));
    if (newQuestion) { est = ''; match = { sel: (S.question.left || []).map(() => null), active: 0 }; if (navigator.vibrate) navigator.vibrate([60, 40, 60]); }
    const k = S.question.kind;
    return k === 'estimate' ? renderEstimate() : k === 'match' ? renderMatch() : renderChoice();
  }
  if (S.phase === 'votes') return renderVotes();
  if (S.phase === 'reveal') return S.question.kind === 'match' ? renderMatchResult() : renderResult();
  if (S.phase === 'scores') return renderRank(false);
  if (S.phase === 'end') return renderRank(true);
}

function waitingFor(a) {
  if (a.choice !== undefined) return chosenHtml(a.choice);
  if (a.value !== undefined) return `<div class="bigval">${fmt(a.value)}${S.question.unit ? ' ' + esc(S.question.unit) : ''}</div>`;
  return '<div class="big">🔗</div>';
}

function renderJoin() {
  myId = null; localStorage.removeItem('quizId');
  const full = S.players.length >= S.maxPlayers;
  const taken = new Set(S.players.map(p => p.avatar));
  const prev = document.getElementById('name');
  const name = prev ? prev.value : (localStorage.getItem('quizName') || '');
  const fav = localStorage.getItem('quizAvatar');
  if (!ui.avatar || taken.has(ui.avatar)) ui.avatar = fav && !taken.has(fav) ? fav : S.avatars.find(a => !taken.has(a));
  main.innerHTML = `<form class="center" onsubmit="join(event)">

async function openSettings() {
  ui.settings = true; ui.edit = null; lastKey = '';
  main.innerHTML = '<div class="center"><p>Lade Einstellungen …</p></div>';
  ui.packs = await fetch('/api/pakete').then(r => r.json()).catch(() => null);
  ui.hue = { st: (await hueCall('status')) || null };
  lastKey = ''; render();
}
function closeSettings() { ui.settings = false; lastKey = ''; render(); }
const cfg = () => ui.packs.settings;

async function saveCfg() {
  const { ok, data } = await post('/api/einstellungen', { id: myId, settings: cfg() });
  if (ok) ui.packs = data;
  lastKey = ''; render();
}
function setBlocks(n) {
  const b = cfg().blocks;
  while (b.length < n) b.push({ count: 10, disabled: [] });
  b.length = Math.max(1, Math.min(6, n));
  saveCfg();
}
function setCount(bi, d) { const b = cfg().blocks[bi]; b.count = Math.max(1, Math.min(50, b.count + d)); saveCfg(); }
function packOn(bi, id, on) {
  const dis = new Set(cfg().blocks[bi].disabled);
  on ? dis.delete(id) : dis.add(id);
  cfg().blocks[bi].disabled = [...dis];
}
function togglePack(gi, pi, on) { packOn(ui.edit, ui.packs.groups[gi].packs[pi].id, on); saveCfg(); }
function toggleGroup(gi, on) { ui.packs.groups[gi].packs.forEach(p => packOn(ui.edit, p.id, on)); saveCfg(); }
function editBlock(i) { ui.edit = i; lastKey = ''; render(); window.scrollTo(0, 0); }
const PAUSE_STEPS = [0, 1, 2, 3, 5, 10, 15, 20, 30, 45, 60];
function setPause(d) {
  const p = cfg().pause, i = PAUSE_STEPS.findIndex(x => x >= p.minutes);
  p.minutes = PAUSE_STEPS[Math.max(0, Math.min(PAUSE_STEPS.length - 1, (i < 0 ? PAUSE_STEPS.length - 1 : i) + d))]; saveCfg();
}

// ---------- System: Update, Neustart, Ausschalten ----------
function systemSection(sys) {
  if (!sys || (!sys.canUpdate && !sys.canPower)) return '';
  const btn = (a, label, cls) => `<button class="btn ${cls || 'ghost'} sysb" onclick="sysAction('${a}')">${ui.confirm === a ? 'Wirklich? Nochmal tippen' : label}</button>`;
  return `<h3>🛠️ System</h3>
    ${sys.canUpdate ? btn('update', '⬇️ Update holen') : ''}
    ${sys.canPower ? btn('reboot', '🔄 Pi neu starten') + btn('poweroff', '🔌 Pi ausschalten', 'danger') : ''}
    ${ui.sys ? `<div class="sysout ${ui.sys.ok ? '' : 'bad'}">${esc(ui.sys.text)}</div>` : ''}
    ${sys.canUpdate && !sys.autoRestart ? '<p class="small">Nach einem Update den Server neu starten.</p>' : ''}`;
}
async function sysAction(a) {
  if (a !== 'update' && ui.confirm !== a) { ui.confirm = a; lastKey = ''; render(); return; } // Sicherheitsabfrage
  ui.confirm = null; ui.sys = { ok: true, text: a === 'update' ? 'Suche nach Updates …' : 'Wird ausgeführt …' }; lastKey = ''; render();
  const { data } = await post('/api/system', { id: myId, action: a });
  ui.sys = a === 'update'
    ? { ok: data.ok, text: data.ok ? (data.changed ? (data.restart ? 'Update installiert – QuizAbend startet neu.' : 'Update geladen – bitte Server neu starten.') : 'Schon auf dem neuesten Stand ✓') : 'Update fehlgeschlagen: ' + (data.text || '') }
    : { ok: data.ok, text: data.ok ? 'OK' : (data.text || 'Hat nicht geklappt (fehlen sudo-Rechte?)') };
  lastKey = ''; render();
}

// ---------- Philips Hue (Test) ----------
async function hueCall(action, extra) {
  const { data } = await post('/api/hue', { id: myId, action, ...(extra || {}) });
  return data;
}
function hueSection() {
  const h = ui.hue || {}, st = h.st;
  if (!st) return '';
  const msg = h.msg ? `<div class="sysout ${h.msg.ok ? '' : 'bad'}">${esc(h.msg.text)}</div>` : '';
  let body;
  if (!st.paired) {
    body = `<p class="small">Das Quiz dimmt den Raum während des Spiels, färbt das Licht bei der Auflösung in der Farbe der richtigen Antwort und macht es in der Pause hell.</p>
      <button class="btn ghost" onclick="hueDiscover()">🔍 Bridge suchen</button>
      ${(h.ips || []).map(ip => `<button class="btn ${h.ip === ip ? '' : 'ghost'} sm" onclick="ui.hue.ip='${esc(ip)}'; lastKey=''; render()">${esc(ip)}</button>`).join(' ')}
      <input class="hueip" id="hueip" placeholder="oder IP der Bridge, z. B. 192.168.178.20" value="${esc(h.ip || '')}" oninput="ui.hue.ip=this.value">
      <p class="small">Drück den runden Knopf oben auf der Bridge und tippe dann innerhalb von 30 Sekunden auf „Verbinden“.</p>
      <button class="btn" onclick="huePair()">🔗 Verbinden</button>`;
  } else {
    const groups = {};
    (h.list || []).forEach(t => (groups[t.group] = groups[t.group] || []).push(t));
    body = `<p class="small">Verbunden mit der Bridge ${esc(st.ip)}${st.target ? ` · Bereich: <b>${esc(st.target.name)}</b> (${st.lights} Lampen)` : ''}</p>
      ${st.target ? `<label class="switch"><input type="checkbox" ${st.enabled ? 'checked' : ''} onchange="hueEnable(this.checked)"><span>Licht im Spiel steuern</span></label>` : ''}
      ${h.list ? Object.entries(groups).map(([g, l]) => `<p class="small"><b>${esc(g)}</b></p><div class="huelist">${l.map(t =>
        `<button class="btn sm ${st.target && st.target.id === t.id ? '' : 'ghost'}" onclick="hueSelect('${t.kind}','${esc(t.id)}')">${esc(t.name)}</button>`).join('')}</div>`).join('')
        : `<button class="btn ghost" onclick="hueTargets()">${st.target ? '🔁 Anderen Bereich wählen' : '💡 Bereich wählen'}</button>`}
      ${st.target ? '<button class="btn ghost" onclick="hueTest()">✨ Testen</button>' : ''}
      <button class="btn ghost sm" onclick="hueForget()">Verbindung trennen</button>`;
  }
  return `<h3>💡 Philips Hue <small>(Test)</small></h3>${body}${msg}`;
}
async function hueRefresh(msg) { ui.hue.st = await hueCall('status'); ui.hue.msg = msg || null; lastKey = ''; render(); }
async function hueDiscover() {
  ui.hue.msg = { ok: true, text: 'Suche …' }; lastKey = ''; render();
  const r = await hueCall('discover'); ui.hue.ips = r.ips || [];
  if (ui.hue.ips.length === 1) ui.hue.ip = ui.hue.ips[0];
  ui.hue.msg = { ok: !!ui.hue.ips.length, text: ui.hue.ips.length ? 'Gefunden – wähle die Bridge.' : 'Keine Bridge gefunden. Gib die IP von Hand ein (steht in der Hue-App unter Einstellungen › Bridges).' };
  lastKey = ''; render();
}
async function huePair() {
  if (!ui.hue.ip) { ui.hue.msg = { ok: false, text: 'Erst eine Bridge wählen oder die IP eingeben.' }; lastKey = ''; render(); return; }
  ui.hue.msg = { ok: true, text: 'Verbinde …' }; lastKey = ''; render();
  const r = await hueCall('pair', { ip: ui.hue.ip });
  if (r.ok) { await hueRefresh({ ok: true, text: 'Verbunden ✓ Jetzt den Bereich wählen.' }); return hueTargets(); }
  ui.hue.msg = { ok: false, text: r.text || 'Hat nicht geklappt.' }; lastKey = ''; render();
}
async function hueTargets() {
  const r = await hueCall('targets');
  if (!r.ok) return hueRefresh({ ok: false, text: r.text });
  ui.hue.list = r.list; lastKey = ''; render();
}
async function hueSelect(kind, target) {
  const r = await hueCall('select', { kind, target });
  ui.hue.list = null;
  await hueRefresh(r.ok ? { ok: true, text: `Bereich gewählt: ${r.count} Lampen.` } : { ok: false, text: r.text });
}
async function hueEnable(on) { await hueCall('enable', { on }); hueRefresh(); }
async function hueTest() { const r = await hueCall('test'); hueRefresh(r.ok ? { ok: true, text: 'Die Lampen sollten jetzt kurz gold pulsieren.' } : { ok: false, text: r.text }); }
async function hueForget() {
  if (ui.confirm !== 'hue') { ui.confirm = 'hue'; ui.hue.msg = { ok: false, text: 'Nochmal auf „Verbindung trennen“ tippen zum Bestätigen.' }; lastKey = ''; render(); return; }
  ui.confirm = null; await hueCall('forget'); ui.hue.list = null; hueRefresh({ ok: true, text: 'Getrennt.' });
}

function renderEstimate() {
  const q = S.question;
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', q.year ? '' : ',', '0', '⌫'];
  const tol = q.tolerance !== null && q.tolerance !== undefined
    ? `<p class="hint">Punkte nur bei höchstens ±${fmt(q.tolerance)} ${q.year ? (q.tolerance === 1 ? 'Jahr' : 'Jahren') : esc(q.unit || '')} Abweichung</p>` : '';
  main.innerHTML = qline(q.year ? 'Jahreszahl!' : 'Schätze!') + tol + `
    <div class="est">
      <div class="display"><span id="disp">${est ? esc(est) : `<span class="ph">${q.year ? 'Jahreszahl' : 'Zahl'} eingeben</span>`}</span>${q.unit ? `<small>${esc(q.unit)}</small>` : ''}</div>
      <div class="pad">${keys.map(k => k ? `<button onclick="estKey('${k}')">${k}</button>` : '<span></span>').join('')}</div>
      <button class="btn" onclick="sendEstimate()" ${est && est !== '-' ? '' : 'disabled'}>Abschicken</button>
    </div>`;
}
function estKey(k) {
  if (k === '⌫') est = est.slice(0, -1);
  else if (k === ',') { if (est && !est.includes(',')) est += ','; }
  else if (est.replace(',', '').length < 10) est = (est === '0' ? '' : est) + k;
  if (navigator.vibrate) navigator.vibrate(10);
  renderEstimate();
}
function sendEstimate() {
  const value = Number(est.replace(',', '.'));
  if (!est || !isFinite(value)) return;
  sendAnswer({ value }, waitingFor({ value }));
}

function renderMatch() {
  const q = S.question, used = new Set(match.sel.filter(x => x !== null));

  main.innerHTML = qline('Ordne zu!') + `
    <p class="hint">Tippe einen Begriff, er landet bei der markierten Zahl – Zahlen wie auf dem Fernseher.</p>
    <div class="mslots ${q.left.length > 4 ? 'tight' : ''}">${q.left.map((_, i) => `<button class="mslot ${match.active === i ? 'active' : ''} ${match.sel[i] !== null ? 'filled' : ''}" onclick="slotTap(${i})">
      <span class="mnum">${i + 1}</span><span class="mval">${match.sel[i] !== null ? esc(q.right[match.sel[i]]) : '…'}</span>${match.sel[i] !== null ? '<span class="mx">✕</span>' : ''}</button>`).join('')}</div>
    <div class="pool">${q.right.map((t, j) => used.has(j) ? '' : `<button class="pchip" onclick="poolTap(${j})">${esc(t)}</button>`).join('')}</div>
    <button class="btn" onclick="sendMatch()" ${complete ? '' : 'disabled'}>Abschicken</button>`;
}
function slotTap(i) {
  if (match.sel[i] !== null) match.sel[i] = null; // zurück in die Auswahl
  match.active = i;
  renderMatch();
}
function poolTap(j) {
  let slot = match.sel[match.active] === null ? match.active : match.sel.indexOf(null);
  if (slot < 0) return;
  match.sel[slot] = j;
  const next = match.sel.findIndex((x, i) => x === null && i > slot);
  match.active = next >= 0 ? next : Math.max(0, match.sel.indexOf(null));
  if (navigator.vibrate) navigator.vibrate(15);
  renderMatch();
}
function sendMatch() {
  if (match.sel.some(x => x === null)) return;
  sendAnswer({ order: match.sel.slice() }, '<div class="big">🔗</div>');
}

function renderWaiting(html) {
  main.innerHTML = `<div class="center">${html}<h1>Eingeloggt!</h1><p>Warte auf die anderen …</p></div>`;
}

function renderVotes() {
  const a = S.me.answer;
  main.innerHTML = `<div class="center">
    ${a ? waitingFor(a) : '<div class="big">⏰</div>'}
    <h1>${a ? 'Zeit ist um!' : 'Keine Antwort'}</h1>
    <p>Schau auf den Fernseher 👀<br>Gleich kommt die Auflösung …</p></div>`;
}

function renderResult() {
  const r = S.me.result || { answered: false };
  const q = S.question;
  let cls, title, detail;
  if (q.kind === 'estimate') {
    const unit = q.unit ? ' ' + esc(q.unit) : '';
    cls = !r.answered ? 'none' : r.correct ? 'ok' : r.gain ? 'mid' : 'bad';
    title = !r.answered ? 'Keine Schätzung' : r.exact ? 'Exakt! 🎯' : r.correct ? 'Am nächsten dran! 🎉' : r.gain ? 'Nicht schlecht!' : 'Daneben';
    const far = r.outOfRange ? `<br><small>mehr als ±${fmt(q.tolerance)} ${q.year ? 'Jahre' : esc(q.unit || '')} daneben – keine Punkte</small>` : '';
    detail = `<p>Richtig: <b>${fmt(q.value)}${unit}</b>${r.answered ? `<br>Du: ${fmt(r.value)}${unit}` : ''}${far}</p>`;
  } else {
    cls = !r.answered ? 'none' : r.correct ? 'ok' : 'bad';
    title = !r.answered ? 'Zu langsam!' : r.correct ? 'Richtig! 🎉' : 'Leider falsch';
    detail = r.correct ? '' : `<p>Richtig war: ${SHAPES[q.correct]} ${esc(q.answers[q.correct])}</p>`;
  }
  main.innerHTML = `<div class="res ${cls}"><h1>${title}</h1>${detail}
    ${LATER}</div>`;
  if (navigator.vibrate) navigator.vibrate(r.correct ? 80 : [100, 60, 100]);
}

function renderMatchResult() {
  const q = S.question, r = S.me.result || { answered: false, pairs: [] }, a = S.me.answer;
  const done = q.step >= q.left.length;
  main.innerHTML = `<div class="center top">
    <h1>${done ? (r.correct ? 'Alles richtig! 🎉' : r.answered ? `${r.right} von ${q.left.length} richtig` : 'Keine Antwort') : 'Auflösung …'}</h1>
    <div class="mslots result">${q.left.map((_, i) => {
      const shown = i < q.step, mine = a ? q.right[a.order[i]] : '–';
      const ok = r.pairs && r.pairs[i];
      return `<div class="mslot ${shown ? (ok ? 'ok' : 'bad') : ''}"><span class="mnum">${i + 1}</span><span class="mval">${esc(mine)}</span>
        <span class="mx">${shown ? (ok ? '✓' : '✗') : '…'}</span></div>
        ${shown && !ok ? `<div class="fix">richtig: ${esc(q.right[q.solution[i]])}</div>` : ''}`;
    }).join('')}</div>
    ${done ? LATER : '<p>Schau auf den Fernseher 👀</p>'}</div>`;
}

function renderRank(end) {
  // Zwischenstand: erst wenn der Fernseher fertig sortiert hat, sonst ist die Spannung weg
  if (!end) {
    const wait = scoresSince + SCORES_REVEAL_MS - Date.now();
    if (wait > 0) {
      main.innerHTML = `<div class="center"><div class="big">📊</div><h1>Zwischenstand</h1><p>Schau auf den Fernseher 👀<br>Gleich siehst du deinen Platz …</p></div>`;
      clearTimeout(renderRank.t); renderRank.t = setTimeout(() => { if (S.phase === 'scores') { header(); renderRank(false); } }, wait + 50);
      return;
    }
  }
  const me = S.me, ahead = S.players[me.rank - 2];
  const gap = ahead ? ahead.score - me.score : 0;
  main.innerHTML = `<div class="center">
    <p>${end ? 'Endergebnis' : 'Zwischenstand'}</p>
    <div class="rank">${me.rank === 1 && end ? '🏆' : me.rank + '.'}</div>
    <h1>${end ? (me.rank === 1 ? 'Du hast gewonnen!' : `Platz ${me.rank}`) : `${me.score} Punkte`}</h1>
    <p>${me.rank === 1 ? (end ? `${me.score} Punkte – stark!` : 'Du führst! 🔥') : `${gap} Punkte hinter ${esc(ahead.name)}`}</p>
    ${me.isVip ? `<button class="btn ${end ? '' : 'ghost'}" onclick="advance()">${end ? 'Neue Runde' : 'Weiter'}</button>` : ''}
  </div>`;
}
</script>
</body>
</html>
