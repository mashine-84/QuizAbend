<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz-Abend – TV</title>
<style>
  :root {
    --bg: #14102b; --bg2: #221a4d; --ink: #fff; --muted: #b9b2e6;
    --a: #e5484d; --b: #3e8ef7; --c: #f5b014; --d: #2fb36d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif, "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji";
    color: var(--ink); overflow: hidden; cursor: default;
    background: radial-gradient(ellipse at 20% 0%, #3a2a8a 0%, transparent 55%),
                radial-gradient(ellipse at 100% 100%, #5b1f6e 0%, transparent 50%), var(--bg);
    font-size: 1.6vw;
    --row: 13vh;   /* einheitliche Höhe für Antwort-Kacheln und Zuordnungszeilen */
    --rowfont: min(2.3vw, 4vh);  /* einheitliche Schrift dafür */
  }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 3vh 4vw 4.5vh; }
  .brand { font-weight: 900; letter-spacing: -0.02em; }
  .brand span { color: var(--c); }
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 1.4vw; color: var(--muted); min-height: 4vh; }
  .pill { background: rgba(255,255,255,.1); border-radius: 99px; padding: .4em 1.1em; font-weight: 700; color: var(--ink); }

  /* Lobby */
  .lobby { flex: 1; display: grid; grid-template-columns: 1fr 1.25fr; gap: 4vw; align-items: center; }
  .join h1 { font-size: 5.4vw; line-height: 1; font-weight: 900; letter-spacing: -0.03em; }
  .join h1 span { color: var(--c); }
  .join p { color: var(--muted); font-size: 1.7vw; margin: 2vh 0 3vh; }
  .qrbox { display: flex; gap: 2vw; align-items: center; }
  .qr { width: 17vw; height: 17vw; background: #fff; border-radius: 1.2vw; padding: .6vw; box-shadow: 0 1vw 3vw rgba(0,0,0,.4); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .url { font-size: 1.5vw; color: var(--muted); }
  .url b { display: block; color: var(--ink); font-size: 1.8vw; margin-top: .4vh; white-space: nowrap; }
  .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.6vh 1.4vw; }
  .slot { height: 9.5vh; border-radius: 1.2vw; border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); display: flex; align-items: center; gap: 1vw; padding: 0 1.4vw; color: rgba(255,255,255,.3); font-size: 1.5vw; }
  .slot.on { border: none; background: var(--pc); color: #fff; font-weight: 800; font-size: 2vw; box-shadow: 0 .6vh 0 rgba(0,0,0,.25); }
  .slot .av { font-size: 2.8vw; }
  .slot .crown { margin-left: auto; font-size: 1.7vw; }
  .slot.off { opacity: .45; }
  .hint { margin-top: 3vh; color: var(--muted); font-size: 1.5vw; text-align: center; }
  .hint b { color: var(--ink); }

  /* Frage */
  .qwrap { flex: 1; display: flex; flex-direction: column; gap: 2vh; padding-top: 1vh; min-height: 0; }
  .qwrap > * { flex-shrink: 0; }
  .qwrap > .answers, .qwrap > .imgq, .qwrap > .estq, .qwrap > .mlist { flex: 1 1 0; min-height: 0; }
  .qcard { background: #fff; color: #1b1440; border-radius: 1.6vw; padding: 4vh 3vw; text-align: center; box-shadow: 0 1vh 0 rgba(0,0,0,.25); }
  .cat { display: inline-block; font-size: 1.3vw; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #6a5acd; margin-bottom: 1.2vh; }
  .qtext { font-size: 3.4vw; font-weight: 900; line-height: 1.15; letter-spacing: -0.01em; }
  .mid { display: flex; align-items: center; gap: 2vw; }
  .timer { position: relative; width: min(9vw, 15vh); height: min(9vw, 15vh); flex: none; }
  .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3.4vw; font-weight: 900; }
  .answered { flex: 1; display: flex; flex-wrap: wrap; gap: .8vw; justify-content: flex-end; }
  .chip { display: flex; align-items: center; gap: .5vw; background: rgba(255,255,255,.08); border-radius: 99px; padding: .4vw 1vw .4vw .5vw; font-weight: 700; font-size: 1.3vw; opacity: .45; transition: all .3s; }
  .chip .dot { width: 2.4vw; height: 2.4vw; border-radius: 50%; display: grid; place-items: center; background: var(--pc); font-size: 1.4vw; }
  .chip.done { opacity: 1; background: rgba(255,255,255,.18); transform: translateY(-.3vh); }
  .chip.ok { background: rgba(47,179,109,.35); opacity: 1; }
  .chip.bad { background: rgba(229,72,77,.3); opacity: 1; }
  .chip .gain { color: #8ff0b5; margin-left: .3vw; }
  .answers { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, var(--row)); align-content: center; gap: 1.4vh 1.6vw; }
  .ans { border-radius: 1.4vw; display: flex; align-items: center; gap: 1.6vw; padding: 0 1.6vw; font-size: var(--rowfont); font-weight: 800; line-height: 1.1; box-shadow: 0 .8vh 0 rgba(0,0,0,.25); transition: opacity .4s, transform .4s, filter .4s; position: relative; }
  .long .ans, .long .mrow { font-size: calc(var(--rowfont) * .8); } .xlong .ans, .xlong .mrow { font-size: calc(var(--rowfont) * .65); }
  .ans .shape { font-size: var(--rowfont); width: min(4.4vw, 7vh); flex: none; text-align: center; opacity: .9; }
  .ans .count { margin-left: auto; background: rgba(0,0,0,.25); border-radius: 99px; padding: .2vw 1.1vw; font-size: 2vw; }
  .voters { display: flex; flex-wrap: wrap; gap: .5vw; margin-left: auto; max-width: 50%; justify-content: flex-end; }
  .vav { width: 3.6vw; height: 3.6vw; border-radius: 50%; display: grid; place-items: center; font-size: 2.2vw; background: var(--pc); border: .25vw solid #fff; animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  .ans.votes { transform: none; }
  .timesup { font-size: 2vw; font-weight: 900; color: var(--c); }
  .ans.dim { opacity: .25; filter: grayscale(.7); transform: scale(.97); }
  .ans.win { transform: scale(1.03); box-shadow: 0 0 0 .4vw #fff, 0 .8vh 0 rgba(0,0,0,.25); }
  .ans.win::after { content: "✓"; position: absolute; right: -1vw; top: -1.6vw; width: 3.6vw; height: 3.6vw; border-radius: 50%; background: #fff; color: var(--d); display: grid; place-items: center; font-size: 2.4vw; font-weight: 900; }
  .c0 { background: var(--a); } .c1 { background: var(--b); } .c2 { background: var(--c); } .c3 { background: var(--d); }


  /* Fragearten */
  .tright { display: flex; gap: 1vw; align-items: center; }
  .tbadge { background: var(--c); color: #1b1440; border-radius: 99px; padding: .4em 1.1em; font-weight: 900; }
  .packs { margin-top: 2.5vh; text-align: center; font-size: 1.4vw; color: var(--muted); }
  .packs.warn, .warnc { color: #ffb4b4; font-weight: 700; }
  .intro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5vh; text-align: center; }
  .iicon { font-size: 9vw; line-height: 1; animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  .ilabel { font-size: 6vw; font-weight: 900; letter-spacing: -0.02em; color: var(--c); animation: fade .5s .15s both; }
  .icat { font-size: 2.2vw; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
  .inum { margin-top: 3vh; width: 13vw; height: 13vw; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: 7vw; font-weight: 900; }
  .qcard.compact { padding: 2.2vh 3vw; }
  .qcard.compact .qtext { font-size: 2.8vw; }
  .qtext.soft { color: #6a5acd; }
  .imgq { flex: 1; display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 1.6vw; min-height: 0; }
  .imgbox { background: rgba(255,255,255,.06); border-radius: 1.4vw; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 0; animation: pop .5s both; }
  .imgbox img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: block; }
  .answers.col { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: minmax(0, var(--row)); gap: 1.4vh; min-height: 0; }
  .answers.col .vav { width: 3vw; height: 3vw; font-size: 1.8vw; }
  .estq { flex: 1; display: grid; grid-template-columns: 1.5fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 1.6vw; min-height: 0; }
  .estq.noimg { grid-template-columns: 1fr; justify-items: center; }
  .estpanel { width: 100%; background: rgba(255,255,255,.06); border-radius: 1.4vw; padding: 2vh 1.4vw; display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
  .estq.noimg .estpanel { width: 60vw; }
  .esthint { text-align: center; font-size: 2.6vw; font-weight: 900; }
  .esthint small { display: block; font-size: 1.6vw; color: var(--muted); font-weight: 700; margin-top: 1vh; }
  .elist { display: flex; flex-direction: column; gap: 1vh; }
  .erow { display: flex; align-items: center; gap: 1vw; background: rgba(255,255,255,.08); border-radius: 99px; padding: .5vh 1.4vw .5vh .5vw; font-size: 1.8vw; font-weight: 800; animation: slide .4s both; }
  .erow .vav { width: 3vw; height: 3vw; font-size: 1.8vw; border-width: .2vw; animation: none; }
  .erow .ev { margin-left: auto; font-variant-numeric: tabular-nums; }
  .erow .eg { color: #8ff0b5; min-width: 5vw; text-align: right; font-size: 1.5vw; }
  .erow.best { background: rgba(47,179,109,.45); }
  .erow.out { opacity: .45; }
  .erow.truth { background: #fff; color: #1b1440; padding: 1vh 1.6vw; font-size: 2.2vw; animation: pop .5s both; }
  .erow.truth .ev { margin-left: 0; }
  .erow.truth span:last-child { margin-left: auto; color: var(--d); text-transform: uppercase; font-size: 1.4vw; letter-spacing: .1em; }
  .mlist { flex: 1; min-height: 0; display: grid; grid-auto-rows: minmax(0, var(--row)); align-content: center; gap: 1.4vh; max-height: 100%; }
  .mrow { display: grid; grid-template-columns: 5vw 1fr 1.3fr; align-items: center; gap: 1.4vw; background: rgba(255,255,255,.08); border-radius: 1.2vw; padding: 0 1.4vw; min-height: 0; height: 100%; font-size: var(--rowfont); font-weight: 800; line-height: 1.1; animation: slide .45s both; transition: background .4s; overflow: hidden; }
  .mnum { width: min(4.4vw, 7vh); height: min(4.4vw, 7vh); border-radius: 50%; background: var(--c); color: #1b1440; display: grid; place-items: center; font-weight: 900; }
  .mright { display: flex; align-items: center; gap: 1vw; min-width: 0; }
  .mright .qm { color: rgba(255,255,255,.25); }
  .mright .voters { margin-left: auto; max-width: none; }
  .mright .none { color: rgba(255,255,255,.5); font-size: 1.4vw; font-weight: 700; }
  .mrow .vav { width: min(3.2vw, 5.4vh); height: min(3.2vw, 5.4vh); font-size: min(1.9vw, 3.2vh); border-width: .2vw; }
  .mrow.done { background: rgba(47,179,109,.32); }
  .mans.l { font-size: .8em; } .mans.xl { font-size: .62em; }
  .mans { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  .pbar { height: 1.2vh; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .pbar i { display: block; height: 100%; width: 100%; background: var(--c); }


  /* Blöcke, Schwierigkeit, Spezialfrage */
  .stars { color: var(--c); letter-spacing: .1em; margin-left: .6vw; }
  .qcard .stars { color: #f5b014; }
  .bnames { display: flex; flex-wrap: wrap; gap: 1vw; justify-content: center; max-width: 80vw; margin-top: 2vh; }
  .bnames span { background: rgba(255,255,255,.12); border-radius: 99px; padding: .6vh 1.6vw; font-size: 2.2vw; font-weight: 800; animation: pop .5s both; }
  .spbadge { background: linear-gradient(90deg, #ff4d6d, #f5b014); color: #fff; border-radius: 99px; padding: .4em 1.1em; font-weight: 900; }
  .special { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(20,16,43,.82); }
  .burst { position: absolute; width: 140vmax; height: 140vmax; background: repeating-conic-gradient(rgba(245,176,20,.22) 0 10deg, transparent 10deg 20deg); animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sp-inner { position: relative; text-align: center; animation: zoom .7s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes zoom { from { transform: scale(.2) rotate(-12deg); opacity: 0; } }
  .sp-star { font-size: 12vw; line-height: 1; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.15); } }
  .sp-title { font-size: 7vw; font-weight: 900; color: #fff; letter-spacing: -0.02em; text-shadow: 0 .6vh 0 #ff4d6d; }
  .sp-mult { display: inline-block; margin-top: 2vh; font-size: 4vw; font-weight: 900; color: #1b1440; background: var(--c); border-radius: 99px; padding: .5vh 3vw; }
  html.lite .special { background: #14102b; }
  html.lite .burst { display: none; }

  /* Videofrage */
  .vwrap { position: fixed; inset: 0; background: #000; display: grid; place-items: center; z-index: 40; }
  .vwrap video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .vhint { position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; padding: 1vh 2vw; border-radius: 99px; font-size: 1.6vw; font-weight: 700; z-index: 41; }

  /* Soundcheck */
  .iicon.sc { animation: pulse 1.2s ease-in-out infinite; }
  .eq { display: flex; gap: .8vw; align-items: flex-end; height: 10vh; margin-top: 2vh; }
  .eq i { width: 1.6vw; height: 100%; background: var(--c); border-radius: .4vw; transform-origin: bottom; animation: eq .9s ease-in-out infinite alternate; }
  @keyframes eq { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
  .pbar.wide { width: 50vw; margin-top: 2vh; }
  .pbar.wide i { transition: width .2s linear; }
  html.lite .eq i { transform: scaleY(.6); }

  /* Lobby: WLAN + Quiz */
  .qrbox.two { gap: 2.5vw; }
  .qstep { display: flex; flex-direction: column; align-items: center; gap: 1vh; text-align: center; }
  .qr.sm { width: 12.5vw; height: 12.5vw; }
  .qstep .url { font-size: 1.4vw; }
  .qstep .url b { font-size: 1.6vw; color: var(--c); }
  .url small { display: block; font-size: 1.3vw; color: var(--muted); margin-top: .4vh; font-weight: 700; }

  /* Blockpause */
  .bpause { position: relative; overflow: hidden; }
  .floaty { position: absolute; inset: 0; pointer-events: none; }
  .floaty span { position: absolute; bottom: -10vh; font-size: 5vw; opacity: .5; animation: floatup 9s linear infinite; }
  @keyframes floatup { to { transform: translateY(-120vh) rotate(25deg); } }
  .pcount { font-size: 10vw; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; margin: 1vh 0; }
  .nextb { font-size: 2vw; margin-top: 1vh; } .nextb b { color: var(--c); }
  .ptop { display: flex; gap: 1.2vw; margin-top: 2.5vh; flex-wrap: wrap; justify-content: center; }
  .ptop span { background: rgba(255,255,255,.1); border-radius: 99px; padding: .6vh 1.4vw; font-size: 1.6vw; font-weight: 800; }
  .ptop i { font-style: normal; margin-right: .4vw; } .ptop b { color: var(--c); margin-left: .5vw; }
  html.lite .floaty { display: none; }

  /* Overlays: angehalten / System */
  .overlay { position: fixed; inset: 0; z-index: 70; background: rgba(20,16,43,.88); display: grid; place-items: center; }
  .overlay.sys { z-index: 80; background: #14102b; }
  .ovbox { text-align: center; }
  .ovicon { font-size: 9vw; line-height: 1.1; }
  .ovtitle { font-size: 4vw; font-weight: 900; margin: 1vh 0; }

  /* Rangliste */
  .board { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 2vh; }
  .board h2 { font-size: 3.6vw; font-weight: 900; margin-bottom: 3vh; }
  .rows { width: 70vw; display: flex; flex-direction: column; gap: 1.3vh; }
  .row { display: flex; align-items: center; gap: 1.4vw; background: rgba(255,255,255,.08); border-radius: 1.2vw; padding: 1.2vh 1.6vw; font-size: 2vw; font-weight: 800; animation: slide .5s both; }
  .row .pos { width: 3vw; color: var(--muted); }
  .row .av { width: 3.6vw; height: 3.6vw; border-radius: 50%; display: grid; place-items: center; background: var(--pc); font-size: 2.2vw; }
  .row .bar { flex: 1; height: 1.2vh; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }
  .row .bar i { display: block; height: 100%; background: var(--pc); border-radius: 99px; transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .row .pts { min-width: 8vw; text-align: right; font-variant-numeric: tabular-nums; }
  .row .plus { color: #8ff0b5; font-size: 1.4vw; min-width: 6vw; text-align: right; }
  @keyframes slide { from { opacity: 0; transform: translateX(-3vw); } }

  /* Ende */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 2vw; margin: 2vh 0 3vh; }
  .step { width: 16vw; display: flex; flex-direction: column; align-items: center; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .step .who { font-size: 2vw; font-weight: 900; margin-bottom: 1vh; text-align: center; }
  .step .big { font-size: 5vw; }
  .step .block { width: 100%; border-radius: 1.2vw 1.2vw 0 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 2vh; font-weight: 900; font-size: 4vw; background: var(--pc); box-shadow: inset 0 -1vh 0 rgba(0,0,0,.2); }
  .step .block small { font-size: 1.6vw; opacity: .9; }
  @keyframes rise { from { opacity: 0; transform: translateY(10vh); } }
  .others { display: flex; gap: 1.2vw; flex-wrap: wrap; justify-content: center; font-size: 1.6vw; color: var(--muted); }

  .pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .fade { animation: fade .4s both; } @keyframes fade { from { opacity: 0; transform: translateY(1.5vh); } }
  .status { position: fixed; left: 50%; bottom: 1.5vh; transform: translateX(-50%); font-size: 1.1vw; color: var(--muted); opacity: .7; }
  .confetti { position: fixed; z-index: 60; top: -3vh; width: .8vw; height: 1.6vw; border-radius: .2vw; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* Schonender Modus für schwache Geräte (z. B. Raspberry Pi 3): /tv?lite=1 */
  html.lite body { background: var(--bg); }
  body.nocursor, body.nocursor * { cursor: none !important; }
  html.lite *, html.lite *::before, html.lite *::after { animation: none !important; transition: none !important; box-shadow: none !important; text-shadow: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div class="status" id="status">Leertaste = weiter · F = Vollbild</div>
<script src="/qr.js"></script>
<script>
const SHAPES = ['▲', '◆', '●', '■'];
const LITE = /[?&]lite=1/.test(location.search);
const KIOSK = /[?&]kiosk=1/.test(location.search);
if (LITE) document.documentElement.classList.add('lite');
// Mauszeiger nach 2 s ohne Bewegung ausblenden
let cursorTimer;
function wakeCursor() {
  if (KIOSK) return document.body.classList.add('nocursor'); // am Fernseher-Kiosk nie anzeigen
  document.body.classList.remove('nocursor'); clearTimeout(cursorTimer); cursorTimer = setTimeout(() => document.body.classList.add('nocursor'), 2000); }
addEventListener('mousemove', wakeCursor);
if (KIOSK) document.body.classList.add('nocursor'); addEventListener('DOMContentLoaded', wakeCursor);
const app = document.getElementById('app');
let S = null, lastKey = '', lastPhase = '', lastQ = 0, deadline = 0, seen = new Set(), prevScores = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const es = new EventSource('/events?role=tv');
let serverVersion = null;
es.onmessage = e => {
  S = JSON.parse(e.data);
  // Nach einem Update/Neustart des Servers die Seite neu laden, damit die neue Version läuft
  if (serverVersion && S.version && S.version !== serverVersion) return location.reload();
  serverVersion = S.version || serverVersion;
  render();
};
es.onerror = () => { document.getElementById('status').style.display = ''; document.getElementById('status').textContent = 'Verbindung zum Server unterbrochen – versuche neu …'; };
es.onopen = () => { document.getElementById('status').textContent = 'Leertaste = weiter · F = Vollbild'; };

function advance() { fetch('/api/advance', { method: 'POST', body: JSON.stringify({ role: 'tv' }) }); }
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advance(); }
  if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
});

// ---------- Sounds (werden live erzeugt, keine Dateien nötig) ----------
function soundOn() { return !S || !S.packs || !S.packs.sound || S.packs.sound.on; }
function ctx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}
// Browser erlauben Ton oft erst nach einem Klick/Tastendruck (am Pi ist das freigeschaltet)
addEventListener('click', () => { try { ctx(); } catch (_) {} }, { once: true });
addEventListener('keydown', () => { try { ctx(); } catch (_) {} }, { once: true });
function soundHint() {
  if (KIOSK || !soundOn()) return '';
  try { if (ctx().state === 'running') return ''; } catch (_) { return ''; }
  return '<div class="packs">🔊 Für Sounds einmal auf diesen Bildschirm klicken</div>';
}
const sfx = {
  tone(freq, start, dur, { type = 'sine', gain = 0.3, attack = 0.005, filter = null } = {}) {
    const c = ctx(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(gain, start + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    let node = o;
    if (filter) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter; node.connect(f); node = f; }
    node.connect(g).connect(c.destination);
    o.start(start); o.stop(start + dur + 0.05);
    return o;
  },
  // Holzblock-Ticken, die letzte Sekunde höher und lauter
  tick(last) {
    if (!soundOn()) return;
    try {
      const c = ctx(), t = c.currentTime + 0.01;
      this.tone(last ? 1760 : 1320, t, 0.09, { type: 'triangle', gain: last ? 0.5 : 0.32 });
      this.tone(last ? 880 : 660, t, 0.05, { type: 'square', gain: 0.06, filter: 2500 });
    } catch (_) {}
  },
  // Tiefer, warmer Gong mit Obertönen
  gong() {
    if (!soundOn()) return;
    try {
      const c = ctx(), t = c.currentTime + 0.02, base = 196;
      [[1, 0.35, 2.8], [2.0, 0.16, 2.2], [2.76, 0.12, 1.8], [3.4, 0.08, 1.4], [5.4, 0.05, 0.9]]
        .forEach(([r, g, d]) => this.tone(base * r, t, d, { gain: g, attack: 0.01 }));
      this.tone(base * 4, t, 0.25, { type: 'triangle', gain: 0.08 }); // heller Anschlag
    } catch (_) {}
  },
  // Kurze Siegerfanfare (Blechbläser-Klang)
  fanfare() {
    if (!soundOn()) return;
    try {
      const c = ctx(), t = c.currentTime + 0.05;
      const brass = (f, s, d, g = 0.16) => this.tone(f, t + s, d, { type: 'sawtooth', gain: g, attack: 0.03, filter: 2200 });
      brass(392, 0, 0.18); brass(392, 0.18, 0.18); brass(392, 0.36, 0.18);   // G G G
      brass(523.25, 0.56, 0.5);                                              // C
      brass(659.25, 1.06, 0.18); brass(587.33, 1.24, 0.18);                  // E D
      [523.25, 659.25, 783.99, 1046.5].forEach(f => brass(f, 1.44, 1.6, 0.11)); // C-Dur-Akkord
      this.tone(1046.5, t + 1.44, 1.6, { type: 'sine', gain: 0.08 });
    } catch (_) {}
  },
};

function videoMsg(event, extra) { fetch('/api/media', { method: 'POST', body: JSON.stringify({ role: 'tv', event, ...extra }) }); }
function renderVideo() {
  const q = S.question;
  app.innerHTML = `<div class="vwrap"><video id="vid" src="${q.video}" playsinline preload="auto"></video>
    <div class="vhint" id="vhint" style="display:none">🔇 Ton blockiert – einmal klicken oder M drücken</div></div>`;
  const v = document.getElementById('vid');
  // Ton des Videos über denselben Audio-Kanal wie Soundcheck-Fragen leiten.
  // Manche Ausgänge (z. B. HDMI direkt am Pi) erlauben nur einen Kanal gleichzeitig.
  let routed = false;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.createMediaElementSource(v).connect(audioCtx.destination);
    routed = true;
  } catch (e) { mediaInfo({ routeError: String(e) }); }
  v.addEventListener('loadedmetadata', () => videoMsg('duration', { seconds: v.duration, position: v.currentTime }));
  v.addEventListener('ended', () => videoMsg('ended'));
  v.addEventListener('error', () => {
    mediaInfo({ videoError: v.error && v.error.code });
    app.innerHTML += '<div class="vhint">⚠️ Video konnte nicht abgespielt werden</div>'; setTimeout(() => videoMsg('error'), 2500);
  });
  const blocked = () => {
    document.getElementById('vhint').style.display = '';
    const unmute = () => { v.muted = false; if (audioCtx) audioCtx.resume(); v.play().catch(() => {}); const h = document.getElementById('vhint'); if (h) h.remove(); };
    addEventListener('click', unmute, { once: true });
    addEventListener('keydown', function k(e) { if (e.key === 'm' || e.key === 'M') { unmute(); removeEventListener('keydown', k); } });
  };
  if (routed && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  v.play().then(() => {
    if (routed && audioCtx.state !== 'running') blocked();
    mediaInfo({ playing: true, muted: v.muted, routed, ctx: audioCtx && audioCtx.state });
  }).catch(err => {
    mediaInfo({ playError: err && err.name, routed });
    // Nur wenn der Browser Autoplay mit Ton verbietet: stumm starten und Hinweis zeigen
    if (err && err.name === 'NotAllowedError') { v.muted = true; v.play().catch(() => {}); blocked(); }
  });
}
// Kurze Rückmeldung an den Server (steht im Server-Log, hilft bei der Fehlersuche)
function mediaInfo(info) { videoMsg('info', { info }); }

// ---------- Soundcheck: Audio (Ausschnitt, auf Wunsch rückwärts) per WebAudio ----------
let audioCtx = null;
function renderAudio() {
  const q = S.question, o = q.audioOpts || {};
  app.innerHTML = `<div class="intro">
    <div class="iicon sc">🎧</div><div class="ilabel">Hör genau hin!</div>
    <div class="icat">${o.reverse ? '⏪ rückwärts gespielt' : esc(q.category)}</div>
    <div class="eq">${Array.from({ length: 9 }, (_, i) => `<i style="animation-delay:${i * 0.11}s"></i>`).join('')}</div>
    <div class="pbar wide"><i id="apbar" style="width:0%"></i></div>
    <div class="vhint" id="vhint" style="display:none">🔇 Ton blockiert – einmal klicken oder M drücken</div></div>`;
  playAudio(q.audio, o).catch(() => {
    app.innerHTML += '<div class="vhint">⚠️ Audio konnte nicht abgespielt werden</div>';
    setTimeout(() => videoMsg('error'), 2500);
  });
}
async function playAudio(url, o) {
  const key = S.qNum;
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const data = await (await fetch(url)).arrayBuffer();
  const full = await audioCtx.decodeAudioData(data);
  if (S.qNum !== key || S.phase !== 'media') return;      // inzwischen übersprungen
  // Ausschnitt schneiden und ggf. umdrehen
  const sr = full.sampleRate;
  const from = Math.min(full.length, Math.floor((o.start || 0) * sr));
  const to = o.dauer ? Math.min(full.length, from + Math.floor(o.dauer * sr)) : full.length;
  const buf = audioCtx.createBuffer(full.numberOfChannels, Math.max(1, to - from), sr);
  for (let c = 0; c < full.numberOfChannels; c++) {
    const part = full.getChannelData(c).slice(from, to);
    if (o.reverse) part.reverse();
    buf.copyToChannel(part, c);
  }
  // kurzes Ein-/Ausblenden gegen Knackser
  const src = audioCtx.createBufferSource(), gain = audioCtx.createGain();
  src.buffer = buf; src.connect(gain).connect(audioCtx.destination);
  const t0 = audioCtx.currentTime + 0.05, len = buf.duration;
  gain.gain.setValueAtTime(0, t0); gain.gain.linearRampToValueAtTime(1, t0 + 0.08);
  gain.gain.setValueAtTime(1, t0 + Math.max(0.1, len - 0.15)); gain.gain.linearRampToValueAtTime(0, t0 + len);
  src.onended = () => { if (S.qNum === key && S.phase === 'media') videoMsg('ended'); };
  videoMsg('duration', { seconds: len, position: 0 });
  src.start(t0);
  window.__stopAudio = () => { try { src.stop(); } catch (_) {} };
  if (audioCtx.state === 'suspended') {   // Autoplay gesperrt -> Hinweis, Klick/M startet den Ton
    const h = document.getElementById('vhint'); if (h) h.style.display = '';
    const go = () => { audioCtx.resume(); const x = document.getElementById('vhint'); if (x) x.remove(); };
    addEventListener('click', go, { once: true });
    addEventListener('keydown', function k(e) { if (e.key === 'm' || e.key === 'M') { go(); removeEventListener('keydown', k); } });
  }
  const tick = setInterval(() => {
    const b = document.getElementById('apbar');
    if (!b || S.phase !== 'media' || S.qNum !== key) { clearInterval(tick); return; }
    b.style.width = Math.min(100, (audioCtx.currentTime - t0) / len * 100) + '%';
  }, 200);
}

    const n = document.getElementById('num');
    if (n) n.innerHTML = S.phase === 'reveal' ? '✓' : '<span class="timesup">Stopp!</span>';
    const arc = document.getElementById('arc'); if (arc) arc.style.strokeDashoffset = 276.5;
  }
  if (q.kind === 'choice' && (S.phase === 'votes' || S.phase === 'reveal')) {
    document.querySelectorAll('.ans').forEach((el, i) => {
      const box = el.querySelector('.voters');
      if (!box.dataset.filled) {   // Emojis nacheinander auftauchen lassen
        let k = 0;
        box.innerHTML = (q.voters[i] || []).map(id => byId[id]).filter(Boolean).map(p => avatarHtml(p, 0.15 + (k++) * 0.12 + i * 0.05)).join('');
        box.dataset.filled = '1';
      }
      if (S.phase === 'reveal') { el.classList.toggle('win', i === q.correct); el.classList.toggle('dim', i !== q.correct); }
    });
  }
  if (q.kind === 'estimate' && (S.phase === 'votes' || S.phase === 'reveal')) renderEstimate(byId);
  if (q.kind === 'match' && S.phase === 'reveal') {
    for (let i = 0; i < q.step; i++) {
      const row = document.getElementById('mrow' + i);
      if (!row || row.classList.contains('done')) continue;
      const right = S.players.filter(p => p.result && p.result.pairs && p.result.pairs[i]);
      row.classList.add('done');
      const ans = q.right[q.solution[i]];
      document.getElementById('mr' + i).innerHTML = `<span class="mans ${ans.length > 36 ? 'xl' : ans.length > 22 ? 'l' : ''}">${esc(ans)}</span>
        <span class="voters">${right.length ? right.map((p, k) => avatarHtml(p, 0.3 + k * 0.1)).join('') : '<span class="none">keiner</span>'}</span>`;
    }
  }
}

// ---------- Spezialfrage: Animation nach dem Antworten ----------
function specialOverlay() {
  const ov = document.getElementById('special');
  if (S.phase === 'special' && !ov) {
    const d = document.createElement('div');
    d.id = 'special'; d.className = 'special';
    d.innerHTML = `<div class="burst"></div><div class="sp-inner"><div class="sp-star">⭐</div>
      <div class="sp-title">Spezialfrage!</div><div class="sp-mult">×${S.special.mult} Punkte</div></div>`;
    document.body.appendChild(d);
    if (!LITE) confetti();
  }
  if (S.phase !== 'special' && ov) ov.remove();
  const b = document.getElementById('spb');
  if (b) b.innerHTML = S.special ? `<span class="spbadge">⭐ Spezialfrage ×${S.special.mult}</span>` : '';
}

function tolText(q) {
  if (q.tolerance === null || q.tolerance === undefined) return '';
  return q.year ? `Punkte gibt es nur bei höchstens ±${fmt(q.tolerance)} ${q.tolerance === 1 ? 'Jahr' : 'Jahren'} Abweichung`
    : `Punkte gibt es nur bei höchstens ±${fmt(q.tolerance)}${q.unit ? ' ' + esc(q.unit) : ''} Abweichung`;
}

function renderEstimate(byId) {
  const q = S.question, box = document.getElementById('est');
  if (!box || box.dataset.phase === S.phase) return;
  box.dataset.phase = S.phase;
  const unit = q.unit ? ' ' + esc(q.unit) : '';
  const rows = q.guesses.map(g => ({ ...g }));
  if (S.phase === 'reveal') {
    let at = rows.findIndex(r => r.value > q.value); if (at < 0) at = rows.length;
    rows.splice(at, 0, { truth: true, value: q.value });
  }
  if (!q.guesses.length && S.phase === 'votes') { box.innerHTML = '<div class="esthint">Niemand hat geschätzt 🤷</div>'; return; }
  box.innerHTML = `<div class="elist">${rows.map((r, i) => {
    if (r.truth) return `<div class="erow truth"><span class="ev">✓ ${fmt(r.value)}${unit}</span><span>richtig</span></div>`;
    const p = byId[r.id]; if (!p) return '';
    const res = S.phase === 'reveal' ? p.result : null;
    return `<div class="erow ${res && res.correct ? 'best' : ''} ${res && res.outOfRange ? 'out' : ''}" style="--pc:${p.color};animation-delay:${S.phase === 'votes' ? i * 0.15 : 0}s">
      <span class="vav">${p.avatar}</span><span class="en">${esc(p.name)}</span><span class="ev">${fmt(r.value)}${unit}</span>
      ${res ? `<span class="eg">${res.gain ? '+' + res.gain : ''}</span>` : ''}</div>`;
  }).join('')}</div>`;
}

let lastTickSec = null;
function tick() {
  if (S && S.phase === 'pause') {
    const el = document.getElementById('pcount');
    if (el && S.phaseMs) {
      const left = S.frozen ? S.remainingMs : Math.max(0, deadline - Date.now());
      const sec = Math.ceil(left / 1000);
      el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    }
  } else if (S && S.question) {
    const left = S.frozen ? S.remainingMs : Math.max(0, deadline - Date.now());
    if (S.phase === 'question') {
      // Ticken in den letzten 5 Sekunden
      const sec = Math.ceil(left / 1000);
      if (!S.frozen && sec >= 1 && sec <= 5 && sec !== lastTickSec) { lastTickSec = sec; sfx.tick(sec === 1); }
      const arc = document.getElementById('arc'), num = document.getElementById('num');
      if (arc) {
        arc.style.strokeDashoffset = 276.5 * (1 - left / S.phaseMs);
        arc.style.stroke = left < 5000 ? '#e5484d' : '#f5b014';
        num.textContent = Math.ceil(left / 1000);
      }
    } else if (S.phase === 'intro') {
      const n = document.getElementById('inum'); if (n) n.textContent = Math.max(1, Math.ceil(left / 1000));
    } else if (S.phase === 'preview') {
      const b = document.getElementById('pbar'); if (b) b.style.width = (left / S.phaseMs * 100) + '%';
    }
  }
  if (!LITE) requestAnimationFrame(tick);
}
if (LITE) setInterval(tick, 250); else tick();

function renderScores() {
  const max = Math.max(1, ...S.players.map(p => p.score));
  const last = S.qNum >= S.qTotal;
  app.innerHTML = topbar(`<span class="pill">Nach Frage ${S.qNum} / ${S.qTotal}</span>`) + `
    <div class="board"><h2>${last ? 'Gleich kommt die Siegerehrung …' : 'Zwischenstand'}</h2>
      <div class="rows">${S.players.map((p, i) => {
        const gain = p.score - (prevScores[p.id] || 0); // Punkte seit der letzten Rangliste
        return `<div class="row" style="--pc:${p.color};animation-delay:${i * 0.07}s"><span class="pos">${i + 1}.</span><span class="av">${p.avatar}</span>
          <span style="min-width:14vw">${esc(p.name)}</span><span class="bar"><i style="width:${(prevScores[p.id] || 0) / max * 100}%" data-w="${p.score / max * 100}"></i></span>
          <span class="plus">${gain ? '+' + gain : ''}</span><span class="pts" data-from="${p.score - gain}" data-to="${p.score}">${p.score - gain}</span></div>`;
      }).join('')}</div></div>`;
  prevScores = Object.fromEntries(S.players.map(p => [p.id, p.score]));
  setTimeout(() => {
    document.querySelectorAll('.bar i').forEach(i => { i.style.width = i.dataset.w + '%'; });
    countUp(document.querySelectorAll('.pts'));
  }, 400);
}

function countUp(els) {
  if (LITE) { els.forEach(el => { el.textContent = el.dataset.to; }); return; }
  const t0 = performance.now();
  (function step(t) {
    const k = Math.min(1, (t - t0) / 1200), e = 1 - Math.pow(1 - k, 3);
    els.forEach(el => { const a = +el.dataset.from, b = +el.dataset.to; el.textContent = Math.round(a + (b - a) * e); });
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

function renderEnd() {
  sfx.fanfare();
  const P = S.players, order = [1, 0, 2], heights = ['34vh', '24vh', '17vh'];
  app.innerHTML = topbar(`<span class="pill">Spiel vorbei</span>`) + `
    <div class="board"><h2>🏆 ${P[0] ? esc(P[0].name) + ' gewinnt!' : 'Spiel vorbei'}</h2>
      <div class="podium">${order.filter(i => P[i]).map(i => `
        <div class="step" style="--pc:${P[i].color};animation-delay:${(2 - i) * 0.35}s">
          <div class="who"><div class="big">${P[i].avatar}</div>${esc(P[i].name)}</div>
          <div class="block" style="height:${heights[i]}">${i + 1}<small>${P[i].score} Punkte</small></div></div>`).join('')}
      </div>
      <div class="others">${P.slice(3).map((p, i) => `<span>${i + 4}. ${p.avatar} ${esc(p.name)} – ${p.score}</span>`).join(' · ')}</div>
      <div class="hint">👑 Neue Runde am Handy starten – oder <b>Leertaste</b></div>
    </div>`;
  confetti();
}

function confetti() {
  if (LITE) return;
  const colors = ['#e5484d', '#3e8ef7', '#f5b014', '#2fb36d', '#cc5de8', '#fff'];
  for (let i = 0; i < 120; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2.5 + Math.random() * 3 + 's';
    c.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 8000);
  }
}
</script>
