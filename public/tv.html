<!DOCTYPE html>
<html lang="de" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz-Abend – TV</title>
<style>
  :root {
    --bg: #14102b; --bg2: #221a4d; --ink: #fff; --muted: #b9b2e6;
    --a: #e5484d; --b: #3e8ef7; --c: #f5b014; --d: #2fb36d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif, "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji";
    color: var(--ink); overflow: hidden; cursor: default;
    background: radial-gradient(ellipse at 20% 0%, #3a2a8a 0%, transparent 55%),
                radial-gradient(ellipse at 100% 100%, #5b1f6e 0%, transparent 50%), var(--bg);
    font-size: 1.6vw;
    --row: 13vh;   /* einheitliche Höhe für Antwort-Kacheln und Zuordnungszeilen */
    --rowfont: min(2.3vw, 4vh);  /* einheitliche Schrift dafür */
  }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 3vh 4vw 4.5vh; }
  .brand { font-weight: 900; letter-spacing: -0.02em; }
  .brand span { color: var(--c); }
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 1.4vw; color: var(--muted); min-height: 4vh; }
  .pill { background: rgba(255,255,255,.1); border-radius: 99px; padding: .4em 1.1em; font-weight: 700; color: var(--ink); }
  .pill.ptspill { background: none; border: .15vw solid var(--c); padding: calc(.4em - .15vw) calc(1.1em - .15vw); color: var(--c); font-weight: 900; }

  /* Lobby */
  .lobby.drift, html.lite .lobby.drift { transition: transform 6s ease-in-out !important; }
  .gmline { display: flex; align-items: center; gap: .8vw; font-size: 1.8vw; font-weight: 800; color: var(--muted); margin-bottom: 1.6vh; }
  .gmline b { color: #fff; } .gmline .av { width: 3vw; height: 3vw; border-radius: 50%; background: var(--pc); display: grid; place-items: center; font-size: 1.8vw; }
  .lobby { flex: 1; display: grid; grid-template-columns: 1fr 1.25fr; gap: 4vw; align-items: center; }
  .join h1 { font-size: 5.4vw; line-height: 1; font-weight: 900; letter-spacing: -0.03em; }
  .join h1 span { color: var(--c); }
  .join p { color: var(--muted); font-size: 1.7vw; margin: 2vh 0 3vh; }
  .qrbox { display: flex; gap: 2vw; align-items: center; }
  .qr { width: 17vw; height: 17vw; background: #fff; border-radius: 1.2vw; padding: .6vw; box-shadow: 0 1vw 3vw rgba(0,0,0,.4); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .url { font-size: 1.5vw; color: var(--muted); }
  .url b { display: block; color: var(--ink); font-size: 1.8vw; margin-top: .4vh; white-space: nowrap; }
  .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.6vh 1.4vw; }
  .slot { height: 9.5vh; border-radius: 1.2vw; border: 2px solid rgba(255,255,255,.14); background: rgba(255,255,255,.04); display: flex; align-items: center; gap: 1vw; padding: 0 1.4vw; color: rgba(255,255,255,.3); font-size: 1.5vw; }
  .slot.on { border: none; background: var(--pc); color: #fff; font-weight: 800; font-size: 2vw; box-shadow: 0 .6vh 0 rgba(0,0,0,.25); }
  .slot .av { font-size: 2.8vw; }
  .slot .crown { margin-left: auto; font-size: 1.7vw; }
  .slot .ew { font-size: 1.15vw; font-weight: 800; background: rgba(0,0,0,.25); border-radius: 99px; padding: .3vh .6vw; white-space: nowrap; }
  .slot.off { opacity: .45; }
  /* Bereit: grüner Haken am Avatar; noch nicht bereit: blasser, mit Hinweis */
  .slot.on { position: relative; }
  .slot .rdy { position: absolute; left: 3.4vw; top: 1vh; width: 2.1vw; height: 2.1vw; border-radius: 50%; background: #2fb36d; border: .2vw solid #fff; display: grid; place-items: center; font-size: 1.1vw; color: #fff; font-weight: 900; }
  .slot.wait { opacity: .6; } .slot.wait.off { opacity: .4; }
  .slot .zz { margin-left: auto; font-size: 1.3vw; font-weight: 700; opacity: .9; line-height: 1.1; }
  .slot .crown + .zz { margin-left: 1vw; }
  .hint { margin-top: 3vh; color: var(--muted); font-size: 1.5vw; text-align: center; }
  .hint b { color: var(--ink); }

  /* Frage */
  .cat { display: inline-block; font-size: 1.3vw; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #6a5acd; margin-bottom: 1.2vh; }
  .qwrap { flex: 1; display: flex; flex-direction: column; gap: 2vh; padding-top: 2vh; min-height: 0; }
  .qwrap > * { flex-shrink: 0; }
  .qwrap > .answers, .qwrap > .imgq, .qwrap > .estq, .qwrap > .mlist, .qwrap > .tflist { flex: 1 1 0; min-height: 0; }
  .qwrap > .mpool { flex: none; }
  .qcard { background: #fff; color: #1b1440; border-radius: 1.6vw; padding: 4vh 3vw; text-align: center; box-shadow: 0 1vh 0 rgba(0,0,0,.25); }
  .qtext { font-size: 3.4vw; font-weight: 900; line-height: 1.15; letter-spacing: -0.01em; }
  /* Kopf bei den Fragen: Uhr · Kategorie + Punkte / Block + Fortschritt + Fragetyp · Spieler */
  .qhead { display: flex; align-items: center; gap: 1.8vw; flex: none; min-height: min(7vw, 12vh); }
  .qhead .timer { width: min(7vw, 12vh); height: min(7vw, 12vh); }
  .qhead .timer .num { font-size: 2.6vw; }
  .qhead .timesup { font-size: 1.35vw; }
  .qinfo { display: flex; flex-direction: column; gap: .7vh; min-width: 0; }
  .ql1 { display: flex; align-items: center; gap: .9vw; }
  #qpts { display: flex; gap: .7vw; }
  /* Frageart und Pills: gleiche Schrift, gleiche Höhe (Frageart = Pill ohne Rand), Icon nicht höher als die Schrift */
  .qcat, .qpts { font-size: 1.7vw; font-weight: 900; line-height: 1.15; border: .13vw solid transparent; border-radius: 99px; padding: .2em 0; white-space: nowrap; display: inline-flex; align-items: center; }
  .qcat { gap: .4em; }
  .qico { font-size: .9em; line-height: 1; }
  .qpts { color: var(--c); border-color: var(--c); padding: .2em .8em; }
  .qpts.sp { background: var(--c); color: #1b1440; }
  .qpts.rk { background: #c4001d; border-color: #ff3347; color: #fff; }
  .qpts.rk .fa { --fc: #fff !important; margin-right: .3em; }
  .ql2 { display: flex; align-items: center; gap: .9vw; color: var(--muted); font-weight: 700; font-size: 1.35vw; white-space: nowrap; }
  .qdots { display: flex; gap: .45vw; }
  .qdots i { width: 1.6vw; height: .55vh; border-radius: 99px; background: rgba(255,255,255,.16); }
  .qdots i.done { background: rgba(255,255,255,.45); }
  .qdots i.cur { background: var(--c); width: 3vw; }
  .qhead .answered { margin-left: auto; }
  .timer { position: relative; width: min(9vw, 15vh); height: min(9vw, 15vh); flex: none; }
  .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 3.4vw; font-weight: 900; }
  .answered { flex: 1; display: flex; flex-wrap: wrap; gap: .8vw; justify-content: flex-end; }
  .chip { display: flex; align-items: center; gap: .5vw; background: rgba(255,255,255,.08); border-radius: 99px; padding: .4vw 1vw .4vw .5vw; font-weight: 700; font-size: 1.3vw; opacity: .45; transition: all .3s; }
  .chip .dot { width: 2.4vw; height: 2.4vw; border-radius: 50%; display: grid; place-items: center; background: var(--pc); font-size: 1.4vw; }
  .chip.away { opacity: .3; }
  .chip.done { opacity: 1; background: rgba(255,255,255,.18); transform: translateY(-.3vh); }
  .chip.ok { background: rgba(47,179,109,.35); opacity: 1; }
  .chip.bad { background: rgba(229,72,77,.3); opacity: 1; }
  .chip .gain { color: #8ff0b5; margin-left: .3vw; }
  .chip.rk { font-size: 1.5vw; padding-right: .5vw; animation: rkChip .5s cubic-bezier(.2,1.6,.4,1) both; }
  .chip.rk.skip { opacity: 1; background: rgba(138,128,201,.3); }
  .chip .rks { display: inline-grid; place-items: center; min-width: 2.6vw; height: 2.6vw; margin-left: .5vw; border-radius: 50%; font-size: 2vw; font-weight: 900; line-height: 1; color: #fff; background: rgba(255,255,255,.15); }
  .chip.ok .rks { background: #2fb36d; } .chip.bad .rks { background: #e5001f; } .chip.skip .rks { background: none; font-size: 1.6vw; }
  @keyframes rkChip { from { transform: scale(1.5); opacity: 0; } }
  html.lite .chip.rk { animation: rkChip .5s cubic-bezier(.2,1.6,.4,1) both !important; }
  .answers { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, var(--row)); align-content: center; gap: 1.4vh 1.6vw; }
  .ans { border-radius: 1.4vw; display: flex; align-items: center; gap: 1.4vw; padding: 0 1.4vw; font-size: var(--rowfont); font-weight: 800; line-height: 1.1; background: var(--kd); border: .25vw solid var(--k); box-shadow: 0 .8vh 0 rgba(0,0,0,.25); transition: opacity .4s, transform .4s, filter .4s; position: relative; }
  .long .ans, .long .mrow { font-size: calc(var(--rowfont) * .8); } .xlong .ans, .xlong .mrow { font-size: calc(var(--rowfont) * .65); }
  .ans .shape { width: min(4.6vw, 8vh); height: min(4.6vw, 8vh); flex: none; display: grid; place-items: center; border-radius: .8vw; background: var(--k); color: var(--kt); font-size: min(3vw, 5.2vh); font-weight: 900; }
  .ans .count { margin-left: auto; background: rgba(0,0,0,.25); border-radius: 99px; padding: .2vw 1.1vw; font-size: 2vw; }
  .voters { display: flex; flex-wrap: wrap; gap: .5vw; margin-left: auto; max-width: 50%; justify-content: flex-end; }
  .vav { width: 3.6vw; height: 3.6vw; border-radius: 50%; display: grid; place-items: center; font-size: 2.2vw; background: var(--pc); border: .25vw solid #fff; animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  .ans.votes { transform: none; }
  .timesup { font-size: 2vw; font-weight: 900; color: var(--c); }
  .ans.dim { opacity: .25; filter: grayscale(.7); transform: scale(.97); }
  .ans.win { transform: scale(1.03); background: var(--k); color: var(--kt); box-shadow: 0 0 0 .4vw #fff, 0 .8vh 0 rgba(0,0,0,.25); }
  .ans.win .shape { background: var(--kt); color: var(--k); }
  .ans.win::after { content: "✓"; position: absolute; right: -1vw; top: -1.6vw; width: 3.6vw; height: 3.6vw; border-radius: 50%; background: #fff; color: var(--d); display: grid; place-items: center; font-size: 2.4vw; font-weight: 900; }
  /* Antwortfarben (A–D): dunkle Kachel, farbiger Rand, Buchstabe – bewusst kein Kahoot-Look; --k Akzent, --kd Kachel, --kt Schrift auf Akzent */
  .c0 { --k: #ec6a4c; --kd: #2c1a1a; --kt: #3a120a; } .c1 { --k: #4aa3f0; --kd: #14223a; --kt: #062a4d; }
  .c2 { --k: #e6b23a; --kd: #2a2414; --kt: #3a2a05; } .c3 { --k: #79b84a; --kd: #1a2617; --kt: #1b3309; }


  /* Fragearten */
  .tright { display: flex; gap: 1vw; align-items: center; }
  .packs { margin-top: 2.5vh; text-align: center; font-size: 1.4vw; color: var(--muted); }
  .packs.warn, .warnc { color: #ffb4b4; font-weight: 700; }
  .intro { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5vh; text-align: center; }
  .iicon { font-size: 9vw; line-height: 1; animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  .ilabel { font-size: 6vw; font-weight: 900; letter-spacing: -0.02em; color: var(--c); animation: fade .5s .15s both; }
  .icat { font-size: 2.2vw; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .12em; }
  .inum { margin-top: 3vh; width: 13vw; height: 13vw; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: 7vw; font-weight: 900; }
  .qcard.compact { padding: 2.2vh 3vw; }
  .qcard.compact .qtext { font-size: 2.8vw; }
  .imgq { flex: 1; display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 1.6vw; min-height: 0; }
  .imgbox { background: rgba(255,255,255,.06); border-radius: 1.4vw; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 0; animation: pop .5s both; }
  .imgbox { position: relative; }
  .credit { position: absolute; right: .6vw; bottom: .5vh; max-width: 90%; font-size: .95vw; font-weight: 600; color: rgba(255,255,255,.85); background: rgba(0,0,0,.55); padding: .2vh .6vw; border-radius: .5vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .imgbox img { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; display: block; }
  .answers.col { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-rows: minmax(0, var(--row)); gap: 1.4vh; min-height: 0; }
  .answers.col .vav { width: 3vw; height: 3vw; font-size: 1.8vw; }
  .estq { flex: 1; display: grid; grid-template-columns: 1.5fr 1fr; grid-template-rows: minmax(0, 1fr); gap: 1.6vw; min-height: 0; }
  .estq.noimg { grid-template-columns: 1fr; justify-items: center; }
  .estpanel { width: 100%; background: rgba(255,255,255,.06); border-radius: 1.4vw; padding: 2vh 1.4vw; display: flex; flex-direction: column; justify-content: center; min-height: 0; overflow: hidden; }
  .estq.noimg .estpanel { width: 60vw; }
  .esthint { text-align: center; font-size: 2.6vw; font-weight: 900; }
  .esthint small { display: block; font-size: 1.6vw; color: var(--muted); font-weight: 700; margin-top: 1vh; }
  .elist { display: flex; flex-direction: column; gap: 1vh; }
  .erow { display: flex; align-items: center; gap: 1vw; background: rgba(255,255,255,.08); border-radius: 99px; padding: .5vh 1.4vw .5vh .5vw; font-size: 1.8vw; font-weight: 800; animation: slide .4s both; }
  .erow .vav { width: 3vw; height: 3vw; font-size: 1.8vw; border-width: .2vw; animation: none; }
  .erow .ev { margin-left: auto; font-variant-numeric: tabular-nums; }
  .erow .eg { color: #8ff0b5; min-width: 5vw; text-align: right; font-size: 1.5vw; }
  .erow .eg.mid { color: var(--c); } .erow .eg.no { color: #ff8a8d; }
  .erow.best { background: rgba(47,179,109,.45); }
  .erow.out { opacity: .45; }
  .erow.truth { background: #fff; color: #1b1440; padding: 1vh 1.6vw; font-size: 2.2vw; animation: pop .5s both; }
  .eresult { display: flex; align-items: baseline; justify-content: center; gap: 1.2vw; margin-bottom: 2vh; }
  .eresult .elabel { font-size: 1.8vw; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
  .eresult .ebig { font-size: 5.5vw; font-weight: 900; color: var(--c); font-variant-numeric: tabular-nums; min-width: 22vw; text-align: left; }
  .eresult .ebig.landed { animation: pop .4s both; }
  html.lite .eresult .ebig.landed { animation: pop .4s both !important; }
  .elist.ehidden { visibility: hidden; }
  .erow .ed { min-width: 9vw; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .erow.best .ed { color: #fff; }
  .erow.ehead { background: none; font-size: 1.3vw; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding-top: 0; padding-bottom: 0; animation: none; }
  .erow.ehead .ev { margin-left: auto; }
  .erow.ehead .vav { visibility: hidden; }
  .erow.esort, html.lite .erow.esort { transition: transform 1.3s cubic-bezier(.6,0,.3,1), background .4s !important; animation: none !important; }
  .erow .ed, .erow .eg { transition: opacity .4s; } .erow.esort:not(.edone) .ed, .erow.esort:not(.edone) .eg { opacity: 0; }
  .elist.many .erow { font-size: 1.35vw; padding-top: 0; padding-bottom: 0; } .elist.many .erow .vav { width: 2vw; height: 2vw; font-size: 1.2vw; } .elist.many { gap: .4vh; }
  .eresult.many { margin-bottom: .6vh; } .eresult.many .ebig { font-size: 3.8vw; }
  .estpanel.reveal { justify-content: flex-start; }
  .estq.noimg .estpanel.side { width: 86vw; flex-direction: row; align-items: stretch; gap: 1.6vw; background: none; padding: 0; }
  .estpanel.side .eresult { flex: 0 0 28vw; flex-direction: column; align-items: center; justify-content: center; gap: 1vh; margin: 0; background: rgba(255,255,255,.06); border-radius: 1.4vw; }
  .estpanel.side .eresult .ebig, .estpanel.side .eresult.many .ebig { font-size: 5.8vw; min-width: 0; text-align: center; }
  /* Übergang zur Auflösung (Timing und Kurve wie beim Zuordnen) */
  .estq.noimg .estpanel.side { transition: width .8s cubic-bezier(.45,0,.2,1), gap .8s cubic-bezier(.45,0,.2,1); }
  .estpanel.side .eresult { min-width: 0; overflow: hidden; transition: flex-basis .8s cubic-bezier(.45,0,.2,1), opacity .45s ease .85s; }
  .estq.noimg .estpanel.side.pre { width: 60vw; gap: 0; }
  .estpanel.side.pre .eresult { flex-basis: 0; opacity: 0; }
  html.lite .estq.noimg .estpanel.side { transition: width .8s cubic-bezier(.45,0,.2,1), gap .8s cubic-bezier(.45,0,.2,1) !important; }
  html.lite .estpanel.side .eresult { transition: flex-basis .8s cubic-bezier(.45,0,.2,1), opacity .45s ease .85s !important; }
  .estpanel.side .elist { flex: 1; min-width: 0; background: rgba(255,255,255,.06); border-radius: 1.4vw; padding: 1.6vh 1.2vw; justify-content: center; }
  .erow .ev { min-width: 11vw; text-align: right; }
  .pincode { display: flex; gap: 1.4vw; justify-content: center; margin: 2vh 0; } .pincode span { width: 7vw; height: 9vw; border-radius: 1.2vw; background: #fff; color: #1b1440; display: grid; place-items: center; font-size: 6vw; font-weight: 900; }
  /* Geografie */
  .kq { flex: 1 1 0; min-height: 0; display: flex; gap: 1.4vw; position: relative; }
  .ktext.gone { opacity: 0; } .ktext { transition: opacity .45s; } html.lite .kq .ktext { transition: opacity .45s !important; }
  .ktext { position: absolute; left: 1.2vw; top: 1.6vh; max-width: 44vw; background: #fff; color: #1b1440; border-radius: 1vw; padding: 1.2vh 1.4vw; font-size: 2.6vw; font-weight: 900; line-height: 1.15; box-shadow: 0 .6vh 0 rgba(0,0,0,.25); }
  .ktext small { display: block; font-size: 1vw; letter-spacing: .12em; text-transform: uppercase; color: #6c5ce7; margin-bottom: .3vh; }
  .kbox { flex: 1; min-width: 0; position: relative; border-radius: 1.4vw; overflow: hidden; background: #1d2c55; }
  .kbox svg { width: 100%; height: 100%; display: block; }
  .kload { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 2vw; }
  .kmeer { fill: #1d2c55; } .kbg { fill: #2b2855; stroke: #4a4580; stroke-width: .5; vector-effect: non-scaling-stroke; }
  .krg { fill: #3a3570; stroke: #7d77bd; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill .5s, opacity .5s; }
  html.lite .krg { transition: fill .5s, opacity .5s !important; }
  .kout { fill: #0b0920; fill-opacity: .5; } .kframe { fill: none; stroke: rgba(245,176,20,.6); stroke-width: 1.5; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; }
  .ksmall { fill: #3a3570; stroke: #7d77bd; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .ksmall.kpick { fill: var(--pc); } .ksmall.kright { fill: #2fb36d; stroke: #fff; }
  .krg.kpick { fill: var(--pc); } .krg.kwrong { opacity: .55; }
  .krg.kright { fill: #2fb36d; stroke: #fff; stroke-width: 3; }
  /* Auflösung Land – wie .ans.win / .ans.dim bei Auswahlfragen */
  .kland, .khit, .kavs { transition: opacity .4s, filter .4s; }
  .kland.kdim, .khit.kdim, .kavs.kdim { opacity: .25; filter: grayscale(.7); }
  html.lite .kland.kdim, html.lite .khit.kdim { filter: none; }   /* Pi: Filter auf der ganzen Karte ist teuer – blass reicht */
  .kwin { transform-box: fill-box; transform-origin: center; transition: transform .4s; }
  .kwin.on { transform: scale(1.2); }
  .kwinrg { fill: #2fb36d; stroke: #fff; stroke-width: 4; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
  .kpin-in { animation: none; } .kpin.dim { opacity: .5; }
  .kpin.drop .kpin-in { animation: kdrop .55s cubic-bezier(.35,1.5,.55,1) both; }
  html.lite .kpin.drop .kpin-in { animation: kdrop .55s cubic-bezier(.35,1.5,.55,1) both !important; }
  @keyframes kdrop { from { transform: translateY(-500px); opacity: 0; } 40% { opacity: 1; } }

  /* Videofrage */

  /* Blockpause */

  .bpause > :not(.floaty) { position: relative; z-index: 1; }   /* schwebende Icons hinter Text, Countdown und Kategorien */
  .floaty span { position: absolute; bottom: -10vh; font-size: 5vw; opacity: .5; animation: floatup 9s linear infinite; will-change: transform; }
  @keyframes floatup { to { transform: translateY(-120vh) rotate(var(--rot, 25deg)); } }

  .nextb { font-size: 2vw; margin-top: 1vh; } .nextb b { color: var(--c); }

     „html.lite .floaty { display: none; }“ ersetzen. */

  /* Rangliste */
  .board { flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 2vh; }

  .row .bar { flex: 1; height: 1.2vh; background: rgba(255,255,255,.08); border-radius: 99px; overflow: hidden; }

  .sboard .row, html.lite .sboard .row { transition: transform 1.3s cubic-bezier(.6,0,.3,1), background .4s !important; }
  html.lite .sboard .row.lead.ranked { box-shadow: inset 0 0 0 2px var(--c) !important; }
  .row .plus { color: #8ff0b5; font-size: 1.4vw; min-width: 6vw; text-align: right; }
  @keyframes slide { from { opacity: 0; transform: translateX(-3vw); } }

  /* Ende */

  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 2vw; margin: 2vh 0 3vh; }

    animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }

  .anlnone { color: var(--muted); font-size: 1.7vw; text-align: center; font-weight: 700; }
  .anlvis.map { background: #1d2c55; }
  .anlvis.map .karte { position: absolute; inset: 0; }
</style>
</head>
<body>
<div id="app"></div>
<div class="status" id="status">Leertaste = weiter · F = Vollbild</div>
<script src="/qr.js"></script>
<script src="/icons.js"></script>
<script src="/karte.js"></script>
<script src="/anleitung.js"></script>
<script>
const SHAPES = ['A', 'B', 'C', 'D'];   // Antworten heißen A–D (Buchstabe in der Kachel)
const ANS_COLORS = ['#ec6a4c', '#4aa3f0', '#e6b23a', '#79b84a'];
const LITE = /[?&]lite=1/.test(location.search);
const KIOSK = /[?&]kiosk=1/.test(location.search);
if (LITE) document.documentElement.classList.add('lite');
// Mauszeiger nach 2 s ohne Bewegung ausblenden
let cursorTimer;
function wakeCursor() {
  if (KIOSK) return document.body.classList.add('nocursor'); // am Fernseher-Kiosk nie anzeigen
  document.body.classList.remove('nocursor'); clearTimeout(cursorTimer); cursorTimer = setTimeout(() => document.body.classList.add('nocursor'), 2000); }
addEventListener('mousemove', wakeCursor);
if (KIOSK) document.body.classList.add('nocursor'); addEventListener('DOMContentLoaded', wakeCursor);
const app = document.getElementById('app');
let S = null, lastKey = '', lastPhase = '', lastQ = 0, deadline = 0, seen = new Set(), prevScores = {};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const es = new EventSource('/events?role=tv');
let serverVersion = null;
es.onmessage = e => {
  S = JSON.parse(e.data);
  // Nach einem Update/Neustart des Servers die Seite neu laden, damit die neue Version läuft
  if (serverVersion && S.version && S.version !== serverVersion) return location.reload();
  serverVersion = S.version || serverVersion;
  render();
};
es.onerror = () => { document.getElementById('status').style.display = ''; document.getElementById('status').textContent = 'Verbindung zum Server unterbrochen – versuche neu …'; };
es.onopen = () => { document.getElementById('status').textContent = 'Leertaste = weiter · F = Vollbild'; };

function advance() { fetch('/api/advance', { method: 'POST', body: JSON.stringify({ role: 'tv' }) }); }
document.addEventListener('keydown', e => {
  if (S && S.phase === 'lobby' && S.anleitung) {   // Anleitung: Leertaste/→ weiter, ← zurück, Esc beenden
    const a = { Space: 'next', Enter: 'next', ArrowRight: 'next', ArrowLeft: 'prev', Escape: 'stop' }[e.code];
    if (a) { e.preventDefault(); fetch('/api/anleitung', { method: 'POST', body: JSON.stringify({ role: 'tv', action: a }) }); }
    return;
  }
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); advance(); }
  if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
});

function topbar(right) {
  return `<div class="topbar"><div class="brand" style="font-size:2vw">Quiz<span>Abend</span></div><div class="tright">${right || ''}</div></div>`;
}
// Punkte nach Schwierigkeit: was die Frage bringt
function ptsText(q) {
  if (!q || !q.points || q.tiebreak) return '';
  return q.perPair ? '1 Punkt je Paar' : q.perItem ? '1 Punkt je Aussage' : q.points === 1 ? '1 Punkt' : q.points + ' Punkte';
}
// Kopf bei den Fragen (eine Zeile): Uhr · Frageart + Punkte, darunter Block und Fortschritt im Block · Spieler
// Kein Logo und keine festen hellen Flächen (OLED). withTimer=false: nur der leere Ring der Uhr, damit nichts springt.
const TIMER_SVG = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/>
  <circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="#f5b014" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg>`;
const TIMER_TRACK = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="10"/></svg>`;   // vor der Frage: nur der leere Ring
function qProgress() {
  const b = S.block;
  if (!b || !b.len) return `<span>Frage ${S.qNum} / ${S.qTotal}</span>`;
  const label = b.total > 1 ? `<span>Block ${b.num}</span>` : '';
  if (b.len > 15) return label + `<span>Frage ${b.q} / ${b.len}</span>`;   // zu viele Striche: lieber als Zahl
  const dots = Array.from({ length: b.len }, (_, i) => `<i class="${i + 1 < b.q ? 'done' : i + 1 === b.q ? 'cur' : ''}"></i>`).join('');
  return label + `<span class="qdots" title="Frage ${b.q} / ${b.len}">${dots}</span>`;
}
// Pills neben dem Fragetyp: Punkte („2 Punkte“). Nach der Enthüllung der Spezialfrage zusätzlich ein eigener
// gelber Pill „⭐ Spezialfrage“, und der Faktor steht am Ende des Punkte-Pills („2 Punkte ×2“, bei Tempo-Punkten „Punkte ×2“).
function ptsPill() {
  const q = S.question;
  if (!q || q.tiebreak) return '';
  const pt = ptsText(q);
  if (S.special) return `<span class="qpts sp">${ic('star')} Spezialfrage</span><span class="qpts">${pt || 'Punkte'} ×${S.special.mult}</span>`;
  if (S.risk) return `<span class="qpts rk">${ic('triangle-exclamation')}Risikofrage</span>${pt ? `<span class="qpts">${pt}</span>` : ''}`;
  return pt ? `<span class="qpts">${pt}</span>` : '';
}
// Großer Titel im Kopf: die Frageart (die Kategorie steht wieder in der Fragekarte)
// Icon einer Frage/Frageart: Spotify-Logo aus Font Awesome, sonst das Emoji (icons.js tauscht es gegen ein Symbol)
const bicon = (q, fallback = '') => q && (q.brand === 'spotify' || q.id === 'spotify') ? ic('spotify', '#1DB954') : (q && q.icon) || fallback;
function qType(q) {
  const t = (icon, text) => `<span class="qico">${icon}</span>${text}`;
  if (q.tiebreak) return t('⚔️', 'Stechen um Platz 1');
  if (q.brand === 'spotify') return t(bicon(q), `<span class="spot">${esc(q.label)}</span>`);
  return q.label ? t(q.icon || '', esc(q.label)) : t('❓', 'Quizfrage');
}
function qSub() {
  const q = S.question;
  if (q && q.tiebreak && S.tiebreak) {
    const names = S.tiebreak.ids.map(id => (S.players.find(p => p.id === id) || {}).name).filter(Boolean);
    const who = names.length > 1 ? names.slice(0, -1).join(', ') + ' und ' + names[names.length - 1] : names[0] || '';
    return `<span>Nur ${esc(who)} ${names.length > 1 ? 'antworten' : 'antwortet'}${S.tiebreak.round > 1 ? ` · Runde ${S.tiebreak.round}` : ''} · Wer am nächsten dran ist, gewinnt</span>`;
  }
  return qProgress();
}
function qHead(withTimer) {
  const q = S.question || {};
  return `<div class="qhead">
    <div class="timer">${withTimer ? TIMER_SVG : TIMER_TRACK}<div class="num" ${withTimer ? 'id="num"' : ''}></div></div>
    <div class="qinfo"><div class="ql1"><span class="qcat">${qType(q)}</span><span id="qpts">${ptsPill()}</span></div>
      <div class="ql2">${qSub()}</div></div>
    <div class="answered" id="chips">${chips()}</div></div>`;
}
const IN_Q = ['intro', 'media', 'preview', 'question', 'locked', 'special', 'votes', 'reveal'];
const fmt = n => Math.abs(n) >= 10000 ? n.toLocaleString('de-DE') : String(n).replace('.', ',');

function render() {
  const inQ = IN_Q.includes(S.phase);
  const stage = ['intro', 'media', 'preview'].includes(S.phase) ? S.phase : 'main';
  const key = inQ ? `Q:${S.qNum}:${stage}` : S.phase + ':' + S.qNum;
  const fresh = key !== lastKey;
  if (S.remainingMs && (S.phase !== lastPhase || Math.abs(Date.now() + S.remainingMs - deadline) > 1200)) deadline = Date.now() + S.remainingMs;
  if (S.phase !== 'media' && window.__stopAudio) { window.__stopAudio(); window.__stopAudio = null; }
  // Treffer bei der Auflösung (Schätzfrage: erst wenn die Zahl steht; Zuordnen: bei jedem Paar, das einrastet)
  if (S.phase === 'reveal' && lastPhase !== 'reveal' && !(S.question && ['estimate', 'match', 'tf'].includes(S.question.kind))) shot(revealSound, 0.85);
  if (S.phase === 'lobby' && lastPhase !== 'lobby') [blockMusic, scoresMusic, revealSound, winSound, specialSound, riskSound, countdownMusic].forEach(t => { t.buf = null; }); // neu laden (falls Datei getauscht)
  if (soundOn()) [blockMusic, scoresMusic, revealSound, winSound, specialSound, riskSound, countdownMusic].forEach(t => t.load());
  lastKey = key; lastPhase = S.phase;
  frozenOverlay(); systemOverlay(); pinResetOverlay(); infoUpdate();

  document.getElementById('status').style.display = (!KIOSK && S.phase === 'lobby' && !S.anleitung) ? '' : 'none';
  if (S.phase === 'lobby') { prevScores = {}; if (S.anleitung) return renderAnleitung(); anlKey = ''; return renderLobby(); }
  if (S.phase === 'ident') return fresh ? renderIdent() : null;
  if (S.phase === 'opening') return fresh ? renderOpening() : null;
  if (S.phase === 'block') return fresh ? renderBlock() : null;
  if (S.phase === 'tiebreak') return fresh ? renderTiebreak() : null;
  if (S.phase === 'risk') return fresh ? renderRisk() : null;
  if (S.phase === 'pause') return fresh ? renderBlockPause() : null;
  if (stage === 'intro') return fresh ? renderIntro() : null;
  if (stage === 'media') return fresh ? (S.question.flash ? renderFlash() : S.question.audio ? renderAudio() : S.question.spotify ? renderSpotify() : renderVideo()) : null;
  if (stage === 'preview') return fresh ? renderPreview() : null;
  if (inQ) return fresh ? renderMain() : updateMain();
  { const ov = document.getElementById('special'); if (ov && S.phase !== 'special') ov.remove(); }
  if (S.phase === 'scores') return fresh ? renderScores() : null;
  if (S.phase === 'end') return fresh ? renderEnd() : null;
}

// Blöcke, Fragen und Spezialfrage zeigt jetzt das Intro – hier nur noch Warnungen
function packLine() {
  const k = S.packs || {};
  if (!k.questions) return `<div class="packs warn">⚠️ Keine Fragen aktiv – 👑 wählt am Handy unter ⚙️ Einstellungen Fragenpakete aus</div>`;
  return k.errors ? `<div class="packs"><span class="warnc">⚠️ ${k.errors} Fehler in Fragendateien (Details am Handy des 👑)</span></div>` : '';
}

// ---------- Intro beim Spielstart: was erwartet uns heute? ----------
// Folien im Takt der Intro-Musik (128 BPM, 1 Takt = 1,875 s)
const OPEN_SLIDES = [0, 3.75, 7.5, 11.25, 15, 18.75, 20.625];
function renderOpening() {
  const o = S.opening, nb = o.blocks.length;
  const same = o.blocks.every(x => x === o.blocks[0]);
  const cats = o.categories.slice(0, 18), more = o.categories.length - cats.length;
  const players = S.players.filter(p => p.connected);
  const an = (name, dur, delay) => `--an:${name} ${dur}s ${delay || 0}s cubic-bezier(.2,1.4,.4,1) both`;
  // „So wird gefragt“: ruhiger – weich von unten einblenden statt aufploppen, gleichmäßig über ~1,8 s verteilt
  const calm = (delay, dur = .9) => `--an:oup ${dur}s ${delay}s cubic-bezier(.25,.8,.35,1) both`;
  const tStep = Math.min(.5, 1.8 / Math.max(o.types.length, 1));
  // ohne Kopfzeile (OLED-Schonung)
  app.innerHTML = `<div class="opening">
    <div class="os"><div class="ologo anim">Quiz<span>Abend</span></div><div class="osub anim">Heute Abend erwartet euch …</div></div>
    <div class="os"><div class="obig anim" data-count="${nb}">0</div><div class="olabel anim">${nb === 1 ? 'Block' : 'Blöcke'}</div>
      ${nb > 1 ? `<div class="osub anim">${same ? `je ${o.blocks[0]} Fragen` : o.blocks.join(' + ') + ' Fragen'}${o.pause != null ? ` · 🍺 Pause nach jedem Block` : ''}</div>` : ''}</div>
    <div class="os"><div class="obig anim" data-count="${o.questions}">0</div><div class="olabel anim">Fragen</div><div class="osub anim">${o.scoring === 'level' ? 'Je schwerer die Frage, desto mehr Punkte 🧠' : 'Schnelle Antworten bringen mehr Punkte ⚡'}</div></div>
    <div class="os"><div class="olabel anim" style="${an('oup', .5)}">Das kommt dran</div>
      <div class="ochips ${cats.length > 10 ? 'many' : ''}">${cats.map((c, i) => `<span class="anim" style="${an('opop', .45, .3 + i * (2.4 / Math.max(cats.length, 1)))}">${esc(c)}</span>`).join('')}${more > 0 ? `<span class="anim more" style="${an('opop', .45, 2.8)}">+ ${more} weitere</span>` : ''}</div>
      <div class="osub anim" style="${an('oup', .5, 2.9)}">Reihenfolge? Wird nicht verraten 🤫</div></div>
    <div class="os"><div class="olabel anim" style="${an('oup', .5)}">So wird gefragt</div><div class="otypes">${o.types.map((t, i) => `<span class="anim" style="${calm(.35 + i * tStep)}"><i>${bicon(t)}</i>${esc(t.label)}</span>`).join('')}</div>
      ${o.special || o.risk ? `<div class="oextra">${o.special ? `<span class="sp anim" style="${calm(.6 + o.types.length * tStep, .8)}">⭐ Spezialfrage ×${o.special}</span>` : ''}${o.risk ? `<span class="rk anim" style="${calm(.8 + o.types.length * tStep, .8)}">${ic('triangle-exclamation')} Risikofrage</span>` : ''}</div>` : ''}</div>
    <div class="os"><div class="olabel anim" style="${an('oup', .4)}">Mit dabei</div>
      <div class="oplayers">${players.map((p, i) => `<span class="anim" style="--pc:${p.color};${an('opop', .45, .15 + i * .12)}"><i>${p.avatar}</i>${esc(p.name)}</span>`).join('')}</div></div>
    <div class="os"><div class="ologo anim" style="${an('ozoom', .6)}">Viel Glück! 🍀</div></div>
  </div>`;
  openingTick();
}
function openingTick() {
  const slides = document.querySelectorAll('.opening .os');
  if (!slides.length) return;
  const total = (S.phaseMs || 22500) / 1000;
  const left = (S.frozen ? S.remainingMs : Math.max(0, deadline - Date.now())) / 1000;
  const t = total - left;
  introMusic.lastLeft = left;
  if (!S.frozen) introMusic.play(t, left);
  let cur = 0; OPEN_SLIDES.forEach((x, i) => { if (t >= x) cur = i; });
  slides.forEach((el, i) => el.classList.toggle('on', i === cur));
  // Zahlen hochzählen
  const n = slides[cur].querySelector('[data-count]');
  // über 2,6 s, am Ende sanft abbremsend – so kann man jede Zahl mitlesen
  if (n) { const p = Math.min(1, Math.max(0, t - OPEN_SLIDES[cur] - 0.2) / 2.6); n.textContent = Math.round(Number(n.dataset.count) * (1 - Math.pow(1 - p, 2))); }
}

// Gleichstand auf Platz 1: Ansage des Stechens (ohne Kopfzeile, wie die Block-Ansage)
function renderTiebreak() {
  const tied = S.players.filter(p => S.tiebreak.ids.includes(p.id));
  app.innerHTML = `<div class="intro tbreak">
    <div class="icat">Gleichstand auf Platz 1${S.tiebreak.round > 1 ? ' – schon wieder!' : ''}</div>
    <div class="ilabel">⚔️ Stechen!</div>
    <div class="tbplayers">${tied.map((p, i) => `<span style="--pc:${p.color};animation-delay:${0.3 + i * 0.25}s"><i>${p.avatar}</i>${esc(p.name)}</span>`).join('<b>vs</b>')}</div>
    <div class="tbsub">Eine Schätzfrage entscheidet – wer am nächsten dran ist, gewinnt. Gleich nah? Dann zählt, wer schneller war.</div></div>`;
  shot(specialSound, 0.9);
}

// Risikofrage: roter Alarm vor der Frage (ohne Kopfzeile)
function renderRisk() {
  app.innerHTML = `<div class="risk"><div class="rk-beacon"></div><div class="rk-flash"></div><div class="rk-scan"></div>
    <div class="rk-tape top"><i></i></div><div class="rk-tape bot"><i></i></div>
    <div class="rk-inner"><div class="rk-sign">${ic('triangle-exclamation')}</div>
      <div class="rk-kick">ALARMSTUFE ROT</div><div class="rk-title">RISIKOFRAGE</div>
      <div class="rk-rules"><span class="ok">Richtig<b>+ Punkte</b></span><span class="bad">Falsch<b>− Punkte</b></span><span class="skip">Nicht antworten<b>± 0</b></span></div></div></div>`;
  shot(riskSound, 0.9);
}

function renderBlock() {
  const b = S.block;
  const one = b.total === 1;
  // ohne Logo/Kopfzeile: die Block-Info steht groß in der Mitte, und das OLED bekommt eine Pause von den festen Elementen
  app.innerHTML = `<div class="intro">
    <div class="icat">${one ? `${b.len} Fragen` : `Block ${b.num} von ${b.total}`}</div>
    <div class="ilabel">${b.num === 1 ? 'Los geht\'s!' : b.num === b.total ? 'Letzter Block!' : 'Nächster Block!'}</div>
    <div class="bnames">${b.names.map(n => `<span>${esc(n)}</span>`).join('')}</div></div>`;
}

const short = u => String(u).replace(/^http:\/\//, '').replace(/\/$/, '');
const wifiEsc = s => String(s).replace(/([\\;,:"])/g, '\\$1');
function joinBox() {
  const j = S.join, w = j.wifi;
  // Lesbare Adresse (quizabend.local) groß, IP klein darunter; der QR-Code nutzt weiter die IP
  const ip = j.url.replace(/\/$/, ''), main = j.local ? j.local.replace(/\/$/, '') : ip;
  const addr = `<div class="url">Adresse:<b>${esc(main)}</b>${j.local ? `<small>oder ${esc(ip)}</small>` : ''}</div>`;
  if (!w) return `<p>QR-Code scannen oder Adresse im Handy-Browser öffnen.<br>Alle Handys müssen im selben WLAN sein.</p>
    <div class="qrbox"><div class="qr">${QR.toSvg(j.url)}</div>${addr}</div>`;
  // Eigenes WLAN des Pi: erst WLAN-QR, dann Quiz-QR
  return `<p>Der Pi hat ein eigenes WLAN – verbinden, dann öffnet sich das Quiz meist von selbst (sonst 2. QR-Code).</p>
    <div class="qrbox two">
      <div class="qstep"><div class="qr sm">${QR.toSvg(`WIFI:T:WPA;S:${wifiEsc(w.ssid)};P:${wifiEsc(w.password)};;`)}</div>
        <div class="url"><b>1. WLAN</b>${esc(w.ssid)}<small>Passwort: ${esc(w.password)}</small></div></div>
      <div class="qstep"><div class="qr sm">${QR.toSvg(j.url)}</div>
        <div class="url"><b>2. Quiz</b>${esc(short(j.local || j.url))}${j.local ? `<small>oder ${esc(short(j.url))}</small>` : ''}</div></div>
    </div>`;
}

// Schutz vor Nachbildern (OLED): die Lobby wandert alle 20 s ganz langsam ein paar Pixel weiter
const SHIFTS = [[0, 0], [1.2, .8], [.4, 1.6], [-.8, 1], [-1.2, -.4], [-.4, -1.4], [.8, -1], [1.2, .2]];
const lobbyShift = () => { const [x, y] = SHIFTS[Math.floor(Date.now() / 20000) % SHIFTS.length]; return `translate(${x}vw, ${y}vh)`; };
setInterval(() => { const l = document.querySelector('.lobby'); if (l) { l.classList.add('drift'); l.style.transform = lobbyShift(); } }, 20000);
// ---------- Opener „Vier Kacheln“ (Spielstart und nach der Pause) ----------
// Zeiten passen zu sounds/standard/opener.mp3 (128 BPM): Kacheln rasten bei 0,47 / 0,70 / 0,94 / 1,17 s ein,
// „?“ bei 1,41 s, Logo ab 1,9 s, Glanz bei 3,75 s, Ausblenden ab 4,45 s. Nur transform/opacity – läuft auch am Pi.
function renderIdent() {
  const E8 = 0.234, cols = ANS_COLORS;
  const from = [['-45vw', '-40vh'], ['45vw', '-40vh'], ['-45vw', '40vh'], ['45vw', '40vh']];
  const to = [['-31vw', '-15vh'], ['31vw', '-17vh'], ['-31vw', '17vh'], ['31vw', '15vh']];   // ab der Kachel-Mitte: landen nahe den Ecken
  app.innerHTML = `<div class="ident anim" style="--an:ifade .4s 4.45s ease-in forwards">
    <div class="igrid">${cols.map((c, i) => `<i class="it anim" style="background:${c};--fx:${from[i][0]};--fy:${from[i][1]};--tx:${to[i][0]};--ty:${to[i][1]};
      --an:itin .42s ${(0.47 + i * E8 - 0.28).toFixed(2)}s cubic-bezier(.2,1.5,.4,1) both, itout .75s 1.88s cubic-bezier(.6,0,.25,1) forwards"></i>`).join('')}</div>
    <div class="iq anim" style="--an:opop .45s 1.41s cubic-bezier(.2,1.6,.4,1) both, iqout .4s 1.88s ease-in forwards">?</div>
    <div class="iword"><div class="ilogo anim" style="--an:ilogo .7s 2s cubic-bezier(.2,1.2,.4,1) both">Quiz<span>Abend</span></div>
      <div class="itag anim" style="--an:oup .5s 2.45s both">Handy raus. Hirn an.</div>
      <i class="iglint anim" style="--an:iglint .9s 3.75s ease-in-out both"></i></div>
  </div>`;
  identTick();
}
function identTick() {
  const left = (S.frozen ? S.remainingMs : Math.max(0, deadline - Date.now())) / 1000;
  const t = (S.phaseMs || 4900) / 1000 - left;
  openerMusic.lastLeft = left;
  if (!S.frozen) openerMusic.play(t, left);
}

// 🏆 Ewige Bestenliste: Siege über alle Spieleabende neben dem Namen (Spieler über den Namen wiedererkannt)
function ewigBadge(name) {
  const e = S.bestenliste && S.bestenliste.liste.find(x => x.name.toLowerCase() === String(name).trim().toLowerCase());
  return e && e.siege ? `<span class="ew">🏆 ${e.siege}</span>` : '';
}
function renderLobby() {
  if (soundOn()) { introMusic.load(); openerMusic.load(); }   // Intro-Musik und Opener schon mal laden
  const slots = [];
  for (let i = 0; i < S.maxPlayers; i++) {
    const p = S.players[i];
    if (p) {
      const isNew = !seen.has(p.id); seen.add(p.id);
      slots.push(`<div class="slot on ${isNew ? 'pop' : ''} ${p.connected ? '' : 'off'} ${p.ready ? '' : 'wait'}" style="--pc:${p.color}"><span class="av">${p.avatar}</span>${esc(p.name)}${ewigBadge(p.name)}${p.id === S.vip ? '<span class="crown">👑</span>' : ''}${p.ready ? '<span class="rdy">✓</span>' : '<span class="zz">noch nicht bereit</span>'}</div>`);
    } else slots.push(`<div class="slot">Platz frei</div>`);
  }
  const n = S.players.filter(p => p.connected).length;
  const need = Math.max(0, S.minPlayers - n);
  const waiting = S.players.filter(p => p.connected && !p.ready);

function infoUpdate() {

}
function chips() {
  const q = S.question || {};

  const tb = q.tiebreak && S.tiebreak ? S.tiebreak.ids : null;   // Stechen: nur die Punktgleichen

      if (p.result.risk) {   // Risikofrage: groß Plus, Minus oder ausgesetzt (Beträge bleiben bis zum Blockende geheim)

function soundOn() { return !S || !S.packs || !S.packs.sound || S.packs.sound.on; }
function ctx() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}
// Browser erlauben Ton oft erst nach einem Klick/Tastendruck (am Pi ist das freigeschaltet)
addEventListener('click', () => { try { ctx(); } catch (_) {} }, { once: true });

const sfx = {
  tone(freq, start, dur, { type = 'sine', gain = 0.3, attack = 0.005, filter = null } = {}) {
    const c = ctx(), o = c.createOscillator(), g = c.createGain();

    g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(gain, start + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    let node = o;
    if (filter) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter; node.connect(f); node = f; }
    node.connect(g).connect(c.destination);
    o.start(start); o.stop(start + dur + 0.05);
    return o;
  },
};

let audioCtx = null;

    <div class="pbar wide"><i id="apbar" style="width:0%"></i></div>
    ${(o.repeat || 1) > 1 ? `<div class="icat" id="arep">1. Mal von ${o.repeat}</div>` : ''}
    <div class="vhint" id="vhint" style="display:none">🔇 Ton blockiert – einmal klicken oder M drücken</div></div>${q.audioCredit ? `<div class="credit tcredit">${esc(q.audioCredit)}</div>` : ''}`;   // Quellenangabe zum Ton
  playAudio(q.audio, o).catch(() => {
    app.innerHTML += '<div class="vhint">⚠️ Audio konnte nicht abgespielt werden</div>';
    setTimeout(() => videoMsg('error'), 2500);

async function playAudio(url, o) {
  const key = S.qNum;
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const data = await (await fetch(url)).arrayBuffer();
  const full = await audioCtx.decodeAudioData(data);
  if (S.qNum !== key || S.phase !== 'media') return;      // inzwischen übersprungen
  // Ausschnitt schneiden und ggf. umdrehen
  const sr = full.sampleRate;
  const from = Math.min(full.length, Math.floor((o.start || 0) * sr));
  const to = o.dauer ? Math.min(full.length, from + Math.floor(o.dauer * sr)) : full.length;
  const buf = audioCtx.createBuffer(full.numberOfChannels, Math.max(1, to - from), sr);
  for (let c = 0; c < full.numberOfChannels; c++) {
    const part = full.getChannelData(c).slice(from, to);
    if (o.reverse) part.reverse();
    buf.copyToChannel(part, c);
  }
  // Ausschnitt so oft wie eingestellt abspielen, mit kurzer Pause dazwischen; kurzes Ein-/Ausblenden gegen Knackser
  const n = o.repeat || 1, GAP = o.gap || 2.5;   // deutlich hörbare Pause zwischen den Wiederholungen
  const t0 = audioCtx.currentTime + 0.05, len = buf.duration, total = n * len + (n - 1) * GAP;
  const srcs = [];
  for (let k = 0; k < n; k++) {
    const src = audioCtx.createBufferSource(), gain = audioCtx.createGain(), ts = t0 + k * (len + GAP);
    src.buffer = buf; src.connect(gain).connect(audioCtx.destination);
    gain.gain.setValueAtTime(0, ts); gain.gain.linearRampToValueAtTime(1, ts + Math.min(0.08, len / 4));
    gain.gain.setValueAtTime(1, ts + Math.max(0.1, len - 0.15)); gain.gain.linearRampToValueAtTime(0, ts + len);
    if (k === n - 1) src.onended = () => { if (S.qNum === key && S.phase === 'media') videoMsg('ended'); };
    src.start(ts); srcs.push(src);
  }
  videoMsg('duration', { seconds: total, position: 0 });
  window.__stopAudio = () => { srcs.forEach(s => { try { s.stop(); } catch (_) {} }); };
  if (audioCtx.state === 'suspended') {   // Autoplay gesperrt -> Hinweis, Klick/M startet den Ton
    const h = document.getElementById('vhint'); if (h) h.style.display = '';
    const go = () => { audioCtx.resume(); const x = document.getElementById('vhint'); if (x) x.remove(); };
    addEventListener('click', go, { once: true });
    addEventListener('keydown', function k(e) { if (e.key === 'm' || e.key === 'M') { go(); removeEventListener('keydown', k); } });
  }
  const tick = setInterval(() => {
    const b = document.getElementById('apbar');
    if (!b || S.phase !== 'media' || S.qNum !== key) { clearInterval(tick); return; }
    const el = audioCtx.currentTime - t0;
    b.style.width = Math.min(100, el / total * 100) + '%';
    const r = document.getElementById('arep');
    if (r) { const k = Math.min(n - 1, Math.floor(Math.max(0, el) / (len + GAP))), inGap = el - k * (len + GAP) > len && k < n - 1;
      r.textContent = inGap ? `Pause … gleich das ${k + 2}. Mal` : `${k + 1}. Mal von ${n}`; }
  }, 200);
}

// ---------- Spotify-Musikfrage: der Ausschnitt läuft auf dem Spotify-Gerät (Receiver), hier nur die Anzeige ----------
function renderSpotify() {
  const q = S.question, o = q.audioOpts || {}, key = S.qNum;
  const n = o.repeat || 1, len = o.dauer || 10, GAP = o.gap || 2.5, total = n * len + (n - 1) * GAP;
  app.innerHTML = `<div class="intro">
    <div class="iicon sc">${bicon(q, '🎵')}</div><div class="ilabel spot">Hör genau hin!</div>
    <div class="icat" id="astat">Gleich geht's los …</div>
    <div class="eq spot">${Array.from({ length: 9 }, (_, i) => `<i style="animation-delay:${i * 0.11}s"></i>`).join('')}</div>
    <div class="pbar wide spot"><i id="apbar" style="width:0%"></i></div>
    ${n > 1 ? `<div class="icat" id="arep">1. Mal von ${n}</div>` : ''}</div>`;
  // Der Balken läuft erst los, wenn der Pi meldet, dass Spotify wirklich spielt (S.question.snip, je Wiederholung),
  // plus SPOT_LAG – so lange braucht der Ton vom Befehl bis aus dem Lautsprecher (das Gerät ist seit der
  // Ankündigung schon wach, daher nur 0,3 s; gleicher Wert wie SNIP_TAIL_MS in spotify.js).
  const SPOT_LAG = 0.3;
  let base = null, k = 0;
  const tick = setInterval(() => {
    const b = document.getElementById('apbar');
    if (!b || S.phase !== 'media' || S.qNum !== key) { clearInterval(tick); return; }
    const sn = S.question && S.question.snip;
    if (sn && (base === null || sn.k !== k)) { k = sn.k; base = Date.now() - sn.sinceMs + SPOT_LAG * 1000; const st = document.getElementById('astat'); if (st) st.textContent = 'Läuft über Spotify'; }
    if (base === null) return;
    const inRep = Math.min(len, Math.max(0, (Date.now() - base) / 1000));
    const pauseDone = inRep >= len && k < n - 1 ? Math.min(GAP, (Date.now() - base) / 1000 - len) : 0;
    b.style.width = Math.min(100, (k * (len + GAP) + inRep + Math.max(0, pauseDone)) / total * 100) + '%';
    const r = document.getElementById('arep');
    if (r) r.textContent = inRep >= len && k < n - 1 ? `Pause … gleich das ${k + 2}. Mal` : `${k + 1}. Mal von ${n}`;
  }, 100);
}

// ---------- Frage + Auflösung ----------
function renderMain() {
  const q = S.question;
  const head = `<div class="qcard ${q.image || q.kind === 'match' || q.kind === 'tf' || q.map ? 'compact' : ''}"><div class="cat">${esc(q.category)}</div><div class="qtext">${esc(q.text)}</div></div>`;
  const img = q.image ? `<div class="imgbox"><img src="${q.image}" alt="">${q.credit ? `<div class="credit">${esc(q.credit)}</div>` : ''}</div>` : '';   // Quellenangabe klein im Bild
  let body = '';
  if (q.kind === 'choice') {
    const tiles = q.answers.map((a, i) => `<div class="ans c${i}" style="animation:pop .4s ${i * 0.08}s both"><span class="shape">${SHAPES[i]}</span><span class="atext">${esc(a)}</span><span class="voters"></span></div>`).join('');
    const sz = sizeCls(q.answers);
    body = q.image ? `<div class="imgq">${img}<div class="answers col ${sz}">${tiles}</div></div>` : `<div class="answers ${sz}">${tiles}</div>`;
  } else if (q.kind === 'estimate') {
    body = `<div class="estq ${q.image ? '' : 'noimg'}">${img}<div class="estpanel" id="est">
      <div class="esthint">${q.year ? '📅 Jahreszahl am Handy eingeben!' : '🔢 Schätzt am Handy!'}${q.unit && !q.year ? `<small>Antwort in ${esc(q.unit)}</small>` : ''}${tolText(q) ? `<small>${tolText(q)}</small>` : ''}</div></div></div>`;
  } else if (q.map) {
    // Geografie: Karte groß, rechts die Liste (wer hat getippt, später Entfernung bzw. Land)
    body = `<div class="kq"><div class="kbox" id="kbox"><div class="kload">Karte lädt …</div></div><div class="ktext"><small>${esc(q.category)}</small>${esc(q.text)}</div><div class="kside" id="kside"></div></div>`;
  } else if (q.kind === 'tf') {
    // Richtig oder falsch: Aussagen untereinander, rechts das Urteil (erst „?“, bei der Auflösung RICHTIG/FALSCH)
    body = `<div class="tflist n${q.statements.length} ${sizeCls(q.statements)}">${q.statements.map((t, i) => `<div class="tfrow" id="tf${i}" style="animation-delay:${i * 0.12}s">
      <span class="mnum">${i + 1}</span><span class="tftext">${esc(t)}</span><span class="tfright"><span class="voters"></span><span class="tfv" id="tfv${i}">?</span></span></div>`).join('')}</div>`;
  } else if (q.kind === 'match') {
    // Antworten als eigene Spalte rechts (immer gemischt, nie in Lösungsreihenfolge – das sorgt der Server)
    body = `<div class="mbody"><div class="mlist n${q.left.length} ${sizeCls(q.left)}">${q.left.map((t, i) => mrow(i, t, '<span class="qm">?</span>')).join('')}</div>
      <div class="mpool">${q.right.map((t, j) => `<span class="mpiece ${t.length > 22 ? 'xl' : t.length > 14 ? 'l' : ''}" data-j="${j}" style="animation-delay:${0.2 + j * 0.08}s">${esc(t)}</span>`).join('')}</div></div>`;
  }
  app.innerHTML = qHead(true) + `<div class="qwrap ${S.phase === 'question' ? 'fade' : ''}">${q.map ? '' : head}${body}</div>`;
  updateMain();
}

function updateMain() {
  const q = S.question;
  const byId = Object.fromEntries(S.players.map(p => [p.id, p]));
  document.getElementById('chips').innerHTML = chips();
  specialOverlay();
  if (S.phase === 'locked') {   // Pub-Quiz: Zeit vorbei, der Gamemaster löst gleich auf
    const n = document.getElementById('num'); if (n) n.innerHTML = '<span class="timesup">Stopp!</span>';
    const arc = document.getElementById('arc'); if (arc) arc.style.strokeDashoffset = 276.5;
  }
  if (S.phase === 'special' || S.phase === 'votes' || S.phase === 'reveal') {
    const n = document.getElementById('num');
    if (n) n.innerHTML = S.phase === 'reveal' ? '✓' : '<span class="timesup">Stopp!</span>';
    const arc = document.getElementById('arc'); if (arc) arc.style.strokeDashoffset = 276.5;
  }
  if (q.kind === 'choice' && (S.phase === 'votes' || S.phase === 'reveal')) {
    document.querySelectorAll('.ans').forEach((el, i) => {
      const box = el.querySelector('.voters');
      if (!box.dataset.filled) {   // Emojis nacheinander auftauchen lassen
        let k = 0;
        box.innerHTML = (q.voters[i] || []).map(id => byId[id]).filter(Boolean).map(p => avatarHtml(p, 0.15 + (k++) * 0.12 + i * 0.05)).join('');
        box.dataset.filled = '1';
      }
      if (S.phase === 'reveal') { el.classList.toggle('win', i === q.correct); el.classList.toggle('dim', i !== q.correct); }
    });
  }
  if (q.kind === 'estimate' && (S.phase === 'votes' || S.phase === 'reveal')) renderEstimate(byId);
  if (q.map) renderGeo(byId);
  if (q.kind === 'tf' && S.phase === 'reveal') {
    for (let i = 0; i < q.step; i++) {
      const row = document.getElementById('tf' + i), v = document.getElementById('tfv' + i);
      if (!row || row.classList.contains('done')) continue;
      const ok = q.truths[i];
      row.classList.add('done', ok ? 'true' : 'false');
      v.className = 'tfv stamp'; v.textContent = ok ? 'Richtig' : 'Falsch';
      snapSound(); shot(revealSound, 0.6, true);
      if (i === q.statements.length - 1) tfDone();
    }
  }
  if (q.kind === 'match' && S.phase === 'reveal') {
    for (let i = 0; i < q.step; i++) {
      const row = document.getElementById('mrow' + i);
      if (!row || row.classList.contains('done')) continue;
      row.classList.add('done');
      const j = q.solution[i], ans = q.right[j], slot = document.getElementById('mr' + i);
      const fill = () => {
        slot.classList.add('filled'); row.classList.add('locked');
        // erst nur die Antwort – wer richtig lag, kommt, wenn alle Paare stehen (matchDone)
        slot.innerHTML = `<span class="mans ${ans.length > 22 ? 'xl' : ans.length > 14 ? 'l' : ''}">${esc(ans)}</span><span class="voters"></span>`;
        snapSound(); shot(revealSound, 0.6, true);
        if (document.querySelectorAll('.mright.filled').length === q.left.length) matchDone();
      };
      flyPiece(document.querySelector(`.mpiece[data-j="${j}"]`), slot, fill);
    }
  }
}


// ---------- Geografie: Karte am Fernseher ----------
// Namensschild auf der Karte: Breite nach dem echten Text messen, damit er nicht am Rand klebt
function kLabelFit(root) {
  root.querySelectorAll('.klabel').forEach(g => {
    const t = g.querySelector('text'), r = g.querySelector('rect');
    try { const w = t.getBBox().width; if (w > 0) { r.setAttribute('width', w + 32); r.setAttribute('x', -(w + 32) / 2); } } catch (_) {}
  });
}
// Frage: nur die Karte. votes: Pins fallen nacheinander / gewählte Länder färben sich. reveal: richtige Stelle, Linien, Liste.
let geoLanded = 0;
const GEO_FADE_MS = 550;   // Frage ausblenden, bevor die Tipps/Auflösung auf der Karte erscheinen
const GEO_WIN_SCALE = 1.2;   // richtiges Land bei der Auflösung (Kacheln bei Auswahlfragen: 1.03 – ein Land braucht mehr, um aufzufallen)
const GEO_LINES_S = 1.6;   // Auflösung Pin: erst Ring + Name der Stadt (sofort), danach die Linien zu den Pins
function renderGeo(byId) {
  const q = S.question, box = document.getElementById('kbox'), side = document.getElementById('kside');
  if (!box) return;
  loadKarte(q.map).then(m => {
    if (!document.contains(box)) return;
    if (!box.dataset.ready) { box.innerHTML = kSvg(m, { small: true, frame: true }); box.dataset.ready = '1'; box.dataset.phase = ''; }
    const svg = box.querySelector('svg'), over = svg.querySelector('.kover');
    kSizeSmall(svg, 6);
    if (box.dataset.phase === S.phase) return;
    box.dataset.phase = S.phase;
    const go = () => {
    // Ausschnitt: in der Frage die ganze Karte; danach auf die Tipps (und bei der Auflösung die Lösung) zoomen
    if (S.phase === 'votes' || S.phase === 'reveal') {
      const r = box.getBoundingClientRect(), pts = [];
      const addRegion = id => { const g = m.byId[id]; if (g) pts.push([g.b[0], g.b[1]], [g.b[2], g.b[3]]); };
      if (q.kind === 'pin') {
        (q.pins || []).forEach(x => pts.push(kProj(m, x.pos[0], x.pos[1])));
        if (S.phase === 'reveal') { const [x, y] = kProj(m, q.target[0], q.target[1]), [rx, ry] = kRadius(m, q.target[0], q.radius); pts.push([x - rx, y - ry], [x + rx, y + ry]); }
      }
      else { (q.picks || []).forEach(x => addRegion(x.region)); if (S.phase === 'reveal') addRegion(q.region); }
      if (pts.length) svg.setAttribute('viewBox', kFit(m, pts, r.width / r.height, q.kind === 'pin' ? 0.22 : 0.3, 0.35).join(' '));
      kSizeSmall(svg, 6);
    }
    const u = kUnit(svg);
    const players = S.players.filter(p => byId[p.id]);
    if (S.phase === 'question' || S.phase === 'locked' || S.phase === 'special') {
      side.innerHTML = `<div class="khint">${q.kind === 'pin' ? `📍 Setzt am Handy einen Pin!${q.radius ? `<small>Richtig bis ${kKm(q.radius)} daneben</small>` : ''}` : q.map === 'deutschland' ? '🗺️ Tippt am Handy auf das Bundesland!' : '🗺️ Tippt am Handy auf das Land!'}<small>Zoomen mit zwei Fingern</small></div>`;
      return;
    }
    if (q.kind === 'pin') {
      const pins = (q.pins || []).filter(x => byId[x.id]);
      if (S.phase === 'votes') {
        over.innerHTML = pins.map((x, i) => { const p = byId[x.id]; return kPin(m, x.pos[0], x.pos[1], p.color, p.avatar, u, 40, 'drop').replace('class="kpin-in"', `class="kpin-in" style="animation-delay:${0.3 + i * 0.45}s !important"`); }).join('');
        pins.forEach((_, i) => setTimeout(() => { if (S.phase === 'votes') snapSound(); }, (0.3 + i * 0.45 + 0.45) * 1000));
        side.innerHTML = `<div class="klist">${pins.map((x, i) => { const p = byId[x.id];
          return `<div class="krow" style="--pc:${p.color};animation-delay:${0.3 + i * 0.45}s"><span class="vav" style="--pc:${p.color}">${p.avatar}</span><b>${esc(p.name)}</b><i>📍 gesetzt</i></div>`; }).join('') || '<div class="khint">Niemand hat getippt 🤷</div>'}</div>`;
        return;
      }
      // Auflösung: Ring an der richtigen Stelle, gestrichelte Linien zu jedem Pin, Liste nach Entfernung
      const [tx, ty] = kProj(m, q.target[0], q.target[1]);
      const rows = pins.map(x => ({ ...x, km: kDist(x.pos, q.target) })).sort((a, b) => a.km - b.km);
      const lines = rows.map((x, i) => { const [px, py] = kProj(m, x.pos[0], x.pos[1]);
        return `<line class="kline" x1="${px}" y1="${py}" x2="${tx}" y2="${ty}" stroke="${byId[x.id].color}" stroke-width="${3 * u}" stroke-dasharray="${8 * u} ${5 * u}" style="animation-delay:${GEO_LINES_S + i * 0.3}s !important"/>`; }).join('');
      const label = q.name ? `<g transform="translate(${tx},${ty - 112 * u}) scale(${u})"><g class="klabel late"><rect x="${-(q.name.length * 9.5 + 32) / 2}" y="-17" width="${q.name.length * 9.5 + 32}" height="32" rx="10"/><text y="6" text-anchor="middle">${esc(q.name)}</text></g></g>` : '';
      // Ziel: großer goldener Pin (Font Awesome „location-dot“) fällt auf die Stadt, Schatten und Welle am Boden
      const dot = FA_SVG['location-dot'], ps = 88 / 512;
      const target = `<g transform="translate(${tx},${ty}) scale(${u})"><ellipse rx="20" ry="7" class="kshadow"/><circle r="28" class="kpulse"/>
        <g class="ktarget"><g transform="translate(${-192 * ps},${-512 * ps}) scale(${ps})"><path d="${dot[1]}" class="kgold"/></g><circle cy="-58" r="12" fill="#fff"/></g></g>`;
      const win = rows.find(x => (byId[x.id].result || {}).correct);
      // Radius, in dem ein Tipp als richtig zählt: goldener Kreis um die Stadt, mit Angabe am unteren Rand
      const [rx, ry] = kRadius(m, q.target[0], q.radius || 0);
      const circle = q.radius ? `<g class="kradius"><ellipse cx="${tx}" cy="${ty}" rx="${rx}" ry="${ry}"/></g>
        <g transform="translate(${tx},${ty + ry + 16 * u}) scale(${u})"><g class="kradtxt"><rect x="-38" y="-13" width="76" height="24" rx="12"/><text y="5" text-anchor="middle">${kKm(q.radius)}</text></g></g>` : '';
            // Reihenfolge (hinten nach vorn): Radius, Linien, goldener Ziel-Pin, Spieler-Pins (falsche blass, richtige kräftig,
      // der Nächste ganz vorn und etwas größer), Name der Stadt
      const ok = x => (byId[x.id].result || {}).correct;
      const userPin = (x, size, cls) => { const p = byId[x.id]; return kPin(m, x.pos[0], x.pos[1], p.color, p.avatar, u, size, cls); };
      over.innerHTML = circle + lines + target
        + rows.filter(x => x !== win && !ok(x)).reverse().map(x => userPin(x, 40, 'dim')).join('')
        + rows.filter(x => x !== win && ok(x)).reverse().map(x => userPin(x, 40, '')).join('')
        + (win ? userPin(win, 46, 'kpinwin') : '') + label;
      kLabelFit(over);
      side.innerHTML = `<div class="klist">${rows.map((x, i) => { const p = byId[x.id], r = p.result || {};
        return `<div class="krow ${r.correct ? 'best' : ''}" style="--pc:${p.color};animation-delay:${GEO_LINES_S + 0.2 + i * 0.3}s !important"><span class="vav" style="--pc:${p.color}">${p.avatar}</span><b>${esc(p.name)}</b><i>${kKm(x.km)}</i><span class="eg ${r.correct ? '' : r.gain ? 'mid' : 'no'}">${r.correct ? '✓' : r.gain ? '≈' : '✗'}</span></div>`; }).join('') || '<div class="khint">Niemand hat getippt 🤷</div>'}</div>`;
      setTimeout(() => { geoLanded = S.qNum; const c = document.getElementById('chips'); if (c) c.innerHTML = chips(); }, (GEO_LINES_S + rows.length * 0.3) * 1000);
      return;
    }
    // Land: gewählte Gebiete in der Farbe des ersten, der es gewählt hat; Avatare auf dem Gebiet
    const picks = (q.picks || []).filter(x => byId[x.id]), groups = {};
    picks.forEach(x => (groups[x.region] = groups[x.region] || []).push(x));
    const reveal = S.phase === 'reveal';
    svg.querySelectorAll('.krg, .ksmall').forEach(el => {
      const g = groups[el.dataset.id];
      el.classList.toggle('kpick', !!g); el.style.setProperty('--pc', g ? byId[g[0].id].color : '');
      el.classList.toggle('kright', reveal && el.dataset.id === q.region);
      el.classList.toggle('kwrong', reveal && !!g && el.dataset.id !== q.region);
    });
    const av = Object.entries(groups).map(([id, l], gi) => { const r = m.byId[id]; if (!r) return '';
      return `<g class="kavs ${reveal && id !== q.region ? 'kdim' : ''}">` + l.map((x, i) => { const p = byId[x.id];
        return `<g transform="translate(${r.c[0] + (i - (l.length - 1) / 2) * 30 * u},${r.c[1] + (r.s ? 34 * u : 0)}) scale(${u})"><g class="kav" style="animation-delay:${0.3 + gi * 0.4 + i * 0.1}s !important"><circle r="15" fill="#fff" stroke="${p.color}" stroke-width="3"/><text y="6" font-size="17" text-anchor="middle">${p.avatar}</text></g></g>`; }).join('') + '</g>'; }).join('');
    const rr = m.byId[q.region];
    // Auflösung wie bei Auswahlfragen: das richtige Land hebt sich vergrößert mit weißem Rand und ✓ heraus,
    // alles andere tritt zurück (blass, grau). Avatare auf dem richtigen Land bleiben obenauf.
    let winHtml = '';
    if (reveal && rr) {
      // immer die echte Form (bei der Auflösung ist auf das Land gezoomt, auch kleine sind dann groß genug);
      // den Tippkreis nur, wenn es keine Form gibt. Kein ✓ – das grüne Land und das Namensschild reichen.
      const shape = rr.d ? `<path class="kwinrg" d="${rr.d}"/>` : `<circle class="kwinrg" cx="${rr.c[0]}" cy="${rr.c[1]}" r="${14 * u}"/>`;
      winHtml = `<g class="kwin">${shape}</g>`;
    }
    // Namensschild mittig knapp über dem (vergrößerten) Land
    const lx = (rr ? (rr.b[0] + rr.b[2]) / 2 : 0), lcy = rr ? (rr.b[1] + rr.b[3]) / 2 : 0, ly = rr ? lcy - (lcy - rr.b[1]) * GEO_WIN_SCALE - 26 * u : 0;
    const label = reveal && rr ? `<g transform="translate(${lx},${ly}) scale(${u})"><g class="klabel ok"><rect x="${-(q.name.length * 9.5 + 32) / 2}" y="-17" width="${q.name.length * 9.5 + 32}" height="32" rx="10"/><text y="6" text-anchor="middle">${esc(q.name)}</text></g></g>` : '';
    over.innerHTML = winHtml + av + label;
    kLabelFit(over);
    if (reveal) {
      svg.querySelector('.kland').classList.add('kdim'); svg.querySelector('.khit').classList.add('kdim');
      requestAnimationFrame(() => requestAnimationFrame(() => { const w = over.querySelector('.kwin'); if (w) w.classList.add('on'); }));
    }
    side.innerHTML = `<div class="klist">${picks.map((x, i) => { const p = byId[x.id], ok = x.region === q.region;
      return `<div class="krow ${reveal && ok ? 'best' : ''}" style="--pc:${p.color};animation-delay:${reveal ? 0.2 + i * 0.12 : 0.3 + i * 0.4}s"><span class="vav" style="--pc:${p.color}">${p.avatar}</span><b>${esc(p.name)}</b><i>${reveal ? esc(x.n) : '🗺️ getippt'}</i>${reveal ? `<span class="eg ${ok ? '' : 'no'}">${ok ? '✓' : '✗'}</span>` : ''}</div>`; }).join('') || '<div class="khint">Niemand hat getippt 🤷</div>'}</div>`;
    if (reveal) setTimeout(() => { geoLanded = S.qNum; const c = document.getElementById('chips'); if (c) c.innerHTML = chips(); }, 600);
    };
    // Zur Auflösung: erst die Frage oben links ausblenden (sie liegt über der Karte), dann zoomen und auflösen

    else go();
  }).catch(() => { box.innerHTML = '<div class="kload">Karte fehlt</div>'; });
}

// Puzzleteil aus dem Vorrat in die Aussparung fliegen lassen (nur transform – läuft auch am Pi)
function flyPiece(piece, slot, done) {
  if (!piece || !slot || piece.classList.contains('gone')) return done();
  const a = piece.getBoundingClientRect(), b = slot.getBoundingClientRect();
  const ghost = piece.cloneNode(true);
  ghost.classList.add('flying');
  Object.assign(ghost.style, { left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px' });
  document.body.appendChild(ghost);
  piece.classList.add('gone');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ghost.style.transform = `translate(${b.left - a.left}px, ${b.top + (b.height - a.height) / 2 - a.top}px)`;
  }));
  setTimeout(() => { ghost.remove(); done(); }, 650);
}

function renderEstimate(byId) {
  const q = S.question, box = document.getElementById('est');
  if (!box || box.dataset.phase === S.phase) return;
  box.dataset.phase = S.phase;
  const unit = q.unit ? ' ' + esc(q.unit) : '';
  if (!q.guesses.length && S.phase === 'votes') { box.innerHTML = '<div class="esthint">Niemand hat geschätzt 🤷</div>'; return; }
  if (S.phase !== 'reveal') {
    box.innerHTML = `<div class="elist">${q.guesses.map((r, i) => {
      const p = byId[r.id]; if (!p) return '';
      return `<div class="erow" style="--pc:${p.color};animation-delay:${i * 0.15}s"><span class="vav">${p.avatar}</span><span class="en">${esc(p.name)}</span><span class="ev">${fmt(r.value)}${unit}</span></div>`;
    }).join('')}</div>`;

  }
  // Auflösung: richtiger Wert groß oben (läuft wie eine Slotmaschine ein), darunter alle Schätzungen nach Abstand
