  const rows = q.guesses.map(g => ({ ...g })).sort((x, y) => dist(x) - dist(y));
  const sign = d => d === 0 ? '±0' : (d > 0 ? '+' : '−') + fmt(Math.abs(d));
  const dunit = q.year ? ' J.' : unit;
  const byValue = q.guesses.map(g => ({ ...g })).sort((x, y) => x.value - y.value);
  const many = rows.length > (q.image ? 3 : 5) ? 'many' : '';
  // final = false: während die Zahl läuft (nach Wert sortiert, ohne Abstand/Bewertung); true: nach Abstand mit Bewertung
  const rowsHtml = (list, final) => (list.length ? `<div class="erow ehead"><span class="vav"></span><span class="en">Spieler</span><span class="ev">Schätzung</span><span class="ed">${final ? 'Abstand' : ''}</span><span class="eg"></span></div>` : '') + list.map((r, i) => {
    const p = byId[r.id]; if (!p) return '';
    const res = final ? p.result : null;
    return `<div class="erow ${res && res.correct ? 'best' : ''} ${res && res.outOfRange ? 'out' : ''}" data-id="${r.id}" style="--pc:${p.color};animation-delay:${final ? i * 0.12 : 0}s">
      <span class="vav">${p.avatar}</span><span class="en">${esc(p.name)}</span><span class="ev">${fmt(r.value)}${unit}</span><span class="ed">${final ? sign(r.value - q.value) + dunit : ''}</span>
      ${res ? `<span class="eg ${res.correct ? '' : res.gain ? 'mid' : 'no'}">${res.correct ? '✓' : res.gain ? '≈' : '✗'}</span>` : '<span class="eg"></span>'}</div>`;   // Punkte gibt's erst am Blockende
  }).join('');
  if (q.show === 'pegel') return renderPegel(box, q, byId, unit, dunit, sign, rows);
  box.classList.add('reveal');
  // ohne Bild: Ergebnis als eigene Karte links neben der Liste. Übergang wie beim Zuordnen:
  // die Box mit den Schätzungen gleitet weich nach rechts (0,8 s), dann blendet links die Ergebnis-Karte ein
  const side = !q.image;
  if (side) box.classList.add('side', 'pre');
  box.innerHTML = `<div class="eresult ${many}"><span class="elabel">Richtig</span><span class="ebig" id="ebig">&nbsp;</span></div>
    <div class="elist ${many}" id="elist">${rowsHtml(byValue, false)}</div>`;
  if (side) { void box.offsetWidth; requestAnimationFrame(() => box.classList.remove('pre')); }
  setTimeout(() => {
    if (!document.contains(box)) return;
    slotRoll(document.getElementById('ebig'), q, unit, rows, () => {
      const l = document.getElementById('elist');
      if (l) sortEstimateRows(l, rows, byId, q, unit, dunit, sign, () => { estLanded = S.qNum; const c = document.getElementById('chips'); if (c) c.innerHTML = chips(); });
      shot(revealSound, 0.85);
    });
  }, side ? EST_SHIFT_MS : 0);
}

const EST_SHIFT_MS = 1350;   // Box nach rechts (0,8 s) + Ergebnis-Karte einblenden (0,45 s), dann startet die Slotmaschine
// Wie bei der Rangliste: Zeilen gleiten auf ihre Plätze (nach Abstand), danach erscheinen Abstand und ✓/≈/✗
const EST_SORT_S = 1.3;
function sortEstimateRows(list, rows, byId, q, unit, dunit, sign, done) {
  const els = [...list.querySelectorAll('.erow[data-id]')];
  const pitch = els.length > 1 ? els[1].offsetTop - els[0].offsetTop : 0;
  els.forEach((el, from) => {
    const to = rows.findIndex(r => r.id === el.dataset.id);
    el.classList.add('esort');
    el.style.transform = `translateY(${(to - from) * pitch}px)`;
  });
  setTimeout(() => {
    if (!document.contains(list)) return;
    const head = list.querySelector('.ehead .ed'); if (head) head.textContent = 'Abstand';
    els.forEach(el => {
      const r = rows.find(x => x.id === el.dataset.id), p = byId[el.dataset.id], res = p && p.result;
      el.querySelector('.ed').textContent = sign(r.value - q.value) + (q.year ? ' J.' : (q.unit ? ' ' + q.unit : ''));
      if (res) {
        const g = el.querySelector('.eg');
        g.className = 'eg ' + (res.correct ? '' : res.gain ? 'mid' : 'no'); g.textContent = res.correct ? '✓' : res.gain ? '≈' : '✗';
        el.classList.toggle('best', !!res.correct); el.classList.toggle('out', !!res.outOfRange);
      }
      el.classList.add('edone');
    });
    done();
  }, EST_SORT_S * 1000 + 100);
}

// Slotmaschine: läuft an den Schätzungen vorbei zum richtigen Wert. Damit sie nicht vorhersagbar ist,
// gibt es mehrere Bewegungen (zufällig, nie zweimal hintereinander dieselbe):
//   hoch    – zählt von unten aufwärts, erst schnell, dann immer zäher
//   runter  – dasselbe von oben herab
//   pendel  – schießt über das Ziel hinaus und pendelt sich ein
//   finte   – bleibt scheinbar auf einer falschen Zahl stehen … und läuft dann doch weiter
//   ziffern – jede Ziffer dreht für sich, sie rasten von links nach rechts ein
const SLOT_MOTIONS = ['hoch', 'runter', 'pendel', 'finte', 'ziffern'];
let lastMotion = null;
function slotRoll(el, q, unit, rows, done) {
  const motion = (() => { const l = SLOT_MOTIONS.filter(m => m !== lastMotion); return l[Math.floor(Math.random() * l.length)]; })();
  lastMotion = motion; el.dataset.motion = motion;
  const target = q.value, dec = q.year ? 0 : (String(target).split('.')[1] || '').length, stepU = Math.pow(10, -dec);
  const minSpan = Math.max(q.year ? 25 : Math.abs(target) * 0.5, 10 * stepU);
  const below = rows.filter(r => r.value < target).map(r => target - r.value), above = rows.filter(r => r.value > target).map(r => r.value - target);
  const spanBelow = Math.max(below.length ? Math.max(...below) * 1.15 : 0, minSpan), spanAbove = Math.max(above.length ? Math.max(...above) * 1.15 : 0, minSpan);
  const round = v => dec ? +v.toFixed(dec) : Math.round(v);
  const noNeg = v => (!q.year && target >= 0) ? Math.max(0, v) : v;
  const show = v => { el.textContent = (typeof v === 'string' ? v : fmt(v)) + (q.unit ? ' ' + q.unit : ''); };
  const tick = p => { if (soundOn()) try { sfx.tone(1500 + 300 * p, ctx().currentTime + 0.005, 0.03, { type: 'triangle', gain: 0.07 }); } catch (_) {} };
  const ease = p => 1 - Math.pow(1 - p, 4);   // stark abbremsend
  const DUR = 4500, t0 = performance.now();
  let value, delay = p => 35 + 700 * Math.pow(p, 3), last = null, keepDir = 0, hold = null;
  if (motion === 'runter') {
    const start = target + spanAbove; keepDir = -1;
    value = p => { let v = round(start - (start - target) * ease(p)); return v <= target ? round(target + stepU) : v; };
  } else if (motion === 'pendel') {
    const amp = Math.max(spanBelow, spanAbove) * 0.8;
    value = p => { let v = round(noNeg(target - amp * Math.pow(1 - p, 2) * Math.cos(Math.PI * 4.5 * p))); return v === target ? round(target + stepU) : v; };
    delay = p => 45 + 500 * Math.pow(p, 3);
  } else if (motion === 'finte') {
    const start = noNeg(target - spanBelow), fake = round(Math.min(target - 2 * stepU, target - Math.max(spanBelow * 0.2, 2 * stepU)));
    value = p => p < 0.55 ? round(start + (fake - start) * ease(p / 0.55)) : p < 0.78 ? fake : (() => { let v = round(fake + (target - fake) * ((p - 0.78) / 0.22)); return v >= target ? round(target - stepU) : v; })();
    delay = p => p < 0.55 ? 35 + 700 * Math.pow(p / 0.55, 3) : p < 0.78 ? 120 : 160;
    hold = p => p >= 0.55 && p < 0.78;   // Stillstand: kein Ticken
    keepDir = 1;
  } else if (motion === 'ziffern') {
    const final = fmt(target), pos = [...final].map((c, i) => /\d/.test(c) ? i : -1).filter(i => i >= 0);
    // Ziffer i rastet bei lockAt[i] ein: von 30 % bis 100 % der Zeit, hinten immer zäher
    const lockAt = pos.map((_, k) => 0.3 + 0.7 * Math.pow((k + 1) / pos.length, 1.4));
    value = p => [...final].map((c, i) => { const k = pos.indexOf(i); return k < 0 || p >= lockAt[k] ? c : String(Math.floor(Math.random() * 10)); }).join('');
    delay = p => 55 + 200 * Math.pow(p, 2);
  } else {   // hoch
    const start = noNeg(target - spanBelow); keepDir = 1;
    value = p => { let v = round(start + (target - start) * ease(p)); return v >= target ? round(target - stepU) : v; };
  }
  const step = () => {
    if (!document.contains(el)) return;
    const p = Math.min(1, (performance.now() - t0) / DUR);
    if (p >= 1) { show(target); el.classList.add('landed'); return done(); }
    let v = value(p);
    if (keepDir && last !== null && typeof v === 'number' && (v - last) * keepDir < 0) v = last;   // nie rückwärts
    if (v !== last) { show(v); last = v; if (!(hold && hold(p))) tick(p); }
    setTimeout(step, delay(p));
  };
  last = value(0); show(last);
  setTimeout(step, 60);
}

// ---------- Schätzfrage als Pegel (Höhen und Gewichte) ----------
// Jede Schätzung ist eine Säule; ein Wasserpegel steigt bis zur richtigen Zahl. Säulen, die überflutet werden,
// lagen zu niedrig; wer am nächsten am Pegel steht, leuchtet. Nur transform/opacity werden bewegt.
const PEGEL_MS = 5200;
function renderPegel(box, q, byId, unit, dunit, sign, rows) {
  box.classList.add('reveal', 'pegel');
  const guesses = q.guesses.filter(g => byId[g.id]);
  const cap = Math.abs(q.value) * 2.5;   // Ausreißer sprengen die Skala nicht
  const top = Math.max(q.value, ...guesses.map(g => Math.min(g.value, cap))) || 1;
  // höchste Säule bei 72 %: darüber braucht die Beschriftung (Schätzung + Abstand) Platz, sonst wird sie oben abgeschnitten
  const h = v => Math.max(0, Math.min(1, v / top)) * 72;
  box.innerHTML = `<div class="pg"><div class="pgplot" id="pgplot">
      ${guesses.map((g, i) => { const p = byId[g.id];
        return `<div class="pgcol" data-id="${g.id}" style="--pc:${p.color};--h:${h(g.value)}%;animation-delay:${i * 0.12}s"><div class="pgbar"></div><span class="pgv"><small class="pgd">&nbsp;</small><b>${fmt(g.value)}${unit}${g.value > cap ? ' ↑' : ''}</b></span></div>`; }).join('')}
      <div class="pgw" id="pgw"><span class="pgwl" id="pgwl">0${unit}</span></div></div>
    <div class="pgfoot">${guesses.map(g => { const p = byId[g.id];
      return `<div class="pgf" data-id="${g.id}"><span class="vav" style="--pc:${p.color}">${p.avatar}</span><b>${esc(p.name)}</b></div>`; }).join('')}</div></div>`;
  const water = document.getElementById('pgw'), label = document.getElementById('pgwl');
  const target = q.value, dec = (String(target).split('.')[1] || '').length, round = v => dec ? +v.toFixed(dec) : Math.round(v);
  const cols = [...box.querySelectorAll('.pgcol')];
  const t0 = performance.now() + 900;   // Säulen erst wachsen lassen
  let last = null;
  const step = () => {
    if (!document.contains(water)) return;
    const p = Math.max(0, Math.min(1, (performance.now() - t0) / PEGEL_MS));
    const e = 1 - Math.pow(1 - p, 3.5), v = p >= 1 ? target : round(target * e);
    water.style.transform = `translateY(${100 - h(target) * e}%)`;
    if (v !== last) {
      label.textContent = fmt(v) + unit; last = v;
      cols.forEach(c => { const g = guesses.find(x => x.id === c.dataset.id); c.classList.toggle('under', g.value < v); });
      if (p > 0 && p < 1 && soundOn()) try { sfx.tone(700 + 500 * p, ctx().currentTime + 0.005, 0.03, { type: 'sine', gain: 0.06 }); } catch (_) {}
    }
    if (p < 1) return setTimeout(step, 35 + 500 * Math.pow(p, 3));
    // gelandet: Bewertung zeigen
    box.classList.add('landed');
    cols.forEach(c => {
      const g = guesses.find(x => x.id === c.dataset.id), res = byId[g.id].result, f = c.querySelector('.pgd');
      c.classList.toggle('best', !!(res && res.correct)); c.classList.toggle('out', !!(res && res.outOfRange));
      if (f) f.innerHTML = `${sign(g.value - target)}${dunit} <span class="eg ${res && res.correct ? '' : res && res.gain ? 'mid' : 'no'}">${res ? (res.correct ? '✓' : res.gain ? '≈' : '✗') : ''}</span>`;
    });
    shot(revealSound, 0.85);
    estLanded = S.qNum; const ch = document.getElementById('chips'); if (ch) ch.innerHTML = chips();
  };
  setTimeout(step, 60);
}

// ---------- Musik: Intro beim Spielstart + Spannungsmusik in der letzten Pausenminute ----------
// Dateien: sounds/<name>.* (eigene) oder sounds/standard/<name>.mp3
function makeTrack(name) {
  return {
    buf: null, loading: null, src: null, gain: null, lastLeft: 99, started: false,
    load() {
      if (this.buf || this.loading) return this.loading;
      return this.loading = fetch('/sounds/' + name, { cache: 'no-store' })
        .then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
        .then(d => ctx().decodeAudioData(d)).then(b => { this.buf = b; })
        .catch(() => {}).finally(() => { this.loading = null; });
    },
    // ab Stelle offset (s) abspielen; left = Sekunden bis Phasenende
    play(offset, left) {
      if (this.started || !this.buf || S.frozen || !soundOn() || left < 0.5) return;
      try {
        const c = ctx(), now = c.currentTime + 0.03, dur = this.buf.duration;
        const src = c.createBufferSource(), g = c.createGain();
        src.buffer = this.buf; src.connect(g).connect(c.destination);
        g.gain.setValueAtTime(0.8, now);
        src.start(now, Math.max(0, offset));
        if (dur - offset > left + 3) {               // viel längerer Song: zum Phasenende ausblenden
          const end = now + left; g.gain.setValueAtTime(0.8, end - 1.5); g.gain.linearRampToValueAtTime(0, end); src.stop(end + 0.05);
        }
        src.onended = () => { if (this.src === src) this.src = null; };
        this.src = src; this.gain = g; this.started = true;
      } catch (_) {}
    },
    // Phase vorbei: bei natürlichem Ende ausklingen lassen, sonst (übersprungen) ausblenden
    leave() {
      if (this.lastLeft > 1.2) this.stop(); else this.src = null;   // bis 1,2 s vor Schluss gilt als natürliches Ende (Uhren von TV und Server weichen leicht ab)
      this.buf = null; this.started = false; this.lastLeft = 99;   // nächstes Mal neu laden (falls Datei getauscht)
    },
    stop() {
      const src = this.src, g = this.gain; this.src = null; this.started = false;
      if (!src) return;
      try { const t = audioCtx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.4); src.stop(t + 0.45); } catch (_) {}
    },
  };
}
const introMusic = makeTrack('quiz-intro');
const openerMusic = makeTrack('opener');
const blockMusic = makeTrack('block-start');
const scoresMusic = makeTrack('rangliste');   // läuft synchron zum Balken-Aufbau und Einsortieren
const revealSound = makeTrack('aufloesung'), winSound = makeTrack('siegerehrung'), specialSound = makeTrack('spezialfrage'), riskSound = makeTrack('risikofrage');
// kurze Jingles einfach abspielen
// solo: einen noch klingenden Durchgang desselben Jingles vorher kurz ausblenden (sonst addieren sie sich und es knackt)
function shot(track, gain, solo) {
  if (!soundOn() || !track.buf) return;
  try {
    const c = ctx(), now = c.currentTime;
    if (solo && track.shotSrc) { const o = track.shotSrc; o.g.gain.cancelScheduledValues(now); o.g.gain.setValueAtTime(o.g.gain.value, now); o.g.gain.linearRampToValueAtTime(0, now + 0.08); o.src.stop(now + 0.1); }
    const src = c.createBufferSource(), g = c.createGain(); g.gain.value = gain; src.buffer = track.buf; src.connect(g).connect(c.destination); src.start(now + 0.02);
    track.shotSrc = { src, g }; src.onended = () => { if (track.shotSrc && track.shotSrc.src === src) track.shotSrc = null; };
  } catch (_) {}
}
const finale = makeTrack('pause-finale');
const countdownMusic = makeTrack('countdown');
countdownMusic.update = function (left) {
  this.lastLeft = left;
  // Die Zeit läuft bei Sekunde 10 der Datei ab (kürzere Datei: an ihrem Ende); danach darf sie ausklingen
  const lead = Math.min(10, this.buf ? this.buf.duration : 10);
  if (!this.buf || left > lead) return;
  this.play(lead - left, left);
};
// Pausenmusik: startet bei 1:00 (bzw. so, dass ein kürzerer Song genau zum Ende aufhört)
finale.update = function (left) {
  this.lastLeft = left;
  if (!this.buf) return;
  const lead = Math.min(60, this.buf.duration);
  if (left > lead + 0.3) return this.stop();         // Pause verlängert
  this.play(lead - left, left);
};

function tick() {
  if ((!S || S.phase !== 'pause') && (finale.started || finale.src)) finale.leave();
  if ((!S || S.phase !== 'question') && (countdownMusic.started || countdownMusic.src)) countdownMusic.leave();
  if ((!S || S.phase !== 'opening') && (introMusic.started || introMusic.src)) introMusic.leave();
  if (S && S.phase === 'opening') openingTick();
  if ((!S || S.phase !== 'ident') && (openerMusic.started || openerMusic.src)) openerMusic.leave();
  if (S && S.phase === 'ident') identTick();
  // Musik, die genau eine Phase begleitet (Block-Ansage, Rangliste)
  for (const [phase, m] of [['block', blockMusic], ['scores', scoresMusic]]) {
    if ((!S || S.phase !== phase) && (m.started || m.src)) m.leave();
    if (S && S.phase === phase && S.phaseMs) {
      const left = (S.frozen ? S.remainingMs : Math.max(0, deadline - Date.now())) / 1000;
      m.lastLeft = left; if (!S.frozen) m.play(S.phaseMs / 1000 - left, left);
    }
  }
  if (S && S.phase === 'pause') {
    const el = document.getElementById('pcount');
    if (el && S.phaseMs) {
      const left = S.frozen ? S.remainingMs : Math.max(0, deadline - Date.now());
      // Der Server hängt 1,5 s an, in denen 0:00 stehen bleibt; der große Schlussschlag der Musik (bei 59 s) fällt genau auf 0:00
      finale.update(left / 1000 - 0.5);
      const sec = Math.ceil(Math.max(0, left - 1500) / 1000);
      el.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    }
  } else if (S && S.question) {
    const left = S.frozen ? S.remainingMs : Math.max(0, deadline - Date.now());
    if (S.phase === 'question') {
      // Spannungs-Musik für die letzten Sekunden (endet genau mit der Zeit)
      if (S.frozen) countdownMusic.stop(); else countdownMusic.update(left / 1000);
      const arc = document.getElementById('arc'), num = document.getElementById('num');
      if (arc) {
        arc.style.strokeDashoffset = 276.5 * (1 - left / S.phaseMs);
        arc.style.stroke = left < 5000 ? '#e5484d' : '#f5b014';
        num.textContent = Math.ceil(left / 1000);
      }
    } else if (S.phase === 'intro') {
      const n = document.getElementById('inum'); if (n) n.textContent = Math.max(1, Math.ceil(left / 1000));
    } else if (S.phase === 'media' && S.question.flash) {
      const b = document.getElementById('fbar'); if (b) b.style.width = (left / S.phaseMs * 100) + '%';
    } else if (S.phase === 'preview') {
      const b = document.getElementById('pbar'); if (b) b.style.width = (left / S.phaseMs * 100) + '%';
    }
  }
  if (!LITE) requestAnimationFrame(tick);
}
if (LITE) setInterval(tick, 250); else tick();

// Rangliste am Blockende: erst in Beitritts-Reihenfolge (wie in der Lobby), Balken wachsen,
// dann sortieren sich alle animiert in die richtige Reihenfolge
const GROW_S = 8, SORT_S = 1.3;   // GROW_S = Zeit für den längsten Balken
function renderScores() {
  const rank = S.players, max = Math.max(1, ...rank.map(p => p.score));
  const start = [...rank].sort((a, b) => a.joined - b.joined);
  const last = S.qNum >= S.qTotal, blockNum = S.block && S.block.total > 1 ? S.block.num : 0;
  // ohne Kopfzeile (OLED-Schonung) – die Block-Info steht in der Überschrift
  app.innerHTML = `
    <div class="board sboard"><h2 id="sbtitle">${last ? 'Endstand' : blockNum ? `Zwischenstand nach Block ${blockNum} von ${S.block.total}` : 'Zwischenstand'}</h2>
      <div class="rows">${start.map((p, i) => {
        return `<div class="row" data-id="${p.id}" style="--pc:${p.color};animation-delay:${i * 0.07}s"><span class="pos"></span><span class="av">${p.avatar}</span>
          <span class="nm">${esc(p.name)}</span><span class="bar"><i data-w="${Math.max(0, p.score) / max}"></i></span>
          <span class="pts" data-to="${p.score}">0</span></div>`;   // (halbe Punkte gibt es erst im Stechen, danach kommt direkt das Podest)
      }).join('')}</div></div>`;
  prevScores = Object.fromEntries(rank.map(p => [p.id, p.score]));
  const rows = [...document.querySelectorAll('.sboard .row')];
  // 1) Alle Balken wachsen gleich schnell von links nach rechts; wer weniger Punkte hat, bleibt einfach früher stehen
  setTimeout(() => {
    rows.forEach(r => { const i = r.querySelector('.bar i'); i.style.setProperty('--gt', (i.dataset.w * GROW_S) + 's'); i.style.transform = `scaleX(${i.dataset.w})`; });
    const t0 = performance.now(), pts = rows.map(r => r.querySelector('.pts'));
    const step = () => {
      const k = Math.min(1, (performance.now() - t0) / (GROW_S * 1000));
      pts.forEach(el => { const to = Number(el.dataset.to); el.textContent = to < 0 ? to : Math.min(to, Math.round(max * k)); });   // Risikofrage: auch Minus möglich
      if (k < 1 && document.contains(pts[0])) setTimeout(step, 40);
    };
    step();
  }, 500);
  // 2) erst wenn alle Balken fertig sind: in die richtige Reihenfolge schieben
  setTimeout(() => {
    if (!rows.length || !document.contains(rows[0])) return;
    const pitch = rows.length > 1 ? rows[1].offsetTop - rows[0].offsetTop : 0;
    rows.forEach((r, from) => {
      const to = rank.findIndex(p => p.id === r.dataset.id);
      r.style.transform = `translateY(${(to - from) * pitch}px)`;
      r.classList.toggle('lead', rank[to].place === 1);
      setTimeout(() => { r.querySelector('.pos').textContent = rank[to].place + '.'; r.classList.add('ranked'); }, SORT_S * 1000);   // Gleichstand = gleicher Platz
    });
  }, 500 + GROW_S * 1000 + 500);
  // Spielende: erst wenn alle einsortiert sind, verrät die Überschrift, wie es weitergeht (sonst wäre die Spannung weg)
  if (last) setTimeout(() => {
    const h = document.getElementById('sbtitle'); if (!h) return;
    h.textContent = rank.filter(p => p.place === 1).length > 1 ? '⚔️ Gleichstand – gleich wird gestochen!' : 'Gleich kommt die Siegerehrung …';
    h.classList.add('pop');
  }, 500 + GROW_S * 1000 + 500 + SORT_S * 1000 + 300);
}

function countUp(els) {
  if (LITE) { els.forEach(el => { el.textContent = el.dataset.to; }); return; }
  const t0 = performance.now();
  (function step(t) {
    const k = Math.min(1, (t - t0) / 1200), e = 1 - Math.pow(1 - k, 3);
    els.forEach(el => { const a = +el.dataset.from, b = +el.dataset.to; el.textContent = Math.round(a + (b - a) * e); });
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

const fmtScore = n => Number.isInteger(n) ? String(n) : String(n).replace('.', ',');   // halbe Punkte aus dem Stechen
function renderEnd() {
  shot(winSound, 0.9);
  // Plätze mit Gleichstand: gleiche Punkte = gleicher Platz und gleich hohes Treppchen
  // Mit Sonderpreisen oder weiteren Plätzen wird das Podest niedriger – sonst ragt der Hinweis unten aus dem Bild
  // (am Fernseher schneidet der Rand oft noch etwas ab)
  const P = S.players, order = [1, 0, 2], compact = (S.awards || []).length > 0 || P.length > 3;
  const heights = compact ? { 1: '28vh', 2: '20vh', 3: '14vh' } : { 1: '34vh', 2: '24vh', 3: '17vh' };
  const winners = P.filter(p => p.place === 1).map(p => esc(p.name));
  const title = !P.length ? 'Spiel vorbei' : winners.length > 1 ? `${winners.slice(0, -1).join(', ')} & ${winners[winners.length - 1]} gewinnen gemeinsam!` : `${winners[0]} gewinnt!`;
  app.innerHTML = topbar(`<span class="pill">Spiel vorbei</span>`) + `
    <div class="board endb ${compact ? 'compact' : ''}"><h2>🏆 ${title}</h2>
      <div class="podium">${order.filter(i => P[i]).map(i => `
        <div class="step" style="--pc:${P[i].color};animation-delay:${(2 - i) * 0.35}s">
          <div class="who"><div class="big">${P[i].avatar}</div>${esc(P[i].name)}</div>
          <div class="block" style="height:${heights[P[i].place] || '14vh'}">${P[i].place}<small>${fmtScore(P[i].score)} ${P[i].score === 1 ? 'Punkt' : 'Punkte'}</small></div></div>`).join('')}
      </div>
      <div class="others">${P.slice(3).map(p => `<span>${p.place}. ${p.avatar} ${esc(p.name)} – ${fmtScore(p.score)}</span>`).join(' · ')}</div>
      ${awardsHtml(P)}
      <div class="hint">👑 Neue Runde am Handy starten – oder <b>Leertaste</b></div>
    </div>`;
  confetti();
}

// Sonderpreise unter dem Podest: erscheinen nacheinander, nachdem das Podest steht
function awardsHtml(P) {
  const A = S.awards || [];
  if (!A.length) return '';
  return `<div class="awards">${A.map((a, i) => { const p = P.find(x => x.id === a.id); if (!p) return '';
    return `<div class="award" style="--pc:${p.color};animation-delay:${2.2 + i * 0.6}s !important"><div class="aicon">${a.icon}</div>
      <div class="atext"><div class="atitle">${esc(a.title)}</div><div class="awho">${p.avatar} ${esc(p.name)}</div><div class="adet">${esc(a.text)}</div></div></div>`; }).join('')}</div>`;
}

function confetti() {
  if (LITE) return;
  const colors = [...ANS_COLORS, '#cc5de8', '#fff'];
  for (let i = 0; i < 120; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2.5 + Math.random() * 3 + 's';
    c.style.animationDelay = Math.random() * 1.5 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 8000);
  }
}
</script>
