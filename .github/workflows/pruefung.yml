# Automatische Prüfung bei jedem PR und jedem Push auf main.
# Grün = Code startet, Spiele laufen durch, Fragen sind gültig. Rot = bitte nicht mergen.
name: Prüfung

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax (Server, Fernseher, Handy)
        run: node code-pruefung/syntax.js
      - name: Hue-Licht (Auflösung ohne Weiß, Befehlstakt)
        run: node code-pruefung/hue.js
      - name: Ewige Bestenliste (Eintragen, Name, Zurücksetzen)
        run: node code-pruefung/bestenliste.js
      - name: Fragen im App-Repo (Testpakete)
        run: if [ -f pruefen.js ]; then node pruefen.js; else echo "pruefen.js fehlt – übersprungen"; fi
      - name: Rauchtest (zwei Spiele per API)
        run: node code-pruefung/rauchtest.js
      - name: Host-PIN (Rechte)
        run: node code-pruefung/pin.js
      - name: Anleitung (Inhalt, Folien, Ausprobieren)
        run: node code-pruefung/anleitung.js
      - name: Risikofrage (Plus, Minus, Aussetzen)
        run: node code-pruefung/risikofrage.js
      - name: Fragen-Mix (Reihenfolge der Fragearten)
        run: node code-pruefung/fragenmix.js
      - name: Technik-Test (alle Testfragen)
        run: node code-pruefung/techniktest.js
      - name: Fragen melden (Meldungen, Liste, Textdatei)
        run: node code-pruefung/meldungen.js
