# Automatische Prüfung bei jedem PR und jedem Push auf main.
# Grün = Code startet, Spiele laufen durch, Fragen sind gültig. Rot = bitte nicht mergen.
name: Prüfung

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax (Server, Fernseher, Handy)
        run: node test/syntax.js
      - name: Fragen im App-Repo (Testpakete)
        run: if [ -f pruefen.js ]; then node pruefen.js; else echo "pruefen.js fehlt – übersprungen"; fi
      - name: Rauchtest (zwei Spiele per API)
        run: node test/rauchtest.js
